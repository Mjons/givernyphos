  <body class="pre">
    <!-- The gate: the hero with the lights off. Same masthead geometry as
         the hero below it, so Enter dissolves the ground and the title
         stays put while the live sky arrives underneath. -->
    <div id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-name">
      <img class="poster" alt="" aria-hidden="true" />
      <div class="grid stage">
        <div class="masthead text">
          <h1 class="name" id="gate-name">Giverny Phos</h1>
          <p class="sub" id="gate-sub">The Hundred</p>
          <p class="line" id="gate-line">
            A hundred living galaxies. Each token is a seed; every viewing is a performance.
          </p>
          <div class="actions">
            <button type="button" class="enter" id="enter-sound">Enter with sound</button>
            <button type="button" class="enter quiet" id="enter-silent">Enter silent</button>
          </div>
          <div class="notice" id="notice" hidden></div>
        </div>
      </div>
    </div>

    <nav id="rail" aria-label="Chapters"></nav>
    <main id="chapters"></main>

    <script src="content.js"></script>
    <script src="audio.js"></script>
    <script src="site.js"></script>
  </body>
