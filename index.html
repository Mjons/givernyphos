        params.spin = rec.spin;
        velVar.material.uniforms.uSpin.value = rec.spin;
        params.doppler = rec.doppler;
        pointMat.uniforms.uDoppler.value = rec.doppler;
        params.trail = rec.share.post.trail ?? 0;
        setPostParams({ trail: params.trail });
        clearTrails();
        // Grow the scene into itself before the first frame (TOKEN_PREROLL).
        const want = TOKEN_PREROLL[rec.scene] ?? TOKEN_PREROLL.default;
        if (kickstart.remaining < want) kickstartSim(want, params.dt);
      }
      function tokenReturn() {
        if (movie.active) {
          movie.onEnd = null; // no settle/handover — we're rebuilding anyway

        }
        tokenSettle = null;
        applyTokenRecipe().then(() => {
          if (!director.enabled) toggleCinematic();
          showToast("Token", "returned");
        });
      }

      // ---- The tour: a generated opening film (TOKEN_EXPERIENCE.md §1) --
      // Played by the movie system. No scene event — the token's scene is
      // already loaded, so the seed is never re-rolled. Three templates by
      // family; direction, angles and lengths are seeded from hash:tour.
      const TOKEN_TOUR_TEMPLATE = {
        "quiet-drift": "calm",
        "dust-storm": "calm",
        coma: "calm",
        lattice: "calm",
        orrery: "calm",
        sombrero: "calm",
        horsehead: "calm",
        "milky-way": "calm",
        collision: "dynamic",
        whirlpool: "dynamic",
        cartwheel: "dynamic",
        antennae: "dynamic",
        "stephans-quintet": "dynamic",
        "bullet-cluster": "dynamic",
        "event-horizon": "well",
        sagittarius: "well",
        "virgo-m87": "well",
        birth: "well",
      };
      function buildTokenTour(rec) {

          at: 0,
          kind: "title",

          sub: `${t.Palette} · ${t.Channel} · #${hash6}`,
          holdSec: 7,

        const revealDur = 14 + Math.round(r() * 4);

          at,
          kind: "shot",
          program: "slow-reveal",
          duration: revealDur,
          camera: {
            startRadius: D * (0.42 + r() * 0.18),
            endRadius: D,
            startFov: fov - 6,
            endFov: fov,

          at,
          kind: "shot",

            at,
            kind: "shot",
            program: "track-streamer",

            program: "vertigo",

      function tokenAfterTour() {

        const c = tokenRecipe.share.cam;
        const dist = camera.position.distanceTo(controls.target);
        const fwd = new THREE.Vector3();
        camera.getWorldDirection(fwd);

          t: 0,
          dur: 4.5,
          p0: camera.position.clone(),
          p1: new THREE.Vector3(c[0], c[1], c[2]),
          l0: camera.position.clone().addScaledVector(fwd, Math.max(dist, 1)),

          return;
        }

          tokenSettle = null; // the holder took the camera — leave it
          return;
        }
        s.t += Math.min(dt, 0.05);
        const e = easeInOutCubic(Math.min(1, s.t / s.dur));
        camera.position.lerpVectors(s.p0, s.p1, e);
        controls.target.lerpVectors(s.l0, s.l1, e);

      // ---- Moments (TOKEN_EXPERIENCE.md §3) ------------------------------
      // Rare, seeded, ephemeral events inside a session: a long-exposure

      // of time in the scene; deferred while a film plays or the holder
      // is driving. Everything restores to the recipe afterwards.
      const tokenMoments = { rng: null, nextAt: 0, active: null };
      function tokenMomentsInit() {
        tokenMoments.rng = mulberry32(fold32(tokenRecipe.hash + ":moments"));
        tokenMoments.nextAt =
          performance.now() + (150 + tokenMoments.rng() * 150) * 1000;
        tokenMoments.active = null;
      }
      function tokenMomentStart(kind) {
        const rec = tokenRecipe;
        const sc = SCENES[rec.scene];
        const m = { kind, t: 0, dur: 40, label: "long exposure" };
        if (kind === "lens") {

        params.palette = sc.palette;
        params.channel = sc.channel in CHANNELS ? sc.channel : "speed";
        applyPalette(sc.palette);
        pointMat.uniforms.uChannel.value = channelValueFromName(params.channel);
        applyKindTints(sc.tint || TINT_NEUTRAL);
      }

      function applyScene(key, opts = {}) {
        const sc = SCENES[key];
        if (!sc) return;
        const immediate = !!opts.immediate;
        // A scene change rewrites every texel — the body we were
        // following no longer exists at that slot. Release quietly, and
        // wipe any frozen trail since its world-space anchors are about
        // to be meaningless.
        if (typeof followCamActive === "function" && followCamActive()) {
          followCamRelease();
        }
        if (typeof clearTrail === "function") clearTrail();
        if (typeof disposeSolarSystem === "function") disposeSolarSystem();
        // A passing ship belongs to the scene it was spawned in.
        if (typeof shipEnd === "function") shipEnd();

        // Seed the PRNG before body construction so shared seeds reproduce
        // identical initial bodies. Caller-supplied seed wins; otherwise a
        // fresh random 32-bit seed keeps each load unique.
        const seed =
          opts.seed != null ? opts.seed | 0 : (Math.random() * 0xffffffff) | 0;
        seedRng(seed);

        // If collision scene, also apply its scenario config (first available)
        if (key === "collision") {
          const scenarioName =
            opts.scenario || collision.scenario || "Antennae (prograde)";
          applyCollisionScenarioRaw(scenarioName);
        }

        // Build body state immediately
        sc.make();

        if (immediate) {
          uploadStateToGPU();
          uploadK(K_PRESETS[sc.K] || K_PRESETS.neutral);
          applySceneLook(sc);
          applyScenePhysics(sc);
          setPostParams(sc.post);
          clearTrails();
          pointMat.uniforms.uBHHighlight.value =
            sc.bhHighlight !== undefined ? sc.bhHighlight : 1.0;
          pointMat.uniforms.uSpeedMax.value =
            sc.speedMax !== undefined ? sc.speedMax : 30.0;
          pointMat.uniforms.uDoppler.value =
            sc.doppler !== undefined ? sc.doppler : 0.0;
          setPhotonRing(sc.photonRing || null);
          setPetrovaDeco(sc.petrovaDeco || null);
          setLensStatic(sc.lens || null);
          lensPass.uniforms.uStrength.value = lensState.targetStrength;
          params.bloomStrength = sc.post.bloom;
          params.bloomRadius = sc.post.bloomRadius;
          params.exposure = sc.post.exposure;
          params.ca = sc.post.ca;
          params.vignette = sc.post.vignette;
          params.grain = sc.post.grain;
          params.trail = sc.post.trail ?? 0;
          params.doppler = sc.doppler ?? 0;
          params.lens = sc.lens?.strength ?? 0;
          if (sc.pointScale !== undefined) {
            params.pointScale = sc.pointScale;
            pointMat.uniforms.uPointScale.value = sc.pointScale;
          }
          camera.position.fromArray(sc.camera.pos);
          controls.target.fromArray(sc.camera.tgt);
          camera.fov = sc.camera.fov;
          params.fov = sc.camera.fov;
          camera.updateProjectionMatrix();
          currentSceneKey = key;
          syncUIToScene();
          return;
        }

        // Eased transition
        if (transitionRaf) cancelAnimationFrame(transitionRaf);

        const fromCam = {
          pos: camera.position.clone(),
          tgt: controls.target.clone(),
          fov: camera.fov,
        };
        const toCam = {
          pos: new THREE.Vector3().fromArray(sc.camera.pos),
          tgt: new THREE.Vector3().fromArray(sc.camera.tgt),
          fov: sc.camera.fov,
        };
        const startPost = snapshotPost();
        const endPost = {
          bloom: sc.post.bloom,
          bloomRadius: sc.post.bloomRadius,
          exposure: sc.post.exposure,
          ca: sc.post.ca,
          vignette: sc.post.vignette,
          grain: sc.post.grain,
        };
        const startK = kSnapshot();
        const endK = (K_PRESETS[sc.K] || K_PRESETS.neutral).slice();
        const startFlock = velVar.material.uniforms.uFlock.value;
        const endFlock = sc.flock || 0;
        const startRad = velVar.material.uniforms.uRadiation.value;
        const endRad = sc.radiation || 0;
        const startBH = pointMat.uniforms.uBHHighlight.value;
        const endBH = sc.bhHighlight !== undefined ? sc.bhHighlight : 1.0;
        const startSM = pointMat.uniforms.uSpeedMax.value;
        const endSM = sc.speedMax !== undefined ? sc.speedMax : 30.0;
        const startDop = pointMat.uniforms.uDoppler.value;
        const endDop = sc.doppler !== undefined ? sc.doppler : 0.0;
        const startPS = pointMat.uniforms.uPointScale.value;
        const endPS = sc.pointScale !== undefined ? sc.pointScale : startPS;
        const startRingOpacity = ringMat.uniforms.uOpacity.value;
        const endRingCfg = sc.photonRing || null;
        const endRingOpacity = endRingCfg ? (endRingCfg.opacity ?? 1.0) : 0.0;
        let ringSwapped = false;
        // Petrova decorations follow the ring: fade to 0 before swapT,
        // swap config at swapT, fade in after.
        const startDecoLevel =
          petrovaDecoTarget.star > 0 || petrovaDecoTarget.planet > 0
            ? 1.0
            : 0.0;
        const endDecoCfg = sc.petrovaDeco || null;
        const startLensStrength = lensPass.uniforms.uStrength.value;
        const endLensCfg = sc.lens || null;
        const endLensStrength = endLensCfg ? (endLensCfg.strength ?? 1.0) : 0.0;
        let lensSwapped = false;

        // Transition flavour — chosen by director or opts, defaulting to dissolve.
        const flavour = opts.flavour || "dissolve";
        const FLAVOUR_DURATIONS = {
          dissolve: 3200,
          flare: 1600,
          pullback: 2400,
          pushin: 2400,
        };
        const FLAVOUR_FOV_OVERSHOOT = {
          dissolve: 0,
          flare: 0,
          pullback: 20, // widens mid-transition
          pushin: -15, // narrows mid-transition
        };
        const FLAVOUR_EXP_SPIKE = {
          dissolve: 0,
          flare: 2.0, // at t ≈ 0.7
          pullback: 0,
          pushin: 0,
        };
        const FLAVOUR_SWAP_T = {
          dissolve: 0.76, // palette lingers slightly on old
          flare: 0.72,
          pullback: 0.74,
          pushin: 0.74,
        };
        const startTime = performance.now();
        const duration = opts.durationMs || FLAVOUR_DURATIONS[flavour] || 1600;
        const fovOvershoot = FLAVOUR_FOV_OVERSHOOT[flavour] || 0;
        const expSpike = FLAVOUR_EXP_SPIKE[flavour] || 0;
        const swapT = FLAVOUR_SWAP_T[flavour] || 0.72;
        let swapped = false;
        let prevPaletteApplied = false;

        function tick() {
          const t = clamp((performance.now() - startTime) / duration, 0, 1);
          const e = easeInOutCubic(t);

          camera.position.lerpVectors(fromCam.pos, toCam.pos, e);
          controls.target.lerpVectors(fromCam.tgt, toCam.tgt, e);
          // FOV overshoot for pullback/pushin flavours — peaks mid-transition
          const fovArc = Math.sin(e * Math.PI) * fovOvershoot;
          camera.fov = lerp(fromCam.fov, toCam.fov, e) + fovArc;
          camera.updateProjectionMatrix();

          const p = lerpPost(startPost, endPost, e);
          setPostParams(p);
          // Flare flavour: exposure spike at t ≈ 0.7
          if (expSpike > 0) {
            const spike = Math.max(0, 1 - Math.abs(t - 0.7) / 0.15) * expSpike;
            renderer.toneMappingExposure = p.exposure + spike;
          }

          uploadK(lerpK(startK, endK, e));
          velVar.material.uniforms.uFlock.value = lerp(startFlock, endFlock, e);
          velVar.material.uniforms.uRadiation.value = lerp(startRad, endRad, e);
          pointMat.uniforms.uBHHighlight.value = lerp(startBH, endBH, e);
          pointMat.uniforms.uSpeedMax.value = lerp(startSM, endSM, e);
          pointMat.uniforms.uDoppler.value = lerp(startDop, endDop, e);
          pointMat.uniforms.uPointScale.value = lerp(startPS, endPS, e);

          // Photon ring: fade out to 0 before the body swap, then fade in the new one.
          if (t < swapT) {
            const k = t / swapT;
            ringMat.uniforms.uOpacity.value = lerp(startRingOpacity, 0.0, k);
          } else {
            const k = (t - swapT) / (1 - swapT);
            ringMat.uniforms.uOpacity.value = lerp(
              0.0,
              endRingOpacity,
              clamp(k, 0, 1),
            );
          }

          // Flash + body swap at swapT so the camera finishes its move into the new scene
          if (!swapped && t >= swapT) {
            swapped = true;
            const flash = $("#flash");
            flash.classList.add("active");
            // Dissolve uses a gentler flash; flare cranks it
            const flashMs = flavour === "dissolve" ? 120 : 200;
            setTimeout(() => flash.classList.remove("active"), flashMs);
            uploadStateToGPU();
            clearTrails();
            // Astrophage uniforms must land with the bodies, not at the
            // end of the transition, or a swapped-in beam sits still.
            applyAstroUniforms(sc);
          }
          if (!ringSwapped && t >= swapT) {
            ringSwapped = true;
            setPhotonRing(endRingCfg);
            ringMat.uniforms.uOpacity.value = 0.0;
            setPetrovaDeco(endDecoCfg);
            petrovaDecoLevel(0.0);
          }
          if (t < swapT) {
            petrovaDecoLevel(lerp(startDecoLevel, 0.0, t / swapT));
          } else {
            petrovaDecoLevel(clamp((t - swapT) / (1 - swapT), 0, 1));
          }

          // Gravitational lens: fade through zero at swapT, then swap static params
          if (t < swapT) {
            const k = t / swapT;
            lensPass.uniforms.uStrength.value = lerp(startLensStrength, 0.0, k);
          } else {
            const k = (t - swapT) / (1 - swapT);
            lensPass.uniforms.uStrength.value = lerp(
              0.0,
              endLensStrength,
              clamp(k, 0, 1),
            );
          }
          if (!lensSwapped && t >= swapT) {
            lensSwapped = true;
            setLensStatic(endLensCfg);
          }
          // Palette + tint swap slightly before body swap
          const palSwapT = Math.max(0.01, swapT - 0.04);
          if (!prevPaletteApplied && t >= palSwapT) {
            prevPaletteApplied = true;
            applySceneLook(sc);
          }

          if (t < 1) {
            transitionRaf = requestAnimationFrame(tick);
          } else {
            transitionRaf = null;
            applyScenePhysics(sc);
            params.bloomStrength = sc.post.bloom;
            params.bloomRadius = sc.post.bloomRadius;
            params.exposure = sc.post.exposure;
            params.ca = sc.post.ca;
            params.vignette = sc.post.vignette;
            params.grain = sc.post.grain;
            params.trail = sc.post.trail ?? 0;
            params.doppler = sc.doppler ?? 0;
            params.lens = sc.lens?.strength ?? 0;
            if (sc.pointScale !== undefined) params.pointScale = sc.pointScale;
            params.fov = sc.camera.fov;
            currentSceneKey = key;
            syncUIToScene();
          }
        }
        tick();
      }

      function applyCollisionScenarioRaw(name) {
        const s = COLLISION_SCENARIOS[name];
        if (!s) return;
        Object.assign(collision, s);
        collision.scenario = name;
        collision.galaxyMassB = collision.galaxyMassA * collision.massRatio;
      }

      // ===============================================================
      // 17. UI FRAMEWORK  (tiny DOM factory helpers)
      // ===============================================================
      function stepDecimals(step) {
        const s = String(step);
        const dot = s.indexOf(".");
        return dot < 0 ? 0 : s.length - dot - 1;
      }
      function fmtNum(v, step) {
        const d = stepDecimals(step);
        return (+v).toFixed(d);
      }

      function addHelpBadge(labelEl, hint) {
        if (!hint) return;
        const badge = el("span", "help-badge");
        badge.textContent = "?";
        badge.setAttribute("data-hint", hint);
        // Don't let a click on the badge toggle the parent input (e.g. in
        // toggle-rows where the whole row is a <label>).
        badge.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
        labelEl.appendChild(badge);
      }

      // Help tooltip is a portal in document.body so it escapes the
      // panel's overflow clipping (panel has overflow: hidden/auto and
      // a transform, which would otherwise contain and clip a descendant
      // tooltip even with position: fixed).
      const helpTip = el("div");
      helpTip.id = "help-tip";
      document.body.appendChild(helpTip);
      function positionHelpTip(badgeEl) {
        const rect = badgeEl.getBoundingClientRect();
        const pad = 8;
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        // Measure the tip after setting its text so we know its size.
        const tipW = helpTip.offsetWidth;
        const tipH = helpTip.offsetHeight;
        // Horizontal: centre on badge, clamp to viewport with 8px margin.
        let x = rect.left + rect.width / 2 - tipW / 2;
        x = Math.max(pad, Math.min(x, vw - tipW - pad));
        // Vertical: above the badge by default; below if not enough room.
        let y = rect.top - tipH - 10;
        if (y < pad) y = rect.bottom + 10;
        // Clamp vertically too (very short screens).
        y = Math.max(pad, Math.min(y, vh - tipH - pad));
        helpTip.style.left = x + "px";
        helpTip.style.top = y + "px";
      }
      document.addEventListener(
        "mouseover",
        (e) => {
          const badge = e.target.closest?.(".help-badge");
          if (!badge) return;
          helpTip.textContent = badge.getAttribute("data-hint") || "";
          // Force layout so offsetWidth/offsetHeight are correct before positioning.
          helpTip.classList.add("show");
          positionHelpTip(badge);
        },
        true,
      );
      document.addEventListener(
        "mouseout",
        (e) => {
          const badge = e.target.closest?.(".help-badge");
          if (!badge) return;
          helpTip.classList.remove("show");
        },
        true,
      );

      function Slider({
        label,
        min,
        max,
        step,
        get,
        set,
        onChange,
        fmt,
        hint,
      }) {
        const row = el("div", "slider-row");
        row.innerHTML = `
          <div class="head">
            <label></label>
            <span class="value"></span>
          </div>
          <input type="range" />
        `;
        const labelEl = row.querySelector("label");
        labelEl.textContent = label;
        addHelpBadge(labelEl, hint);
        const input = row.querySelector("input");
        const valueSpan = row.querySelector(".value");
        input.min = min;
        input.max = max;
        input.step = step;

        function render(v) {
          input.value = v;
          const pct = ((v - min) / (max - min)) * 100;
          input.style.setProperty("--pct", pct + "%");
          valueSpan.textContent = fmt ? fmt(v) : fmtNum(v, step);
        }

        input.addEventListener("input", () => {
          const v = parseFloat(input.value);
          set(v);
          render(v);
          if (onChange) onChange(v);
        });

        render(get());
        return { el: row, refresh: () => render(get()) };
      }

      function Toggle({ label, get, set, onChange, hint }) {
        const row = el("label", "toggle-row");
        row.innerHTML = `
          <label></label>
          <input type="checkbox" />
          <span class="toggle-switch"></span>
        `;
        const labelEl = row.querySelector("label");
        labelEl.textContent = label;
        addHelpBadge(labelEl, hint);
        const input = row.querySelector("input");
        input.checked = !!get();
        input.addEventListener("change", () => {
          set(input.checked);
          if (onChange) onChange(input.checked);
        });
        return {
          el: row,
          refresh: () => {
            input.checked = !!get();
          },
        };
      }

      function Pills({ options, get, set, onChange }) {
        const row = el("div", "pill-row");
        const buttons = [];
        const makePill = (opt) => {
          const b = el("button", "pill");
          b.textContent = opt.label;
          b.dataset.value = opt.value;
          b.addEventListener("click", () => {
            set(opt.value);
            render();
            if (onChange) onChange(opt.value);
          });
          row.appendChild(b);
          buttons.push(b);
        };
        options.forEach(makePill);
        function render() {
          const cur = String(get());
          for (const b of buttons) {
            b.classList.toggle("active", b.dataset.value === cur);
          }
        }
        render();
        return { el: row, refresh: render };
      }

      function Select({ label, options, get, set, onChange }) {
        const row = el("div", "select-row");
        const lb = el("label");
        lb.textContent = label;
        row.appendChild(lb);
        const sel = el("select");
        for (const opt of options) {
          const o = el("option");
          o.value = opt.value;
          o.textContent = opt.label;
          sel.appendChild(o);
        }
        sel.value = get();
        sel.addEventListener("change", () => {
          set(sel.value);
          if (onChange) onChange(sel.value);
        });
        row.appendChild(sel);
        return {
          el: row,
          refresh: () => {
            sel.value = get();
          },
        };
      }

      function ButtonRow(buttons) {
        const row = el("div", "button-row");
        for (const b of buttons) {
          const btn = el("button", "btn" + (b.primary ? " primary" : ""));
          btn.textContent = b.label;
          btn.addEventListener("click", b.onClick);
          row.appendChild(btn);
        }
        return { el: row };
      }

      function SectionTitle(text) {
        const t = el("div", "panel-section-title");
        t.textContent = text;
        return t;
      }
      function Section() {
        return el("div", "panel-section");
      }
      function ReadRow(label) {
        const r = el("div", "read-row");
        const l = el("label");
        l.textContent = label;
        const v = el("span", "val");
        v.textContent = "—";
        r.appendChild(l);
        r.appendChild(v);
        return { el: r, set: (txt) => (v.textContent = txt) };
      }

      // ===============================================================
      // 18. LEFT RAIL
      // ===============================================================
      const ICONS = {
        scenes: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="8" r="3"/><circle cx="16" cy="10" r="4"/><circle cx="10" cy="17" r="2"/></svg>`,
        palette: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><circle cx="8" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="8" r="1.2" fill="currentColor"/><circle cx="16" cy="14" r="1.2" fill="currentColor"/><circle cx="10" cy="16" r="1.2" fill="currentColor"/></svg>`,
        camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="12" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M8 7 l1.5 -2 h5 L16 7"/></svg>`,
        capture: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3 v11 m0 0 l-4 -4 m4 4 l4 -4"/><path d="M4 17 v3 h16 v-3"/></svg>`,
        settings: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="4" y1="7"  x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/><circle cx="9"  cy="7"  r="2" fill="#05060a"/><circle cx="14" cy="12" r="2" fill="#05060a"/><circle cx="8"  cy="17" r="2" fill="#05060a"/></svg>`,
        music: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="4"  y1="12" x2="4"  y2="12"/><line x1="8"  y1="8"  x2="8"  y2="16"/><line x1="12" y1="5"  x2="12" y2="19"/><line x1="16" y1="9"  x2="16" y2="15"/><line x1="20" y1="11" x2="20" y2="13"/></svg>`,
        movie: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M3 9 h3 M3 13 h3 M3 17 h3 M18 9 h3 M18 13 h3 M18 17 h3 M9 9 l4 3 l-4 3 z" stroke-linejoin="round"/></svg>`,
        keyboard: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10 h.01 M11 10 h.01 M15 10 h.01 M7 14 h10"/></svg>`,
      };

      const railEl = $("#rail");
      const panelEl = $("#panel");
      const RAIL_SECTIONS = [
        { id: "scenes", key: "B", label: "Scenes", icon: ICONS.scenes },
        { id: "palette", key: "P", label: "Palette", icon: ICONS.palette },
        { id: "camera", key: "V", label: "Camera", icon: ICONS.camera },
        { id: "music", key: "J", label: "Music", icon: ICONS.music },
        { id: "movie", key: "⇧C", label: "Movie", icon: ICONS.movie },
        { id: "capture", key: "K", label: "Capture", icon: ICONS.capture },
        { id: "settings", key: "~", label: "Settings", icon: ICONS.settings },
      ];
      const RAIL_BOTTOM = [
        { id: "_hotkeys", key: "?", label: "Hotkeys", icon: ICONS.keyboard },
      ];

      let activePanel = null; // id or null

      function buildRail() {
        railEl.innerHTML = "";
        RAIL_SECTIONS.forEach((s) => {
          const b = el("button", "rail-btn");
          b.dataset.id = s.id;
          b.innerHTML =
            s.icon +
            `<span class="rail-tooltip">${s.label}<kbd>${s.key}</kbd></span>`;
          b.addEventListener("click", () => togglePanel(s.id));
          railEl.appendChild(b);
        });
        const spacer = el("div", "rail-spacer");
        railEl.appendChild(spacer);
        RAIL_BOTTOM.forEach((s) => {
          const b = el("button", "rail-btn");
          b.dataset.id = s.id;
          b.innerHTML =
            s.icon +
            `<span class="rail-tooltip">${s.label}<kbd>${s.key}</kbd></span>`;
          b.addEventListener("click", () => toggleHotkeys());
          railEl.appendChild(b);
        });
      }
      buildRail();

      function togglePanel(id) {
        if (activePanel === id) {
          closePanel();
        } else {
          openPanel(id);
        }
      }
      function openPanel(id) {
        activePanel = id;
        buildPanel(id);
        panelEl.classList.add("open");
        for (const b of railEl.querySelectorAll(".rail-btn")) {
          b.classList.toggle("active", b.dataset.id === id);
        }
      }
      function closePanel() {
        activePanel = null;
        panelEl.classList.remove("open");
        for (const b of railEl.querySelectorAll(".rail-btn"))
          b.classList.remove("active");
      }

      // ===============================================================
      // 19. PANEL BUILDERS
      // ===============================================================
      const panelRefreshers = []; // callbacks to re-read UI values from params

      function syncUIToScene() {
        for (const fn of panelRefreshers) fn();
        updateHudFromScene();
      }

      function buildPanel(id) {
        panelEl.innerHTML = "";
        panelRefreshers.length = 0;
        // Step 9 toggle pills are torn out with the rest of the panel
        // DOM each rebuild — drop their refresher closures so
        // applyComputeBackend doesn't poke at detached nodes.
        computeBackendUIRefreshers.length = 0;
        switch (id) {
          case "scenes":
            return buildScenesPanel();
          case "palette":
            return buildPalettePanel();
          case "camera":
            return buildCameraPanel();
          case "music":
            return buildMusicPanel();
          case "movie":
            return buildMoviePanel();
          case "capture":
            return buildCapturePanel();
          case "settings":
            return buildSettingsPanel();
        }
      }

      function headerTitle(text, hint) {
        const t = el("div", "panel-title");
        t.textContent = text;
        if (hint) {
          const h = el("span", "hint");
          h.textContent = hint;
          t.appendChild(h);
        }
        return t;
      }

      function buildCameraPanel() {
        panelEl.appendChild(headerTitle("Camera", "V"));

        // --- Follow a specific body by index ---
        const followSec = Section();
        followSec.appendChild(SectionTitle("Follow a body"));

        const followRow = el("div");
        followRow.style.cssText =
          "display:flex; gap:6px; align-items:center; margin-bottom:6px;";

        const prevBtn = el("button", "pill");
        prevBtn.textContent = "◀";
        prevBtn.title = "Previous alive body";
        prevBtn.style.padding = "4px 8px";
        prevBtn.addEventListener("click", () => followCamStep(-1));

        const idxInput = el("input");
        idxInput.type = "number";
        idxInput.min = 0;
        idxInput.max = MAX_BODIES - 1;
        idxInput.placeholder = "0 – " + (MAX_BODIES - 1);
        if (followCam.bodyIndex >= 0) idxInput.value = followCam.bodyIndex;
        idxInput.style.cssText =
          "flex:1; min-width:0; background:rgba(255,255,255,0.04); " +
          "border:1px solid var(--border-1); color:var(--text-0); " +
          "padding:5px 7px; border-radius:var(--r-1); " +
          "font-family:var(--font-mono); font-size:11px; outline:none;";

        const nextBtn = el("button", "pill");
        nextBtn.textContent = "▶";
        nextBtn.title = "Next alive body";
        nextBtn.style.padding = "4px 8px";
        nextBtn.addEventListener("click", () => followCamStep(1));

        followRow.appendChild(prevBtn);
        followRow.appendChild(idxInput);
        followRow.appendChild(nextBtn);
        followSec.appendChild(followRow);

        const submitIdx = () => {
          const v = parseInt(idxInput.value, 10);
          if (Number.isFinite(v)) followCamAttachByIndex(v);
        };
        idxInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") submitIdx();
          // Don't let keypresses inside the input trigger global hotkeys
          // (F, space, etc.). The global handler ignores inputs already,
          // but stopPropagation makes it explicit.
          e.stopPropagation();
        });

        const followBtnRow = el("div");
        followBtnRow.style.cssText = "display:flex; gap:6px;";
        const goBtn = el("button", "pill");
        goBtn.textContent = "Follow";
        goBtn.style.flex = "1";
        goBtn.addEventListener("click", submitIdx);
        const relBtn = el("button", "pill");
        relBtn.textContent = "Release";
        relBtn.style.flex = "1";
        relBtn.addEventListener("click", () => followCamRelease());
        followBtnRow.appendChild(goBtn);
        followBtnRow.appendChild(relBtn);
        followSec.appendChild(followBtnRow);

        // Trail controls — drawn into the same section.
        const trailSpacer = el("div");
        trailSpacer.style.cssText =
          "height:1px; background:var(--border-1); margin:10px 0;";
        followSec.appendChild(trailSpacer);

        const trailT = Toggle({
          label: "Draw trail",
          hint: "While following a body, trace its path as a line of light. The line stays after you release, so you can orbit around and look at where it went.",
          get: () => starTrail.enabled,
          set: (v) => {
            starTrail.enabled = v;
            if (!v) {
              starTrail.recording = false;
            } else if (followCamActive()) {
              starTrail.recording = true;
            }
          },
        });
        followSec.appendChild(trailT.el);

        const sysT = Toggle({
          label: "Show planets",
          hint: "Each star gets its own procedural solar system — 2 to 8 planets, unique per body. Visible only while you're following.",
          get: () => solarSys.enabled,
          set: (v) => {
            solarSys.enabled = v;
            if (!v) {
              disposeSolarSystem();
            } else if (followCamActive() && solarSys.state === "NONE") {
              // Re-generate for the current body.
              const kind = Math.floor((followCam._vbuf[3] || 0) + 0.001);
              generateSolarSystem(followCam.bodyIndex, kind);
            }
          },
        });
        followSec.appendChild(sysT.el);

        const clearTrailBtn = el("button", "pill");
        clearTrailBtn.textContent = "Clear trail";
        clearTrailBtn.style.cssText = "width:100%; margin-top:4px;";
        clearTrailBtn.addEventListener("click", () => {
          clearTrail();
          if (followCamActive() && starTrail.enabled) {
            starTrail.recording = true;
          }
        });
        followSec.appendChild(clearTrailBtn);

        const followHint = el("div");
        followHint.style.cssText =
          "font-size:10px; color:var(--text-2); margin-top:10px; line-height:1.4;";
        followHint.textContent =
          "Type a body # and press Enter, or click a body on screen. " +
          "Press F to follow whatever's near the centre, Esc to release.";
        followSec.appendChild(followHint);
        panelEl.appendChild(followSec);

        const fovSec = Section();
        fovSec.appendChild(SectionTitle("Lens"));
        const fovS = Slider({
          label: "Field of view",
          min: 20,
          max: 90,
          step: 1,
          hint: "How wide the camera sees. Low zooms in (telephoto); high is almost fisheye.",
          get: () => params.fov,
          set: (v) => {
            params.fov = v;
            camera.fov = v;
            camera.updateProjectionMatrix();
          },
          fmt: (v) => v.toFixed(0) + "°",
        });
        fovSec.appendChild(fovS.el);
        panelRefreshers.push(() => fovS.refresh());
        const scaleS = Slider({
          label: "Render scale",
          min: 0.5,
          max: 2,
          step: 0.25,
          hint: "Device pixels per CSS pixel. Lower is the cheapest fps win on Retina / 4K displays; the density watchdog drops this to 1× before it steps down a tier.",
          get: () => renderer.getPixelRatio(),
          set: (v) => setRenderScale(v, true),
          fmt: (v) => v.toFixed(2) + "×",
        });
        fovSec.appendChild(scaleS.el);
        panelRefreshers.push(() => scaleS.refresh());
        panelEl.appendChild(fovSec);

        const motionSec = Section();
        motionSec.appendChild(SectionTitle("Motion"));
        const orbT = Toggle({
          label: "Auto-orbit when idle",
          hint: "Camera slowly orbits the scene a few seconds after you stop touching it.",
          get: () => params.autoOrbit,
          set: (v) => {
            params.autoOrbit = v;
          },
        });
        motionSec.appendChild(orbT.el);
        const drT = Toggle({
          label: "Procedural drift",
          hint: "Adds gentle, random camera motion so the shot always feels alive.",
          get: () => params.cameraDrift,
          set: (v) => {
            params.cameraDrift = v;
          },
        });
        motionSec.appendChild(drT.el);
        const cineT = Toggle({
          label: "Cinematic mode",
          hint: "Automatic director: holds on beats, re-frames the shot, and eventually cuts to a new scene. Press C.",
          get: () => director.enabled,
          set: () => {
            toggleCinematic();
          },
        });
        motionSec.appendChild(cineT.el);
        // Flavour + pace rows (only visible when cinematic is on)
        if (director.enabled) {
          // --- Flavour ---
          const flavLabel = el("div");
          flavLabel.style.cssText =
            "font-size: 10px; color: var(--text-2); letter-spacing: 0.18em; text-transform: uppercase; margin: 8px 0 6px;";
          flavLabel.textContent = "Flavour";
          motionSec.appendChild(flavLabel);
          const flavRow = el("div", "pill-row");
          for (const fk of FLAVOUR_ORDER) {
            const pill = el(
              "button",
              "pill" + (director.flavour === fk ? " active" : ""),
            );
            pill.textContent = FLAVOURS[fk].label;
            pill.addEventListener("click", () => setCinematicFlavour(fk));
            flavRow.appendChild(pill);
          }
          const rotatePill = el(
            "button",
            "pill" + (director.rotateMode ? " active" : ""),
          );
          rotatePill.textContent = "rotate";
          rotatePill.title = "Cycle the four flavours every 30 minutes";
          rotatePill.addEventListener("click", () =>
            setRotateMode(!director.rotateMode),
          );
          flavRow.appendChild(rotatePill);
          motionSec.appendChild(flavRow);

          // --- Pace ---
          const paceRow = el("div", "pill-row");
          paceRow.style.marginTop = "6px";
          const paceLabel = el("div");
          paceLabel.style.cssText =
            "font-size: 10px; color: var(--text-2); letter-spacing: 0.18em; text-transform: uppercase; margin: 8px 0 6px;";
          paceLabel.textContent = "Pace";
          motionSec.appendChild(paceLabel);
          for (const p of PACE_ORDER) {
            const pill = el(
              "button",
              "pill" + (director.pace === p ? " active" : ""),
            );
            pill.textContent = p;
            pill.addEventListener("click", () => {
              director.pace = p;
              if (activePanel === "camera") buildPanel("camera");
            });
            paceRow.appendChild(pill);

          motionSec.appendChild(paceRow);
          // State readout
          const stateRow = el("div", "read-row");
          stateRow.style.marginTop = "8px";
          const l = el("label");
          l.textContent = "State";
          const v = el("span", "val");
          const fmtMin = (s) => {
            const m = Math.floor(s / 60);
            const r = Math.floor(s % 60);
            return `${m}:${r.toString().padStart(2, "0")}`;
          };
          v.textContent =
            director.state === "DWELL"
              ? `DWELL ${fmtMin(director.stateTimer)} / ${fmtMin(director.dwellDuration)}`
              : director.state === "TRANSITION"
                ? "TRANSITION"
                : "IDLE";
          stateRow.appendChild(l);
          stateRow.appendChild(v);
          motionSec.appendChild(stateRow);

        const sfxS = Slider({
          label: "SFX volume",
          min: 0,
          max: 1,
          step: 0.01,
          get: () => sfx.volume,
          set: (v) => sfx.setVolume(v),
          fmt: (v) => Math.round(v * 100) + "%",

                const sc = SCENES[currentSceneKey];
                camera.position.fromArray(sc.camera.pos);
                controls.target.fromArray(sc.camera.tgt);
                camera.fov = sc.camera.fov;
                params.fov = sc.camera.fov;
                camera.updateProjectionMatrix();
                syncUIToScene();
              },
            },
          ]).el,
        );
        panelEl.appendChild(motionSec);

        // Viewpoints
        const vpSec = Section();
        vpSec.appendChild(SectionTitle("Saved viewpoints"));
        const grid = el("div", "viewport-slots");
        const slotBtns = [];
        for (let i = 1; i <= 9; i++) {
          const b = el("button", "vp-slot");
          b.textContent = String(i);
          b.addEventListener("click", (ev) => {
            if (ev.shiftKey) saveViewpoint(i);
            else recallViewpoint(i);
          });
          b.addEventListener("contextmenu", (ev) => {
            ev.preventDefault();
            saveViewpoint(i);
          });
          grid.appendChild(b);
          slotBtns.push(b);
        }
        vpSec.appendChild(grid);
        const hint = el("div", "vp-hint");
        hint.textContent = "click: recall · shift-click or right-click: save";
        vpSec.appendChild(hint);
        const refreshSlots = () => {
          const map = viewpointMapFor(currentSceneKey);
          slotBtns.forEach((b, i) => b.classList.toggle("saved", !!map[i + 1]));
        };
        refreshSlots();
        panelRefreshers.push(refreshSlots);
        panelEl.appendChild(vpSec);
      }

      function fmtTime(sec) {
        if (!isFinite(sec) || sec < 0) return "0:00";
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return `${m}:${s.toString().padStart(2, "0")}`;
      }

      function buildMusicPanel() {
        panelEl.appendChild(headerTitle("Music", "J"));

        // --- Now Playing hero ---
        const now = el("div", "music-now");
        const pulseDot = el("div", "music-pulse");
        const title = el("div", "music-title");
        const subtitle = el("div", "music-subtitle");
        subtitle.textContent = "ssi · ambient";
        const timing = el("div", "music-timing");
        const curT = el("span");
        curT.textContent = "0:00";
        const durT = el("span");
        durT.textContent = "0:00";
        timing.appendChild(curT);
        timing.appendChild(durT);
        const progress = el("div", "music-progress");
        const fill = el("div", "fill");
        progress.appendChild(fill);
        progress.addEventListener("click", (ev) => {
          const rect = progress.getBoundingClientRect();
          music.seek((ev.clientX - rect.left) / rect.width);
        });
        now.appendChild(pulseDot);
        now.appendChild(title);
        now.appendChild(subtitle);
        now.appendChild(timing);
        now.appendChild(progress);
        panelEl.appendChild(now);

        // --- Transport ---
        const trans = el("div", "music-transport");
        const prevBtn = el("button", "btn-trans");
        prevBtn.innerHTML = "&#9664;&#9664;";
        prevBtn.title = "Previous";
        prevBtn.addEventListener("click", () => music.prev());
        const pBtn = el("button", "btn-trans primary");
        const syncPBtn = () => {
          pBtn.innerHTML = music.playing ? "&#10074;&#10074;" : "&#9654;";
        };
        syncPBtn();
        pBtn.addEventListener("click", () => music.playPause());
        const nextBtn = el("button", "btn-trans");
        nextBtn.innerHTML = "&#9654;&#9654;";
        nextBtn.title = "Next";
        nextBtn.addEventListener("click", () => music.next());
        trans.appendChild(prevBtn);
        trans.appendChild(pBtn);
        trans.appendChild(nextBtn);
        panelEl.appendChild(trans);

        // --- Volume + shuffle ---
        const ctrlSec = Section();
        const volS = Slider({
          label: "Volume",
          min: 0,
          max: 1,
          step: 0.01,
          hint: "Soundtrack loudness.",
          get: () => music.volume,
          set: (v) => music.setVolume(v),
          fmt: (v) => Math.round(v * 100) + "%",
        });
        ctrlSec.appendChild(volS.el);
        const shufT = Toggle({
          label: "Shuffle",
          hint: "Play tracks in a random order instead of the listed one.",
          get: () => music.shuffle,
          set: (v) => music.setShuffle(v),
        });
        ctrlSec.appendChild(shufT.el);
        panelEl.appendChild(ctrlSec);

        // --- Track list ---
        const listSec = Section();
        listSec.appendChild(SectionTitle("Tracks"));
        const list = el("div", "music-list");
        TRACKS.forEach((t, i) => {
          const item = el("div", "music-item");
          const num = el("span", "num");
          num.textContent = String(i + 1).padStart(2, "0");
          const name = el("span", "name");
          name.textContent = t.title;
          item.appendChild(num);
          item.appendChild(name);
          item.addEventListener("click", () => music.load(i, true));
          list.appendChild(item);
        });
        listSec.appendChild(list);
        panelEl.appendChild(listSec);

        // --- Live update loop tied to panel lifecycle ---
        const refresh = () => {
          title.textContent = TRACKS[music.index].title;
          curT.textContent = fmtTime(music.time);
          durT.textContent = fmtTime(music.duration);
          const frac = music.duration > 0 ? music.time / music.duration : 0;
          fill.style.width = (frac * 100).toFixed(2) + "%";
          now.classList.toggle("playing", music.playing);
          syncPBtn();
          list.querySelectorAll(".music-item").forEach((node, i) => {
            node.classList.toggle("active", i === music.index);
          });
        };
        refresh();
        // Subscribe to audio events for snappy UI; tear down when panel rebuilds.
        const onTime = () => {
          if (activePanel === "music") refresh();
        };
        music.audio.addEventListener("timeupdate", onTime);
        music.audio.addEventListener("play", onTime);
        music.audio.addEventListener("pause", onTime);
        music.audio.addEventListener("loadedmetadata", onTime);
        music.audio.addEventListener("ended", onTime);
        panelRefreshers.push(refresh);
      }

      function buildMoviePanel() {
        panelEl.appendChild(headerTitle("Movie", "⇧C"));

        // Intro blurb
        const intro = el("div", "vp-hint");
        intro.style.marginBottom = "12px";
        intro.textContent = movie.active
          ? "a film is playing · Esc to stop"
          : "pick a film. play. let it end.";
        panelEl.appendChild(intro);

        // Film list
        const list = el("div");
        const filmKeys = Object.keys(FILMS);
        if (filmKeys.length === 0) {
          const empty = el("div", "vp-hint");
          empty.textContent = "no films yet";
          list.appendChild(empty);
        }
        for (const key of filmKeys) {
          const f = FILMS[key];
          const item = el("div", "film-item");
          if (
            movie.lastSelected === key ||
            (!movie.lastSelected && filmKeys[0] === key)
          ) {
            item.classList.add("selected");
          }
          if (movie.active && movie.filmKey === key) {
            item.classList.add("selected");
          }
          const name = el("span", "fname");
          name.textContent = f.name.toUpperCase();
          const dur = el("span", "fdur");
          dur.textContent = fmtMmSs(f.duration);
          item.appendChild(name);
          item.appendChild(dur);
          item.addEventListener("click", () => {
            movie.lastSelected = key;
            // Refresh list highlight
            list.querySelectorAll(".film-item").forEach((n, idx) => {
              n.classList.toggle("selected", filmKeys[idx] === key);
            });
          });
          list.appendChild(item);
        }
        panelEl.appendChild(list);

        // Controls
        const sec = Section();
        if (movie.active) {
          sec.appendChild(
            ButtonRow([
              {
                label: "Stop",
                primary: true,
                onClick: () => stopMovie(false),
              },
            ]).el,
          );

          // Elapsed readout
          const rr = ReadRow("Elapsed");
          rr.set(`${fmtMmSs(movie.elapsed)} / ${fmtMmSs(movie.film.duration)}`);
          sec.appendChild(rr.el);

          // Scrub bar — reuses music progress styling for visual consistency
          const scrub = el("div", "music-progress scrub-bar");
          scrub.style.cursor = "pointer";
          const scrubFill = el("div", "fill");
          scrub.appendChild(scrubFill);
          sec.appendChild(scrub);

          const fracAt = (ev) => {
            const rect = scrub.getBoundingClientRect();
            return clamp((ev.clientX - rect.left) / rect.width, 0, 1);
          };
          const onMove = (ev) => {
            if (!movie.scrubbing) return;
            const f = fracAt(ev);
            const t = f * movie.film.duration;
            scrubFill.style.width = (f * 100).toFixed(2) + "%";
            rr.set(`${fmtMmSs(t)} / ${fmtMmSs(movie.film.duration)}`);
          };
          const onUp = (ev) => {
            if (!movie.scrubbing) return;
            const f = fracAt(ev);
            seekMovie(f * movie.film.duration);
            movie.scrubbing = false;
            // Restore music if it was playing before the drag
            if (movie.musicWasPlaying) {
              const p = music.audio.play();
              if (p && p.catch) p.catch(() => {});
            }
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
          };
          scrub.addEventListener("pointerdown", (ev) => {
            movie.scrubbing = true;
            movie.musicWasPlaying = !music.audio.paused;
            if (movie.musicWasPlaying) music.audio.pause();
            onMove(ev);
            window.addEventListener("pointermove", onMove);
            window.addEventListener("pointerup", onUp);
          });

          // Speed pills — 1× / 2× / 4× / 8×
          const spRow = Pills({
            options: [
              { value: "1", label: "1×" },
              { value: "2", label: "2×" },
              { value: "4", label: "4×" },
              { value: "8", label: "8×" },
            ],
            get: () => String(movie.speed || 1),
            set: (v) => setMovieSpeed(parseInt(v, 10)),
          });
          const spWrap = el("div");
          spWrap.style.marginTop = "8px";
          const spLabel = el("div", "vp-hint");
          spLabel.textContent = "Speed";
          spLabel.style.marginBottom = "4px";
          spWrap.appendChild(spLabel);
          spWrap.appendChild(spRow.el);
          sec.appendChild(spWrap);

          panelRefreshers.push(() => {
            if (!movie.scrubbing) {
              const frac =
                movie.film.duration > 0
                  ? movie.elapsed / movie.film.duration
                  : 0;
              scrubFill.style.width =
                (clamp(frac, 0, 1) * 100).toFixed(2) + "%";
              rr.set(
                `${fmtMmSs(movie.elapsed)} / ${fmtMmSs(movie.film.duration)}`,
              );
            }
          });
        } else {
          sec.appendChild(
            ButtonRow([
              {
                label: "Play",
                primary: true,
                onClick: () => {
                  const key = movie.lastSelected || filmKeys[0];
                  if (key) startMovie(key);
                },
              },
            ]).el,
          );
          const note = el("div", "vp-hint");
          note.textContent =
            "plays front-to-back · camera is scripted · Esc aborts";
          sec.appendChild(note);
        }
        panelEl.appendChild(sec);
      }

            pill.addEventListener("click", () => {
              onPick(opt.value);
              if (activePanel === "capture") buildPanel("capture");
            });
            row.appendChild(pill);
          }
          parent.appendChild(row);
        };

        // Style — which renderer the primary Generate button uses.
        addPillRow(
          artSec,
          "Style",
          [
            { value: "fidenza", label: "fidenza" },
            { value: "filament", label: "filament" },

          () => captureStyle,
          (v) => {

            { value: 700, label: "sparse" },
            { value: 1500, label: "normal" },
            { value: 2600, label: "dense" },

          addPillRow(

            () => fidenzaOpts.density,
            (v) => {

          addPillRow(
            artSec,
            "Thickness",
            ["thin", "mixed", "fat"].map((t) => ({ value: t, label: t })),
            () => fidenzaOpts.thickness,
            (v) => {
              fidenzaOpts.thickness = v;
            },
          );
        } else {
          // Filament-only: scale + bead mix.
          addPillRow(
            artSec,
            "Scale",
            ["small", "mixed", "large"].map((s) => ({ value: s, label: s })),
            () => filamentOpts.scale,
            (v) => {
              filamentOpts.scale = v;
            },

          addPillRow(
            artSec,
            "Beads",
            ["classic", "bold", "quiet"].map((b) => ({ value: b, label: b })),
            () => filamentOpts.beadMix,
            (v) => {
              filamentOpts.beadMix = v;
            },
          );
        }

        // Background — shared between both styles.
        addPillRow(
          artSec,
          "Background",
          ["ink", "cream", "void"].map((b) => ({ value: b, label: b })),
          () => fidenzaOpts.bg,
          (v) => {
            fidenzaOpts.bg = v;
            filamentOpts.bg = v;
          },
        );

        // Single primary Generate button — respects the active Style. Both
        // hotkeys (I for Fidenza, U for Filament) still work directly, so
        // users who learned them keep their quick path.
        const genLabel =
          captureStyle === "fidenza" ? "Generate (I)" : "Generate (U)";
        artSec.appendChild(
          ButtonRow([
            {
              label: genLabel,
              primary: true,
              onClick: () => {
                if (captureStyle === "fidenza") generateFidenza();
                else generateFilament();
              },
            },
          ]).el,
        );
        const artHint = el("div", "vp-hint");
        artHint.style.marginTop = "8px";
        artHint.textContent =
          captureStyle === "fidenza"
            ? "Vector reinterpretation — flow-field ink ribbons from this frame's motion. No bloom/CA/grain. ~1–2s; PNG auto-downloads."
            : "Vector reinterpretation — bead chains along this frame's gravity currents. No bloom/CA/grain. ~1–2s; PNG auto-downloads.";
        artSec.appendChild(artHint);
        panelEl.appendChild(artSec);
      }

        });

        // Density — body count / GPGPU texture size. Rebuilds the pipeline.
        const dens = Section();
        dens.appendChild(SectionTitle("Density"));
        const densLabel = el("div");
        densLabel.style.cssText =
          "font-size: 10px; color: var(--text-2); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 6px;";
        densLabel.textContent = "Level";
        dens.appendChild(densLabel);
        const hwMax = renderer.capabilities.maxTextureSize || 2048;
        // Standard tiers — always available below the hardware cap.
        const densRow = el("div", "pill-row");
        for (const key of DENSITY_ORDER) {
          const lvl = DENSITY_LEVELS[key];
          if (lvl.experimental) continue;
          if (lvl.texSize > hwMax) continue;
          const pill = el(
            "button",
            "pill" + (currentDensityKey === key ? " active" : ""),
          );
          pill.innerHTML = `${lvl.label}<br><span style="opacity:0.6;font-size:9px">${lvl.shortCount}</span>`;

          densRow.appendChild(pill);

        densHint.textContent =
          "Higher density = more bodies but heavier GPU cost. Lush is recording-only.";
        dens.appendChild(densHint);

        // Experimental tiers — gated by a confirm modal + auto-revert
        // watchdog. Only listed here if the GPU can address the texture.
        const expTiers = DENSITY_ORDER.filter(
          (k) =>
            DENSITY_LEVELS[k].experimental &&
            DENSITY_LEVELS[k].texSize <= hwMax,
        );
        if (expTiers.length > 0) {
          const expLabel = el("div");
          expLabel.style.cssText =
            "font-size: 10px; color: #d97a4a; letter-spacing: 0.18em; text-transform: uppercase; margin: 14px 0 6px;";
          expLabel.textContent = "⚠ Experimental";
          dens.appendChild(expLabel);
          const expRow = el("div", "pill-row");
          for (const key of expTiers) {
            const lvl = DENSITY_LEVELS[key];
            const pill = el(
              "button",
              "pill" + (currentDensityKey === key ? " active" : ""),
            );
            pill.innerHTML = `${lvl.label}<br><span style="opacity:0.6;font-size:9px">${lvl.shortCount}</span>`;
            pill.addEventListener("click", () => setDensity(key));
            expRow.appendChild(pill);
          }
          dens.appendChild(expRow);
          const expHint = el("div");
          expHint.style.cssText =
            "font-size: 10px; color: var(--text-2); margin-top: 8px; line-height: 1.4;";
          expHint.textContent =
            "Heavy GPU load. Auto-reverts one step down if FPS drops below 30.";
          dens.appendChild(expHint);
        }
        panelEl.appendChild(dens);

        // Compute backend — manual WebGL/WebGPU toggle (step 9). Pills
        // refresh after applyComputeBackend so the active state stays
        // honest if probe resolves late or activate fails.
        const compute = Section();
        compute.appendChild(SectionTitle("Compute"));
        const computeLabel = el("div");
        computeLabel.style.cssText =
          "font-size: 10px; color: var(--text-2); letter-spacing: 0.18em; text-transform: uppercase; margin-bottom: 6px;";
        computeLabel.textContent = "Backend";
        compute.appendChild(computeLabel);
        const computeRow = el("div", "pill-row");
        const wglPill = el("button", "pill");
        wglPill.textContent = "WebGL";
        wglPill.addEventListener("click", () => setComputeBackend("webgl"));
        computeRow.appendChild(wglPill);
        const wgpuPill = el("button", "pill");
        wgpuPill.innerHTML =
          'WebGPU<br><span style="opacity:0.6;font-size:9px">beta</span>';
        wgpuPill.addEventListener("click", () => setComputeBackend("webgpu"));
        computeRow.appendChild(wgpuPill);
        compute.appendChild(computeRow);
        const computeHint = el("div");
        computeHint.style.cssText =
          "font-size: 10px; color: var(--text-2); margin-top: 8px; line-height: 1.4;";
        compute.appendChild(computeHint);
        // Refresher closes over the two pills and the hint so probe
        // completion / activate / deactivate can re-paint the active
        // state and availability message in place.
        const refreshComputePills = () => {
          const live = wgpuSim.active ? "webgpu" : "webgl";
          wglPill.classList.toggle("active", live === "webgl");
          wgpuPill.classList.toggle("active", live === "webgpu");
          if (!wgpuSim.available) {
            wgpuPill.disabled = true;
            wgpuPill.style.opacity = "0.4";
            wgpuPill.style.cursor = "not-allowed";
            wgpuPill.title =
              "WebGPU unavailable: " + (wgpuSim.reason || "unsupported");
            computeHint.textContent =
              "WebGPU unavailable on this browser/GPU (" +
              (wgpuSim.reason || "unsupported") +
              "). Using WebGL.";
          } else {
            wgpuPill.disabled = false;
            wgpuPill.style.opacity = "";
            wgpuPill.style.cursor = "";
            wgpuPill.title = "";
            computeHint.textContent =
              live === "webgpu"
                ? "WebGPU compute active — faster at high tiers, beta."
                : "WebGL2 compute (default). WebGPU is opt-in.";
          }
        };
        computeBackendUIRefreshers.push(refreshComputePills);
        refreshComputePills();
        panelEl.appendChild(compute);
      }

      // ===============================================================
      // 20. SCENE BROWSER & HOTKEY OVERLAY
      // ===============================================================
      const sceneBrowserEl = $("#scene-browser");
      const hotkeyOverlayEl = $("#hotkey-overlay");

      // Hand-curated cover art per scene. Wins over any auto-captured

      // Thumbnail capture: renders off-screen at 256x256 on request
      function thumbStorageKey(key) {
        return `universe-thumb-v1-${key}`;
      }
      function maybeCaptureThumbnail(key) {
        if (TOKEN.active) return; // no browser, no localStorage writes
        // Capture ~800ms after scene settles, then store.
        setTimeout(() => {
          try {
            const size = 256;
            const rt = new THREE.WebGLRenderTarget(size, size, { samples: 0 });
            const saved = {
              w: renderer.getSize(new THREE.Vector2()).x,
              h: renderer.getSize(new THREE.Vector2()).y,
              expo: renderer.toneMappingExposure,
            };
            setCaptureSize(size, size);
            composer.render();
            const gl = renderer.getContext();
            const buf = new Uint8Array(size * size * 4);
            gl.readPixels(0, 0, size, size, gl.RGBA, gl.UNSIGNED_BYTE, buf);
            // Flip vertically + to canvas
            const c = document.createElement("canvas");
            c.width = size;
            c.height = size;
            const ctx = c.getContext("2d");
            const img = ctx.createImageData(size, size);
            for (let y = 0; y < size; y++) {
              for (let x = 0; x < size; x++) {
                const si = ((size - 1 - y) * size + x) * 4;
                const di = (y * size + x) * 4;
                img.data[di + 0] = buf[si + 0];
                img.data[di + 1] = buf[si + 1];
                img.data[di + 2] = buf[si + 2];
                img.data[di + 3] = 255;
              }
            }
            ctx.putImageData(img, 0, 0);
            const data = c.toDataURL("image/jpeg", 0.7);
            try {
              localStorage.setItem(thumbStorageKey(key), data);
            } catch (e) {}
            setCaptureSize(saved.w, saved.h);
            rt.dispose();
          } catch (e) {
            /* thumbnail capture is best-effort */
          }
        }, 800);
      }
