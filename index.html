          tex.colorSpace = THREE.SRGBColorSpace;
          tex.needsUpdate = true;
          const textMat = new THREE.MeshBasicMaterial({
            map: tex,
            transparent: true,
            depthWrite: false,
          });
          // Front face of the plank — placed clearly past the front
          // face (plank front at z=+0.025; text at +0.028).
          const textFront = new THREE.Mesh(
            new THREE.PlaneGeometry(0.72, 0.22),
            textMat,
          );
          textFront.position.set(0, 0.78, 0.028);
          sign.add(textFront);
          // Position: off to the +X side of the telescope, angled to
          // catch the camera in the ESTABLISH wide shot at (5, 3.5, 8).
          sign.position.set(1.7, 0, 0.8);
          sign.rotation.y = -0.55;
          s.add(sign);
        }

        // ---- Character (cute-chibi) ----------------------------------
        // Big round head with knit cap + pom-pom, tiny round body,
        // stub limbs. Upper body lives under a "torso" pivot at the
        // waist so we can bow the character forward over the eyepiece
        // without the legs tilting too.
        {
          const ch = new THREE.Group();
          const skin = new THREE.MeshStandardMaterial({
            color: 0x5a6478,
            roughness: 0.9,
            metalness: 0,
          });
          const cap = new THREE.MeshStandardMaterial({
            color: 0x8a4a4a,
            roughness: 1,
            metalness: 0,
          });
          const pom = new THREE.MeshStandardMaterial({
            color: 0xf6dbb6,
            roughness: 1,
            metalness: 0,
            emissive: 0x2a1408,
            emissiveIntensity: 0.3,
          });
          const scarf = new THREE.MeshStandardMaterial({
            color: 0xd66a48,
            roughness: 1,
            metalness: 0,
            emissive: 0x180603,
            emissiveIntensity: 0.15,
          });
          const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0a0608 });

          // Torso pivot at waist height. All upper-body parts attach
          // here so torso.rotation.x bows the entire upper half.
          const torso = new THREE.Group();
          torso.position.y = 0.4;
          ch.add(torso);

          // Body — small rounded sphere, a touch squashed. Was at
          // world y=0.5; relative to torso pivot at 0.4 → local y=0.1.
          const body = new THREE.Mesh(
            new THREE.SphereGeometry(0.42, 18, 14),
            skin,
          );
          body.scale.set(1, 0.95, 1);
          body.position.y = 0.1;
          torso.add(body);
          // Head — big round sphere on top. Was world y=1.05 → local 0.65.
          const head = new THREE.Mesh(
            new THREE.SphereGeometry(0.42, 22, 18),
            skin,
          );
          head.position.y = 0.65;
          torso.add(head);
          // Knit cap. Was world y=1.07 → local 0.67.
          const capMesh = new THREE.Mesh(
            new THREE.SphereGeometry(
              0.44,
              20,
              14,
              0,
              Math.PI * 2,
              0,
              Math.PI / 2.1,
            ),
            cap,
          );
          capMesh.position.y = 0.67;
          torso.add(capMesh);
          // Pom-pom. Was world y=1.5 → local 1.1.
          const pomMesh = new THREE.Mesh(
            new THREE.SphereGeometry(0.13, 14, 10),
            pom,
          );
          pomMesh.position.y = 1.1;
          torso.add(pomMesh);
          // Scarf. Was world y=0.78 → local 0.38.
          const scarfMesh = new THREE.Mesh(
            new THREE.TorusGeometry(0.32, 0.09, 10, 22),
            scarf,
          );
          scarfMesh.rotation.x = Math.PI / 2;
          scarfMesh.position.y = 0.38;
          scarfMesh.scale.set(1, 1, 0.6);
          torso.add(scarfMesh);
          // Two tiny dot eyes on the +X face of the head.
          const eyeL = new THREE.Mesh(
            new THREE.SphereGeometry(0.035, 8, 6),
            eyeMat,
          );
          const eyeR = eyeL.clone();
          eyeL.position.set(0.36, 0.7, 0.11);
          eyeR.position.set(0.36, 0.7, -0.11);
          torso.add(eyeL);
          torso.add(eyeR);
          // Arms — stubby capsules. Were y=0.6 → local 0.2.
          const armGeo = new THREE.CapsuleGeometry(0.1, 0.28, 4, 8);
          const armL = new THREE.Mesh(armGeo, skin);
          armL.position.set(0, 0.2, 0.4);
          armL.rotation.x = 0.2;
          torso.add(armL);
          const armR = new THREE.Mesh(armGeo, skin);
          armR.position.set(0, 0.2, -0.4);
          armR.rotation.x = -0.2;
          torso.add(armR);
          // Legs — direct children of the character group (not torso),
          // so the bow doesn't tilt them.
          const legGeo = new THREE.CapsuleGeometry(0.12, 0.22, 4, 8);
          const legL = new THREE.Mesh(legGeo, skin);
          legL.position.set(0, 0.18, 0.16);
          ch.add(legL);
          const legR = new THREE.Mesh(legGeo, skin);
          legR.position.set(0, 0.18, -0.16);
          ch.add(legR);

          // Stash refs so the per-beat code can pose them.
          intro.character = ch;
          intro.charParts = {
            torso,
            body,
            head,
            cap: capMesh,
            pom: pomMesh,
            scarf: scarfMesh,
            armL,
            armR,
            legL,
            legR,
          };

          // Spawn pose: standing 5 units away along -X, facing +X
          // toward the telescope. The walk to the look-pose is part of
          // the cinematic — long enough that the audience reads it.
          ch.position.set(-5.0, 0, 0);
          ch.rotation.y = -Math.PI / 2; // face +X toward telescope
          s.add(ch);
        }

        intro.scene = s;
      }

      // Spawn / look-pose / eyepiece world position. Tuned so the
      // character's head ends up right at the eyepiece when bowed by
      // ~30°. See arithmetic in STARGAZER_INTRO_PLAN.md.
      const CHAR_SPAWN = new THREE.Vector3(-5.0, 0, 0);
      const CHAR_LOOK = new THREE.Vector3(-0.95, 0, 0.05);
      // Camera key-poses for the cinematic move.
      // The path through THROUGH must NOT cross the character — earlier
      // version routed via NEAR_EYEPIECE which sat behind the bowed
      // character's head and gave a "going through their skull" read.
      // Now THROUGH dollies straight from the side-profile vantage to
      // the eyepiece, passing alongside the +Z side of the barrel.
      const INTRO_CAM = {
        // ESTABLISH is now 10s and shows a "sky preview" disc above
        // the scene. Camera is pulled up + back so the upper third of
        // frame is sky (where the preview lives), and the look-at is
        // lifted to tilt the camera up toward it.
        EST_START: new THREE.Vector3(5.5, 4.2, 9.0),
        EST_END: new THREE.Vector3(5.0, 4.0, 8.4),
        EST_LOOK: new THREE.Vector3(-0.5, 2.2, 0.0),
        // End-of-APPROACH: side-profile camera so the bow reads as a
        // bow, not as "the camera is staring down a hat."
        SIDE_PROFILE: new THREE.Vector3(-0.7, 1.7, 3.6),
        SIDE_PROFILE_CLOSE: new THREE.Vector3(-0.7, 1.4, 2.6),
        // End-of-THROUGH: dead center of the eyepiece sphere. With
        // side=DoubleSide on the porthole material, the camera ends
        // inside the sphere and the porthole texture wraps the full
        // field of view.
        INTO_EYEPIECE: new THREE.Vector3(-0.66, 1.015, 0.0),
      };
      const INTRO_FOV = {
        EST: 50,
        APPROACH: 50,
        LEAN_END: 36,
        THROUGH_END: 14,
      };
      // Eyepiece world-position is computed in introBegin once the scene
      // exists, so the camera curves point at the right spot.
      const _eyepieceWorld = new THREE.Vector3();
      const _tmpVec3 = new THREE.Vector3();

      // Audio for the intro: wind bed + footstep thuds + a single soft
      // chime on the LEAN_IN bow. WebAudio requires a user gesture, so
      // the context is lazy-initialized on the first user input. If the
      // intro auto-plays without input, audio is silently skipped — the
      // visuals carry the moment.
      function ensureIntroAudio() {
        if (intro._audioInited) return intro.audioCtx;
        intro._audioInited = true;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return null;
          const ctx = new Ctx();
          intro.audioCtx = ctx;
          intro.audioMaster = ctx.createGain();
          intro.audioMaster.gain.value = 0.7;
          intro.audioMaster.connect(ctx.destination);
          // Wind bed: 4s loop of brown-ish noise through a low-pass.
          const len = Math.floor(ctx.sampleRate * 4);
          const buf = ctx.createBuffer(1, len, ctx.sampleRate);
          const d = buf.getChannelData(0);
          let last = 0;
          for (let i = 0; i < len; i++) {
            const w = Math.random() * 2 - 1;
            last = (last + 0.02 * w) / 1.02;
            d[i] = last * 3.5;
          }
          const wind = ctx.createBufferSource();
          wind.buffer = buf;
          wind.loop = true;
          const lpf = ctx.createBiquadFilter();
          lpf.type = "lowpass";
          lpf.frequency.value = 380;
          const g = ctx.createGain();
          g.gain.value = 0.0;
          wind.connect(lpf);
          lpf.connect(g);
          g.connect(intro.audioMaster);
          wind.start();
          intro.audioWindGain = g;
          // Fade wind in over 1.5s.
          g.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 1.5);
          return ctx;
        } catch (e) {
          return null;
        }
      }

      function playFootstepThud() {
        const ctx = intro.audioCtx;
        if (!ctx) return;
        const t = ctx.currentTime;
        const len = Math.floor(0.18 * ctx.sampleRate);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          const env = Math.pow(1 - i / len, 4);
          d[i] = (Math.random() * 2 - 1) * env;
        }
        const src = ctx.createBufferSource();
        src.buffer = buf;
        const lpf = ctx.createBiquadFilter();
        lpf.type = "lowpass";
        lpf.frequency.value = 220;
        const g = ctx.createGain();
        g.gain.value = 0.32;
        src.connect(lpf);
        lpf.connect(g);
        g.connect(intro.audioMaster);
        src.start(t);
      }

      function playPomChime() {
        const ctx = intro.audioCtx;
        if (!ctx) return;
        const t = ctx.currentTime;
        const o = ctx.createOscillator();
        o.type = "sine";
        o.frequency.value = 880;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0, t);
        g.gain.linearRampToValueAtTime(0.16, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.001, t + 1.4);
        o.connect(g);
        g.connect(intro.audioMaster);
        o.start(t);
        o.stop(t + 1.5);
        // Tiny soft fifth above for warmth.
        const o2 = ctx.createOscillator();
        o2.type = "sine";
        o2.frequency.value = 880 * 1.5;
        const g2 = ctx.createGain();
        g2.gain.setValueAtTime(0.0, t);
        g2.gain.linearRampToValueAtTime(0.07, t + 0.015);
        g2.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
        o2.connect(g2);
        g2.connect(intro.audioMaster);
        o2.start(t);
        o2.stop(t + 1.2);
      }

      // Exclaim chime: an upward-pitched cute "oh!" — two-note rising
      // arpeggio over half a second. Fires when the character steps
      // back from the eyepiece in surprise/wonder.
      function playExclaimChime() {
        const ctx = intro.audioCtx;
        if (!ctx) return;
        const t = ctx.currentTime;
        const notes = [880, 1175]; // A5, D6 — perfect fourth up
        notes.forEach((freq, i) => {
          const at = t + i * 0.09;
          const o = ctx.createOscillator();
          o.type = "sine";
          o.frequency.value = freq;
          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0, at);
          g.gain.linearRampToValueAtTime(0.22, at + 0.015);
          g.gain.exponentialRampToValueAtTime(0.001, at + 0.9);
          o.connect(g);
          g.connect(intro.audioMaster);
          o.start(at);
          o.stop(at + 1.0);
          // Octave shimmer.
          const o2 = ctx.createOscillator();
          o2.type = "sine";
          o2.frequency.value = freq * 2;
          const g2 = ctx.createGain();
          g2.gain.setValueAtTime(0.0, at);
          g2.gain.linearRampToValueAtTime(0.06, at + 0.02);
          g2.gain.exponentialRampToValueAtTime(0.001, at + 0.7);
          o2.connect(g2);
          g2.connect(intro.audioMaster);
          o2.start(at);
          o2.stop(at + 0.8);
        });
      }

      function fadeOutIntroAudio() {
        const ctx = intro.audioCtx;
        if (!ctx) return;
        const t = ctx.currentTime;
        if (intro.audioMaster) {
          intro.audioMaster.gain.cancelScheduledValues(t);
          intro.audioMaster.gain.setValueAtTime(
            intro.audioMaster.gain.value,
            t,
          );
          intro.audioMaster.gain.linearRampToValueAtTime(0.0, t + 1.2);
        }
      }

      // Lazy init for the eyepiece-as-portal plumbing: a render target
      // for the live sim view, a dedicated cinematic camera that frames
      // the sim from a fixed pleasant distance, and a fullscreen overlay
      // quad that fades in during THROUGH so the porthole engulfs the
      // canvas before the intro hands off.
      function introInitPortal() {
        if (intro._portalReady) return;
        const w = Math.max(64, Math.floor(innerWidth * 0.5));
        const h = Math.max(64, Math.floor(innerHeight * 0.5));
        intro.portholeRT = new THREE.WebGLRenderTarget(w, h, {
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat,
          depthBuffer: true,
        });
        // Dedicated camera so the intro main camera can frame the
        // hillside while this one frames the sim into the porthole.
        intro.portholeCam = new THREE.PerspectiveCamera(
          45,
          innerWidth / innerHeight,
          0.1,
          50000,
        );
        intro.portholeCam.position.set(80, 40, 80);
        intro.portholeCam.lookAt(0, 0, 0);
        intro.portholeCam.updateProjectionMatrix();
        // Replace the eyepiece's flat black material with one that
        // samples the porthole RT. side=BackSide so we render the
        // INSIDE of the sphere when the camera enters it.
        if (intro.eyepiece) {
          intro.eyepiece.material.dispose();
          intro.eyepiece.material = new THREE.MeshBasicMaterial({
            map: intro.portholeRT.texture,
            side: THREE.DoubleSide,
            depthWrite: false,
          });
        }
        // Fullscreen overlay: a 2x2 plane in NDC, drawn with a custom
        // shader that bypasses MVP. Lives in its own ortho scene so it
        // composites over whatever was rendered to canvas this frame.
        intro.overlayScene = new THREE.Scene();
        intro.overlayCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        intro.overlayMat = new THREE.ShaderMaterial({
          uniforms: {
            tMap: { value: intro.portholeRT.texture },
            uOpacity: { value: 0.0 },
          },
          transparent: true,
          depthWrite: false,
          depthTest: false,
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = vec4(position.xy, 0.0, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D tMap;
            uniform float uOpacity;
            varying vec2 vUv;
            void main() {
              vec4 c = texture2D(tMap, vUv);
              gl_FragColor = vec4(c.rgb, uOpacity);
            }
          `,
        });
        const overlayQuad = new THREE.Mesh(
          new THREE.PlaneGeometry(2, 2),
          intro.overlayMat,
        );
        overlayQuad.frustumCulled = false;
        intro.overlayScene.add(overlayQuad);

        // Sky preview disc: a "moon-sized" porthole floating high in
        // the sky during ESTABLISH/APPROACH so the user gets a sample
        // of what the sim looks like before committing to enter the
        // lens. Same RT texture as the eyepiece — a literal preview.
        // Material has fog: false so the night haze doesn't kill it.
        // Positioned and oriented to the camera each frame in
        // tickIntroPose.
        {
          // Soft-edged disc via a custom alpha shader so it doesn't
          // read as a hard-cut clip-art moon.
          const diskMat = new THREE.ShaderMaterial({
            uniforms: {
              tMap: { value: intro.portholeRT.texture },
              uOpacity: { value: 0.0 },
              uRimColor: { value: new THREE.Color(0xfff0c8) },
            },
            transparent: true,
            depthWrite: false,
            fog: false,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D tMap;
              uniform float uOpacity;
              uniform vec3 uRimColor;
              varying vec2 vUv;
              void main() {
                vec2 c = vUv - 0.5;
                float d = length(c);
                if (d > 0.5) discard;
                // Soft inner edge.
                float disk = smoothstep(0.5, 0.46, d);
                // Warm rim glow at the very edge.
                float rim = smoothstep(0.5, 0.47, d) - smoothstep(0.47, 0.42, d);
                vec4 cosmos = texture2D(tMap, vUv);
                vec3 rgb = cosmos.rgb * disk + uRimColor * rim * 0.55;
                gl_FragColor = vec4(rgb, (disk + rim * 0.6) * uOpacity);
              }
            `,
          });
          const disk = new THREE.Mesh(
            new THREE.PlaneGeometry(3.6, 3.6),
            diskMat,
          );
          disk.position.set(-1.2, 6.2, -1.0);
          disk.frustumCulled = false;
          if (intro.scene) intro.scene.add(disk);
          intro.skyDisk = disk;
          intro.skyDiskMat = diskMat;
        }

        intro._portalReady = true;
      }

      function introResizePortal() {
        if (!intro._portalReady) return;
        const w = Math.max(64, Math.floor(innerWidth * 0.5));
        const h = Math.max(64, Math.floor(innerHeight * 0.5));
        intro.portholeRT.setSize(w, h);
      }

      function introDisposePortal() {
        if (!intro._portalReady) return;
        if (intro.portholeRT) intro.portholeRT.dispose();
        if (intro.overlayMat) intro.overlayMat.dispose();
        if (intro.skyDiskMat) intro.skyDiskMat.dispose();
        if (intro.skyDisk && intro.skyDisk.geometry)
          intro.skyDisk.geometry.dispose();
        intro.portholeRT = null;
        intro.portholeCam = null;
        intro.overlayScene = null;
        intro.overlayCam = null;
        intro.overlayMat = null;
        intro.skyDisk = null;
        intro.skyDiskMat = null;
        intro._portalReady = false;
      }

      // Set the music system to play "Lamplighter" — perfect tonal
      // match for a small lantern-lit telescope on a hill. Tries to
      // autoplay; if blocked, the existing music IIFE's unlockAudio
      // handler will play it on the first user gesture.
      function introSelectIntroTrack() {
        if (intro._musicSelected) return;
        try {
          if (typeof TRACKS !== "object" || typeof music !== "object") return;
          let idx = -1;
          for (let i = 0; i < TRACKS.length; i++) {
            if (TRACKS[i].title === "Lamplighter") {
              idx = i;
              break;
            }
          }
          if (idx < 0) return;
          intro._musicSelected = true;
          music.load(idx, true);
        } catch (e) {}
      }

      function introBegin() {
        if (!intro.active) return;
        if (!intro.scene) buildIntroScene();
        intro.beat = "ESTABLISH";
        intro.t = 0;
        intro.T = 0;
        intro.clickAdvance = false;
        intro.skipToEnd = false;
        // Stash camera / FOV / controls so we can restore on END.
        intro.savedCam = camera.position.clone();
        intro.savedFov = camera.fov;
        intro.savedControlsEnabled = controls.enabled;
        controls.enabled = false;
        // Cache the eyepiece's world position for camera curves.
        if (intro.eyepiece) {
          intro.eyepiece.getWorldPosition(_eyepieceWorld);
        } else {
          _eyepieceWorld.set(-0.66, 1.015, 0);
        }
        // Set up the eyepiece-as-portal plumbing now (after the eyepiece
        // exists). Its render target is sized at half-canvas — invisible
        // at the porthole's apparent size during LEAN_IN, and a tasteful
        // soft-resolve when the overlay fades in during THROUGH.
        introInitPortal();
        // Queue Lamplighter as the intro track. Plays on first gesture
        // (or immediately if the browser permits autoplay).
        introSelectIntroTrack();
        // Apply ESTABLISH start pose immediately (no first-frame snap).
        camera.fov = INTRO_FOV.EST;
        camera.position.copy(INTRO_CAM.EST_START);
        camera.lookAt(INTRO_CAM.EST_LOOK);
        camera.updateProjectionMatrix();
        // Reset character to spawn pose.
        if (intro.character) {
          intro.character.position.copy(CHAR_SPAWN);
          intro.character.rotation.set(0, -Math.PI / 2, 0);
        }
        if (intro.charParts) {
          intro.charParts.armR.rotation.set(-0.2, 0, 0);
          intro.charParts.armL.rotation.set(0.2, 0, 0);
          if (intro.charParts.torso)
            intro.charParts.torso.rotation.set(0, 0, 0);
          if (intro.charParts.body) intro.charParts.body.rotation.set(0, 0, 0);
          if (intro.charParts.head) intro.charParts.head.rotation.set(0, 0, 0);
        }
        // Eyepiece glow light starts dim.
        if (intro.eyepieceGlowLight) intro.eyepieceGlowLight.intensity = 0;
        // Skip button visible from frame 1.
        const btn = document.getElementById("intro-skip");
        if (btn) btn.classList.add("show");
        const prompt = document.getElementById("intro-prompt");
        if (prompt) prompt.classList.add("show");
      }

      // Per-frame camera + character pose for the current beat.
      // `t` is seconds into this beat; `dur` is its full length.
      function tickIntroPose(beat, t, dur) {
        const p = dur > 0 ? Math.min(1, t / dur) : 0;
        const ep = easeInOutCubic(p);

        // Sky preview disc — billboards to face the camera, opacity
        // ramps in during ESTABLISH, holds through APPROACH, fades out
        // during LEAN_IN, gone for REACT/THROUGH.
        if (intro.skyDisk && intro.skyDiskMat) {
          intro.skyDisk.lookAt(camera.position);
          let target = 0;
          if (beat === "ESTABLISH") target = Math.min(1, t / 1.8) * 0.92;
          else if (beat === "APPROACH") target = 0.92 * (1 - 0.35 * p);
          else if (beat === "LEAN_IN") target = 0.6 * (1 - p);
          intro.skyDiskMat.uniforms.uOpacity.value = lerp(
            intro.skyDiskMat.uniforms.uOpacity.value,
            target,
            0.12,
          );
        }

        if (beat === "ESTABLISH") {
          // Slow drift from EST_START → EST_END.
          camera.position.lerpVectors(
            INTRO_CAM.EST_START,
            INTRO_CAM.EST_END,
            p,
          );
          camera.lookAt(INTRO_CAM.EST_LOOK);
          camera.fov = INTRO_FOV.EST;
          camera.updateProjectionMatrix();
          // Character watches the sky preview — sustained head tilt-up
          // with subtle micro-motion. Reads as "they're seeing the same
          // thing the audience is."
          if (intro.charParts && intro.charParts.head) {
            const baseUp = -0.42;
            const drift = -0.05 * Math.sin(intro.T * 0.7);
            intro.charParts.head.rotation.z = baseUp + drift;
          }
        } else if (beat === "APPROACH") {
          // Camera arcs from ESTABLISH_END to a side-profile vantage,
          // so the bow that follows reads as a bow (not as the camera
          // staring down a hat-top).
          camera.position.lerpVectors(
            INTRO_CAM.EST_END,
            INTRO_CAM.SIDE_PROFILE,
            ep,
          );
          // LookAt slides from wide-shot point toward the look-pose at
          // the telescope — character is the subject during the walk.
          _tmpVec3.lerpVectors(INTRO_CAM.EST_LOOK, CHAR_LOOK, ep);
          _tmpVec3.y = 1.0;
          camera.lookAt(_tmpVec3);
          camera.fov = INTRO_FOV.APPROACH;
          camera.updateProjectionMatrix();
          // Character walks from CHAR_SPAWN → CHAR_LOOK along +X.
          if (intro.character) {
            intro.character.position.x =
              CHAR_SPAWN.x + (CHAR_LOOK.x - CHAR_SPAWN.x) * ep;
            intro.character.position.z =
              CHAR_SPAWN.z + (CHAR_LOOK.z - CHAR_SPAWN.z) * ep;
            const phase = t * 5.5;
            intro.character.position.y = Math.abs(Math.sin(phase)) * 0.045;
          }
          if (intro.charParts) {
            const phase = t * 5.5;
            // Arm swing decays to zero by APPROACH end so the arms
            // arrive at neutral before the bow takes over their pose.
            const settle = 1 - p * p;
            intro.charParts.armL.rotation.x =
              0.2 + Math.sin(phase) * 0.5 * settle;
            intro.charParts.armR.rotation.x =
              -0.2 - Math.sin(phase) * 0.5 * settle;
            if (intro.charParts.pom)
              intro.charParts.pom.position.y =
                1.1 +
                0.018 * Math.sin(intro.T * 2.1) +
                Math.abs(Math.sin(phase)) * 0.035 * settle;
            if (intro.charParts.head) {
              intro.charParts.head.rotation.z = -0.04;
            }
          }
        } else if (beat === "LEAN_IN") {
          // Camera holds at side-profile through the entire bow — small
          // push-in from SIDE_PROFILE → SIDE_PROFILE_CLOSE for breath.
          // The bow IS the moment; camera shouldn't compete with it.
          camera.position.lerpVectors(
            INTRO_CAM.SIDE_PROFILE,
            INTRO_CAM.SIDE_PROFILE_CLOSE,
            ep,
          );
          // Look at a point between character head and eyepiece so the
          // bow lands in the upper-center of frame.
          _tmpVec3.copy(_eyepieceWorld).add(new THREE.Vector3(-0.18, 0.06, 0));
          camera.lookAt(_tmpVec3);
          camera.fov =
            INTRO_FOV.APPROACH +
            (INTRO_FOV.LEAN_END - INTRO_FOV.APPROACH) * ep * 0.3;
          camera.updateProjectionMatrix();
          // Character locks at the look-pose.
          if (intro.character) {
            intro.character.position.x = CHAR_LOOK.x;
            intro.character.position.y = 0;
            intro.character.position.z = CHAR_LOOK.z;
          }
          if (intro.charParts) {
            // The bow: torso pivots forward at the waist over the
            // eyepiece. Negative rotation.x because after the
            // character's yaw -π/2, the head moves toward world +X
            // (the telescope) when local +Y tilts toward local -Z.
            const bowT = easeInOutCubic(Math.min(1, p / 0.75));
            if (intro.charParts.torso)
              intro.charParts.torso.rotation.x = -0.55 * bowT;
            // Head tucks down a touch so the eyes align with the
            // eyepiece, not the sky behind it.
            intro.charParts.head.rotation.x = 0.18 * bowT;
            intro.charParts.head.rotation.z = -0.04;
            // Right arm raises and rests on the barrel.
            intro.charParts.armR.rotation.x = -0.2 + 0.7 * bowT;
            intro.charParts.armR.rotation.z = -1.1 * bowT;
            intro.charParts.armL.rotation.x = 0.2;
          }
        } else if (beat === "REACT") {
          // Camera holds at SIDE_PROFILE_CLOSE — the audience is
          // watching the character react. Tiny push to keep it alive.
          _tmpVec3
            .copy(INTRO_CAM.SIDE_PROFILE_CLOSE)
            .add(new THREE.Vector3(0, 0.05 * ep, -0.1 * ep));
          camera.position.copy(_tmpVec3);
          // Look-at lifts upward to follow the head + tiny jump.
          _tmpVec3
            .copy(_eyepieceWorld)
            .add(new THREE.Vector3(-0.18, 0.12 + 0.08 * ep, 0));
          camera.lookAt(_tmpVec3);
          camera.fov = INTRO_FOV.LEAN_END;
          camera.updateProjectionMatrix();
          // Two phases: 0..0.4 step back + un-bow; 0.4..1 arms up + jump.
          const stepX = -0.65; // backward in character's facing direction
          const stepZ = -0.08;
          if (intro.character) {
            if (p < 0.4) {
              const sp = p / 0.4;
              const esp = easeInOutCubic(sp);
              intro.character.position.x = CHAR_LOOK.x + stepX * esp;
              intro.character.position.z = CHAR_LOOK.z + stepZ * esp;
              intro.character.position.y = 0;
            } else {
              const jp = (p - 0.4) / 0.6;
              intro.character.position.x = CHAR_LOOK.x + stepX;
              intro.character.position.z = CHAR_LOOK.z + stepZ;
              // Bell jump arc: 0 → 0.18 → 0 over the 60% of the beat.
              intro.character.position.y = 0.18 * Math.sin(jp * Math.PI);
            }
          }
          if (intro.charParts) {
            if (p < 0.4) {
              // Un-bow + release arm from barrel.
              const sp = p / 0.4;
              const unbow = 1 - easeInOutCubic(sp);
              if (intro.charParts.torso)
                intro.charParts.torso.rotation.x = -0.55 * unbow;
              intro.charParts.head.rotation.x = 0.18 * unbow;
              // armR returns from "on-barrel" pose to neutral.
              intro.charParts.armR.rotation.x =
                0.5 * unbow + -0.2 * (1 - unbow);
              intro.charParts.armR.rotation.z = -1.1 * unbow;
              intro.charParts.armL.rotation.x = 0.2;
              intro.charParts.armL.rotation.z = 0;
            } else {
              // Arms shoot UP and out (the "oh!" pose).
              const sp = (p - 0.4) / 0.6;
              const esp = easeInOutCubic(Math.min(1, sp * 1.6));
              if (intro.charParts.torso) intro.charParts.torso.rotation.x = 0;
              // Head tilts UP to look at the sky.
              intro.charParts.head.rotation.x = 0;
              intro.charParts.head.rotation.z = -0.55 * esp;
              // Both arms swing forward + spread out.
              intro.charParts.armL.rotation.x = 0.2 - 1.6 * esp;
              intro.charParts.armR.rotation.x = -0.2 - 1.6 * esp;
              intro.charParts.armL.rotation.z = 0.55 * esp;
              intro.charParts.armR.rotation.z = -0.55 * esp;
              // Pom-pom does an extra bounce on the jump.
              if (intro.charParts.pom)
                intro.charParts.pom.position.y =
                  1.1 + 0.06 * Math.sin(sp * Math.PI);
            }
          }
        } else if (beat === "THROUGH") {
          // Direct dolly from side-profile-close straight to the lens.
          // The path travels in -Z (camera approaches the eyepiece from
          // its +Z side) — passes alongside the barrel and lands at
          // the eyepiece without crossing the bowed character on the
          // -X side. FOV narrows hard for the "through the lens" feel.
          camera.position.lerpVectors(
            INTRO_CAM.SIDE_PROFILE_CLOSE,
            INTRO_CAM.INTO_EYEPIECE,
            ep,
          );
          // Look-at slides from "between head and eyepiece" to the
          // eyepiece itself, so the framing settles on the lens as we
          // commit to the dive.
          _tmpVec3.lerpVectors(
            _eyepieceWorld.clone().add(new THREE.Vector3(-0.18, 0.06, 0)),
            _eyepieceWorld,
            ep,
          );
          camera.lookAt(_tmpVec3);
          camera.fov =
            INTRO_FOV.LEAN_END +
            (INTRO_FOV.THROUGH_END - INTRO_FOV.LEAN_END) * ep;
          camera.updateProjectionMatrix();
          // Hold the bow pose all the way through.
          if (intro.charParts && intro.charParts.torso) {
            intro.charParts.torso.rotation.x = -0.55;
            intro.charParts.head.rotation.x = 0.18;
            intro.charParts.armR.rotation.x = 0.5;
            intro.charParts.armR.rotation.z = -1.1;
          }
        }

        // Eyepiece glow light: dim during ESTABLISH, ramps up through
        // APPROACH → LEAN_IN, holds bright through THROUGH so the
        // character's face is lit by the cosmos through the lens.
        if (intro.eyepieceGlowLight) {
          let target = 0;
          if (beat === "APPROACH") target = 0.35 * p;
          else if (beat === "LEAN_IN") target = 0.35 + 0.65 * p;
          else if (beat === "REACT")
            target = 1.0; // hold during reaction
          else if (beat === "THROUGH") target = 1.0;
          intro.eyepieceGlowLight.intensity = target * 1.6;
        }
      }

      function introEnd() {
        intro.active = false;
        intro.beat = "DONE";
        introMarkSeen();
        fadeOutIntroAudio();
        // Camera handoff: copy the porthole camera's pose to the main
        // camera. The intro overlay finished by showing the sim through
        // the porthole camera's frustum; placing the main camera there
        // makes the first sim-rendered frame visually continuous.
        if (intro.portholeCam) {
          camera.position.copy(intro.portholeCam.position);
          camera.quaternion.copy(intro.portholeCam.quaternion);
          camera.fov = intro.portholeCam.fov;
        } else {
          if (intro.savedCam) camera.position.copy(intro.savedCam);
          if (intro.savedFov != null) camera.fov = intro.savedFov;
        }
        camera.updateProjectionMatrix();
        if (intro.savedControlsEnabled != null)
          controls.enabled = intro.savedControlsEnabled;
        // Re-target OrbitControls at the sim center; otherwise the user's
        // first interaction would orbit around the hillside origin.
        controls.target.set(0, 0, 0);
        controls.update();
        const btn = document.getElementById("intro-skip");
        if (btn) btn.classList.remove("show");
        const prompt = document.getElementById("intro-prompt");
        if (prompt) prompt.classList.remove("show");
        // Free the porthole render target + overlay shader. Geometry
        // for the hillside / character / telescope is also no longer
        // needed; release it lazily so we don't stutter on the very
        // last intro frame.
        setTimeout(() => {
          introDisposePortal();
          if (intro.scene) {
            intro.scene.traverse((o) => {
              if (o.geometry) o.geometry.dispose();
              if (o.material) {
                if (Array.isArray(o.material)) {
                  o.material.forEach((m) => m.dispose && m.dispose());
                } else if (o.material.dispose) {
                  o.material.dispose();
                }
              }
            });
            intro.scene = null;
            intro.character = null;
            intro.telescope = null;
            intro.eyepiece = null;
            intro.eyepieceGlow = null;
            intro.eyepieceGlowMat = null;
            intro.eyepieceGlowLight = null;
            intro.lantern = null;
            intro.starsMat = null;
            intro.charParts = null;
          }
        }, 100);
      }

      // Per-frame intro tick. Advances the beat clock, fires audio cues
      // on threshold crossings, and dispatches to tickIntroPose for the
      // camera + character animation.
      function tickIntro(realDt) {
        if (!intro.active || intro.beat === "IDLE" || intro.beat === "DONE")
          return;
        const prevT = intro.t;
        const prevBeat = intro.beat;
        intro.t += realDt;
        intro.T += realDt;

        // Click during ESTABLISH skips ahead to APPROACH; click during
        // APPROACH/LEAN_IN/THROUGH advances to the THROUGH-end crossfade
        // (the metaphor — "you went through the lens" — is preserved).
        if (intro.clickAdvance) {
          intro.clickAdvance = false;
          if (intro.beat === "ESTABLISH") {
            intro.beat = "APPROACH";
            intro.t = 0;
          } else {
            intro.skipToEnd = true;
          }
        }

        // Hard skip from "skip →" or Esc — jump to THROUGH end.
        if (intro.skipToEnd) {
          intro.skipToEnd = false;
          intro.beat = "THROUGH";
          intro.t = intro.beatDur.THROUGH;
        }

        // Beat advancement.
        const dur = intro.beatDur[intro.beat] || 0;
        if (intro.t >= dur) {
          if (intro.beat === "ESTABLISH") {
            intro.beat = "APPROACH";
            intro.t = 0;
          } else if (intro.beat === "APPROACH") {
            intro.beat = "LEAN_IN";
            intro.t = 0;
          } else if (intro.beat === "LEAN_IN") {
            intro.beat = "REACT";
            intro.t = 0;
          } else if (intro.beat === "REACT") {
            intro.beat = "THROUGH";
            intro.t = 0;
          } else if (intro.beat === "THROUGH") {
            introEnd();
          }
        }

        // ---- Audio cues on threshold crossings -----------------------
        // Three soft footstep thuds, evenly spaced through APPROACH.
        // Compare prev vs. current t inside APPROACH so each threshold
        // fires exactly once.
        if (intro.beat === "APPROACH" && prevBeat === "APPROACH") {
          const thresholds = [0.45, 1.4, 2.35];
          for (const th of thresholds) {
            if (prevT < th && intro.t >= th) playFootstepThud();
          }
        }
        // Pom-pom chime fires on entry into LEAN_IN (the bow beat).
        if (prevBeat !== "LEAN_IN" && intro.beat === "LEAN_IN") {
          playPomChime();
        }
        // Brighter "exclaim" chime on entry into REACT (step back + arms
        // up) — the moment of "oh!"
        if (prevBeat !== "REACT" && intro.beat === "REACT") {
          playExclaimChime();
        }
        // Two more soft footsteps mid-REACT for the step-back action.
        if (intro.beat === "REACT" && prevBeat === "REACT") {
          if (prevT < 0.18 && intro.t >= 0.18) playFootstepThud();
          if (prevT < 0.42 && intro.t >= 0.42) playFootstepThud();
        }

        // The prompt is only shown during ESTABLISH; once we're moving,
        // the user has nothing to click for.
        const prompt = document.getElementById("intro-prompt");
        if (prompt) {
          if (intro.beat !== "ESTABLISH") prompt.classList.remove("show");
        }

        // Per-frame ambient updates (run regardless of beat).
        if (intro.starsMat) intro.starsMat.uniforms.uTime.value = intro.T;
        // Eyepiece "click-here" glow — only during ESTABLISH, gentle pulse.
        if (intro.eyepieceGlowMat) {
          if (intro.beat === "ESTABLISH") {
            const pulse = 0.32 + 0.22 * Math.sin(intro.T * 2.2);
            intro.eyepieceGlowMat.opacity = pulse;
          } else {
            intro.eyepieceGlowMat.opacity = Math.max(
              0,
              intro.eyepieceGlowMat.opacity - realDt * 1.6,
            );
          }
        }
        // Idle breathing — body squashes ~3% over 3s sine. This runs for
        // ESTABLISH only; APPROACH/LEAN_IN/THROUGH override the body
        // pose via tickIntroPose, so we'd be fighting them otherwise.
        if (
          intro.beat === "ESTABLISH" &&
          intro.charParts &&
          intro.charParts.body
        ) {
          const br = 1.0 + 0.025 * Math.sin(intro.T * 2.1);
          intro.charParts.body.scale.y = 0.95 * br;
          if (intro.charParts.pom)
            intro.charParts.pom.position.y =
              1.1 + 0.018 * Math.sin(intro.T * 2.1);
        }

        // Camera + character pose for the current beat.
        const beatDur = intro.beatDur[intro.beat] || 0;
        tickIntroPose(intro.beat, intro.t, beatDur);
      }

      // Skip button + click-to-advance + Esc. Each input also unlocks
      // the WebAudio context (browsers require a user gesture).
      {
        const btn = document.getElementById("intro-skip");
        if (btn) {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (intro.active) {
              ensureIntroAudio();
              intro.skipToEnd = true;
            }
          });
        }
        // Click anywhere on the canvas during intro acts as "advance."
        canvasEl.addEventListener(
          "pointerdown",
          (e) => {
            if (intro.active) {
              ensureIntroAudio();
              intro.clickAdvance = true;
            }
          },
          true,
        );
        addEventListener("keydown", (e) => {
          if (!intro.active) return;
          ensureIntroAudio();
          if (e.key === "Escape") {
            intro.skipToEnd = true;
          }
        });
      }

      // ===============================================================
      // 3. STARFIELD (procedural, twinkling)
      // ===============================================================
      let starfieldMat = null;
      let starfieldGeo = null;
      // Fills the backdrop from `rand` — Math.random for the app, a seeded
      // generator in token mode so the first frame reproduces exactly.
      function buildStarfield(rand) {
        const N = 9000;
        const pos = new Float32Array(N * 3);
        const phase = new Float32Array(N);
        const sz = new Float32Array(N);
        for (let i = 0; i < N; i++) {
          const r = 8000 + rand() * 4500;
          const theta = Math.acos(2 * rand() - 1);
          const phi = rand() * 2 * Math.PI;
          pos[i * 3 + 0] = r * Math.sin(theta) * Math.cos(phi);
          pos[i * 3 + 1] = r * Math.sin(theta) * Math.sin(phi);
          pos[i * 3 + 2] = r * Math.cos(theta);
          phase[i] = rand() * 6.2831853;
          sz[i] = rand() < 0.025 ? 2.0 + rand() * 1.4 : 0.7 + rand() * 1.2;
        }
        if (!starfieldGeo) starfieldGeo = new THREE.BufferGeometry();
        starfieldGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        starfieldGeo.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
        starfieldGeo.setAttribute("aSize", new THREE.BufferAttribute(sz, 1));
      }
      {
        buildStarfield(Math.random);
        const geo = starfieldGeo;
        starfieldMat = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uIntensity: { value: 0.55 } },
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader: `
            uniform float uTime;
            attribute float aPhase;
            attribute float aSize;
            varying float vT;
            void main() {
              vec4 mv = modelViewMatrix * vec4(position, 1.0);
              gl_Position = projectionMatrix * mv;
              float tw = 0.55 + 0.45 * sin(uTime * 0.9 + aPhase)
                              + 0.35 * sin(uTime * 0.31 + aPhase * 2.17);
              vT = clamp(tw * 0.5 + 0.3, 0.15, 1.0);
              gl_PointSize = aSize;
            }
          `,
          fragmentShader: `
            uniform float uIntensity;
            varying float vT;
            void main() {
              vec2 c = gl_PointCoord - 0.5;
              float d = length(c);
              if (d > 0.5) discard;
              float a = smoothstep(0.5, 0.0, d) * vT * uIntensity;
              gl_FragColor = vec4(vec3(0.78, 0.88, 1.02) * a, a);
            }
          `,
        });
        const stars = new THREE.Points(geo, starfieldMat);
        stars.frustumCulled = false;
        scene.add(stars);
      }

      // ===============================================================
      // 4. COMPUTE SHADERS (gravity + flocking + radiation + age)
      // ===============================================================
      // Velocity shader is built as a function so TEX_SIZE can be rebaked
      // when the user changes the density level (see rebuildPipeline).
      // Shared by the velocity and position GPGPU shaders (PETROVA_LINE.md
      // §3.3 / §3.4). Both call astroSpawnPoint with the same (uv, frame)
      // and get the same point, which is how the position shader's snap
      // and the velocity shader's launch velocity stay in sync without
      // either reading the other's output. Requires hash22 + the astro
      // uniforms to be declared above the insertion point.
      const ASTRO_SPAWN_GLSL = /* glsl */ `
        // Fresh spawn point on the launch cap: a disc of radius
        // uSpawnRadius centred at uStarPos + uSpawnOffset and
        // perpendicular to uSpawnOffset — a polar/limb cap when the
        // offset points along the star's pole.
        vec3 astroSpawnPoint(vec2 uv, float frame) {
          vec2 hA = hash22(uv, frame * 0.0007);
          vec2 hB = hash22(uv * 1.7, frame * 0.0011 + 0.31);
          float az  = 6.2832 * hA.x;
          float rho = uSpawnRadius * sqrt(hB.x);
          float offLen = length(uSpawnOffset);
          vec3 n = offLen > 1e-6 ? uSpawnOffset / offLen : vec3(1.0, 0.0, 0.0);
          vec3 helper = abs(n.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
          vec3 t1 = normalize(cross(n, helper));
          vec3 t2 = cross(n, t1);
          return uStarPos + uSpawnOffset + rho * (cos(az) * t1 + sin(az) * t2);
        }
      `;

      const buildVelocityShader = (texSize) => /* glsl */ `
        uniform float uDt;
        uniform float uG;
        uniform float uEps2;
        uniform float uSign;
        uniform float uFrame;
        uniform float uK[${NUM_KINDS * NUM_KINDS}];
        uniform float uFlock;
        uniform float uRadiation;
        uniform float uMaxAge;
        uniform float uSpin;
        uniform vec3  uCom;
        uniform vec3  uHandPos;
        uniform vec3  uHandVel;
        uniform float uHandStrength;
        uniform float uHandRadius;
        uniform float uHandPull;

        // Astrophage forces (PETROVA_LINE.md). Defaults zero so non-petrova
        // scenes are unaffected; only the petrova-line scene populates these.
        uniform vec3  uStarPos;
        uniform vec3  uPlanetPos;
        uniform float uStarMass;
        uniform float uPlanetMass;
        uniform float uAstroThrust;
        uniform float uPlanetRadius; // arrival trigger (0 disables respawn)
        uniform vec3  uSpawnOffset;  // launch-cap centre relative to the star
        uniform float uSpawnRadius;  // launch-cap disc radius

        vec2 hash22(vec2 p, float seed) {
          vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973) + seed * 0.173);
          p3 += dot(p3, p3.yzx + 19.19);
          return fract((p3.xx + p3.yz) * p3.zy);
        }

        ${ASTRO_SPAWN_GLSL}

        // Launch velocity for a freshly respawned astrophage: radially
        // outward through its spawn point at ASTRO_LAUNCH × the circular
        // speed at that radius, ±25% speed spread, small cone jitter —
        // the spread is what gives the beam inner variation instead of
        // a uniform ribbon. Same (uv, frame) seeds as astroSpawnPoint so
        // the direction matches the point the position shader picked.
        vec3 astroLaunchVel(vec3 sp, vec2 uv, float frame) {
          vec3 rad = sp - uStarPos;
          float r = max(length(rad), 0.5);
          vec3 dir = rad / r;
          vec2 hC = hash22(uv * 2.9 + 0.17, frame * 0.0013 + 0.53);
          vec2 hD = hash22(uv * 4.3 + 0.61, frame * 0.0017 + 0.89);
          vec3 jit = vec3(hC.x, hC.y, hD.x) - 0.5;
          dir = normalize(dir + 0.3 * jit);
          float vCirc = sqrt(max(uG * uStarMass, 0.0) / r);
          float speed = ${ASTRO_LAUNCH.toFixed(3)} * vCirc * (0.75 + 0.5 * hD.y);
          return dir * speed;
        }

        void main() {
          vec2 uvSelf = gl_FragCoord.xy / resolution.xy;
          vec4 posA = texture2D(texturePosition, uvSelf);
          vec4 velA = texture2D(textureVelocity, uvSelf);

          if (posA.w <= 0.0) { gl_FragColor = velA; return; }

          float kindAf = floor(velA.w + 0.001);
          float ageNorm = velA.w - kindAf;
          int kindA = int(kindAf);
          if (kindA > ${NUM_KINDS - 1}) kindA = ${NUM_KINDS - 1};
          if (kindA < 0) kindA = 0;

          vec3 p = posA.xyz;
          vec3 v = velA.xyz;

          // Astrophage (kind 7): scripted three-body forces only — gravity to
          // a star, gravity to a planet, constant thrust toward the planet.
          // Skip the all-pairs loop, flocking, spin, and hand brush; the
          // migration is a force of nature, not user-interactive. This keeps
          // the scene O(N) instead of O(N^2).
          if (kindA == 7) {
            // Arrival (mirror of the position-shader respawn block; both
            // test the OLD position, so they fire on the same step under
            // either integrator). The position shader snaps this texel
            // to a fresh spawn point; we hand it the matching launch
            // velocity and reset age to 0 — pointVert ramps kind-7
            // brightness in from age 0, which is what keeps the respawn
            // from popping (PETROVA_LINE.md §8.2).
            if (uPlanetRadius > 0.0
                && length(p - uPlanetPos) < uPlanetRadius) {
              vec3 sp = astroSpawnPoint(uvSelf, uFrame);
              gl_FragColor = vec4(astroLaunchVel(sp, uvSelf, uFrame), kindAf + 0.0);
              return;
            }
            vec3 toStar   = uStarPos   - p;
            vec3 toPlanet = uPlanetPos - p;
            float r2s = dot(toStar,   toStar)   + uEps2;
            float r2p = dot(toPlanet, toPlanet) + uEps2;
            vec3 fStar    = uG * uStarMass   * toStar   * inversesqrt(r2s * r2s * r2s);
            vec3 fPlanet  = uG * uPlanetMass * toPlanet * inversesqrt(r2p * r2p * r2p);
            float distP  = max(length(toPlanet), 0.001);
            vec3 dirP    = toPlanet / distP;
            // Thrust + steering (see ASTRO_STEER): constant thrust toward
            // the planet plus damping of the velocity component that is
            // perpendicular to the planet direction. The extra uSign keeps
            // it a damping term when time runs backwards.
            vec3 vPerp   = v - dot(v, dirP) * dirP;
            vec3 fThrust = dirP * uAstroThrust
                         - vPerp * (${ASTRO_STEER.toFixed(3)} * uSign);
            vec3 newVelA = v + (fStar + fPlanet + fThrust) * uDt * uSign;
            float dAgeA = uDt * abs(uSign) / uMaxAge;
            float newAgeNormA = clamp(ageNorm + dAgeA, 0.0, 0.9999);
            gl_FragColor = vec4(newVelA, kindAf + newAgeNormA);
            return;
          }

          vec3 acc = vec3(0.0);
          vec2 ts = 1.0 / resolution.xy;

          // Hoist kindA's K row and the scalar params out of the O(N)
          // loop (OPTIMIZATION_PLAN.md F10, mirrors the WGSL kernel): a
          // dynamically indexed uniform-array read per pair costs far
          // more than a local lookup. The dead-body continue stays: every
          // fragment walks the same texel sequence, so the branch is
          // coherent and it skips the second fetch.
          float kRow[${NUM_KINDS}];
          for (int k = 0; k < ${NUM_KINDS}; k++) {
            kRow[k] = uK[kindA * ${NUM_KINDS} + k];
          }
          float G = uG;
          float eps2 = uEps2;

          // --- all-pairs gravity with interaction matrix K[kindA][kindB] ---
          for (int y = 0; y < ${texSize}; y++) {
            for (int x = 0; x < ${texSize}; x++) {
              vec2 uv2 = (vec2(float(x), float(y)) + 0.5) * ts;
              vec4 posB = texture2D(texturePosition, uv2);
              if (posB.w <= 0.0) continue;
              vec4 velB = texture2D(textureVelocity, uv2);
              int kindB = clamp(int(floor(velB.w + 0.001)), 0, ${NUM_KINDS - 1});
              vec3 d = posB.xyz - p;
              float r2 = dot(d, d) + eps2;
              float invR3 = inversesqrt(r2 * r2 * r2);
              acc += G * posB.w * kRow[kindB] * d * invR3;
            }
          }

          // --- stochastic neighborhood rules (flocking + radiation pressure) ---
          if (uFlock > 0.001 || uRadiation > 0.001) {
            vec3 alignV = vec3(0.0);
            vec3 cohC = vec3(0.0);
            vec3 sepF = vec3(0.0);
            vec3 brightDir = vec3(0.0);
            float wSum = 0.0;
            for (int s = 0; s < 8; s++) {
              vec2 rnd = hash22(uvSelf * 47.0 + float(s) * 11.3, uFrame * 0.001 + 0.7);
              vec4 posS = texture2D(texturePosition, rnd);
              if (posS.w <= 0.0) continue;
              vec4 velS = texture2D(textureVelocity, rnd);
              vec3 dS = posS.xyz - p;
              float rS = length(dS) + 0.001;
              float w = 1.0 / (1.0 + rS * 0.02);
              alignV += velS.xyz * w;
              cohC += posS.xyz * w;
              sepF += -dS / (rS * rS * rS + 0.001);
              float b = length(velS.xyz) * posS.w * w;
              brightDir += (dS / rS) * b;
              wSum += w;
            }
            if (wSum > 0.001) {
              alignV /= wSum;
              cohC /= wSum;
              float flockK = 0.0;
              if (kindA == 3)              flockK = 1.0;
              else if (kindA == 0 ||
                       kindA == 5 ||
                       kindA == 6)         flockK = 0.12;
              vec3 fA = (alignV - v) * 0.22;
              vec3 fC = (cohC - p) * 0.004;
              vec3 fS = sepF * 0.04;
              acc += (fA + fC + fS) * uFlock * flockK;
              if (uRadiation > 0.001) {
                brightDir /= wSum;
                acc -= brightDir * uRadiation * 0.00004;
              }
            }
          }

          // Vorticity around the system barycenter (Y axis).
          // Bipolar slider: negative = retrograde. Zero = no work.
          if (abs(uSpin) > 0.0) {
            vec3 r = p - uCom;
            acc += cross(vec3(0.0, uSpin, 0.0), r);
          }

          // Hand brush — Gaussian-weighted push along cursor motion.
          // Pull — Gaussian-weighted spring toward cursor (pinch-driven).
          if (uHandStrength > 0.0 || uHandPull > 0.0) {
            vec3 toHand = p - uHandPos;
            float r2h = dot(toHand, toHand);
            float sigma2 = max(uHandRadius * uHandRadius, 1e-3);
            float w = exp(-r2h / sigma2);
            acc += uHandStrength * w * uHandVel;
            acc -= uHandPull * w * toHand;
          }

          vec3 newVel = v + acc * uDt * uSign;

          // Age: increment normalised age (saturated to < 1 so floor(kind) is preserved)
          float dAge = uDt * abs(uSign) / uMaxAge;
          float newAgeNorm = clamp(ageNorm + dAge, 0.0, 0.9999);

          gl_FragColor = vec4(newVel, kindAf + newAgeNorm);
        }
      `;

      const positionShader = /* glsl */ `
        uniform float uDt;
        uniform float uSign;
        uniform float uFrame;
        uniform vec3  uStarPos;
        uniform vec3  uPlanetPos;
        uniform float uPlanetRadius;
        uniform vec3  uSpawnOffset;
        uniform float uSpawnRadius;

        vec2 hash22(vec2 p, float seed) {
          vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973) + seed * 0.173);
          p3 += dot(p3, p3.yzx + 19.19);
          return fract((p3.xx + p3.yz) * p3.zy);
        }

        ${ASTRO_SPAWN_GLSL}

        void main() {
          vec2 uv = gl_FragCoord.xy / resolution.xy;
          vec4 pos = texture2D(texturePosition, uv);
          vec4 vel = texture2D(textureVelocity, uv);

          // Astrophage respawn (PETROVA_LINE.md §3.4). When a kind-7
          // body arrives within uPlanetRadius of the planet, snap it
          // back to a fresh point on the launch cap. The velocity
          // shader runs the same arrival check on the same old
          // position and writes the matching launch velocity + age 0,
          // so position and velocity stay in sync.
          float kindAf = floor(vel.w + 0.001);
          bool astroArrived = (kindAf > 6.5) && (uPlanetRadius > 0.0)
              && (length(pos.xyz - uPlanetPos) < uPlanetRadius);

          if (astroArrived) {
            pos.xyz = astroSpawnPoint(uv, uFrame);
          } else {
            pos.xyz += vel.xyz * uDt * uSign;
          }

          gl_FragColor = pos;
        }
      `;

      // ===============================================================
      // 5. GPGPU SETUP
      // ===============================================================
      // Bindings live on `let` because rebuildPipeline() swaps them when
      // the user changes density level. Default uniform values are seeded
      // by installSimUniforms(); on rebuild we preserve the live values
      // of uG / uFlock / etc. that the current scene set up.
      let gpu;
      let posVar;
      let velVar;

      function installSimUniforms(preserve) {
        posVar.material.uniforms.uDt = { value: preserve?.uDt ?? 0.01 };
        posVar.material.uniforms.uSign = { value: preserve?.uSign ?? 1.0 };
        velVar.material.uniforms.uDt = { value: preserve?.uDt ?? 0.01 };
        velVar.material.uniforms.uG = { value: preserve?.uG ?? 1.0 };
        velVar.material.uniforms.uEps2 = { value: preserve?.uEps2 ?? 0.25 };
        velVar.material.uniforms.uSign = { value: preserve?.uSign ?? 1.0 };
        velVar.material.uniforms.uFrame = { value: preserve?.uFrame ?? 0.0 };
        velVar.material.uniforms.uK = {
          value: preserve?.uK ?? new Array(NUM_KINDS * NUM_KINDS).fill(1.0),
        };
        velVar.material.uniforms.uFlock = { value: preserve?.uFlock ?? 0.0 };
        velVar.material.uniforms.uRadiation = {
          value: preserve?.uRadiation ?? 0.0,
        };
        velVar.material.uniforms.uMaxAge = { value: MAX_AGE };
        velVar.material.uniforms.uSpin = { value: preserve?.uSpin ?? 0.0 };
        velVar.material.uniforms.uCom = {
          value: preserve?.uCom ?? new THREE.Vector3(0, 0, 0),
        };
        velVar.material.uniforms.uHandPos = {
          value: preserve?.uHandPos ?? new THREE.Vector3(0, 0, 0),
        };
        velVar.material.uniforms.uHandVel = {
          value: preserve?.uHandVel ?? new THREE.Vector3(0, 0, 0),
        };
        velVar.material.uniforms.uHandStrength = {
          value: preserve?.uHandStrength ?? 0.0,
        };
        velVar.material.uniforms.uHandRadius = {
          value: preserve?.uHandRadius ?? 40.0,
        };
        velVar.material.uniforms.uHandPull = {
          value: preserve?.uHandPull ?? 0.0,
        };
        // Astrophage (PETROVA_LINE.md). Defaults zero; petrova-line scene
        // populates these. uStarMass / uPlanetMass = 0 means no force, so
        // the kindA==7 branch in the velocity shader is effectively a no-op
        // for any scene that doesn't set these. uPlanetRadius = 0 disables
        // the respawn lifecycle (position shader skips the snap).
        velVar.material.uniforms.uStarPos = {
          value: preserve?.uStarPos ?? new THREE.Vector3(0, 0, 0),
        };
        velVar.material.uniforms.uPlanetPos = {
          value: preserve?.uPlanetPos ?? new THREE.Vector3(0, 0, 0),
        };
        velVar.material.uniforms.uStarMass = {
          value: preserve?.uStarMass ?? 0.0,
        };
        velVar.material.uniforms.uPlanetMass = {
          value: preserve?.uPlanetMass ?? 0.0,
        };
        velVar.material.uniforms.uAstroThrust = {
          value: preserve?.uAstroThrust ?? 0.0,
        };
        velVar.material.uniforms.uPlanetRadius = {
          value: preserve?.uPlanetRadius ?? 0.0,
        };
        // Launch cap (PETROVA_LINE.md §3.3): centre offset from the star
        // and disc radius. Zero offset = the shader falls back to a +X
        // cap, but only kind-7 arrivals ever sample it.
        velVar.material.uniforms.uSpawnOffset = {
          value: preserve?.uSpawnOffset ?? new THREE.Vector3(0, 0, 0),
        };
        velVar.material.uniforms.uSpawnRadius = {
          value: preserve?.uSpawnRadius ?? 0.0,
        };

        // Position shader needs the same uStarPos / uPlanetPos /
        // uPlanetRadius / uSpawnOffset / uSpawnRadius (for the §3.4
        // respawn block) plus uFrame for the hash seed. Share the
        // uniform objects so a single applyAstroUniforms update reaches
        // both shaders.
        posVar.material.uniforms.uFrame = velVar.material.uniforms.uFrame;
        posVar.material.uniforms.uStarPos = velVar.material.uniforms.uStarPos;
        posVar.material.uniforms.uPlanetPos =
          velVar.material.uniforms.uPlanetPos;
        posVar.material.uniforms.uPlanetRadius =
          velVar.material.uniforms.uPlanetRadius;
        posVar.material.uniforms.uSpawnOffset =
          velVar.material.uniforms.uSpawnOffset;
        posVar.material.uniforms.uSpawnRadius =
          velVar.material.uniforms.uSpawnRadius;
      }

      function createGPGPU(texSize, preserve) {
        gpu = new GPUComputationRenderer(texSize, texSize, renderer);
        const dtPos = gpu.createTexture();
        const dtVel = gpu.createTexture();
        posVar = gpu.addVariable("texturePosition", positionShader, dtPos);
        velVar = gpu.addVariable(
          "textureVelocity",
          buildVelocityShader(texSize),
          dtVel,
        );
        gpu.setVariableDependencies(posVar, [posVar, velVar]);
        gpu.setVariableDependencies(velVar, [posVar, velVar]);
        installSimUniforms(preserve);
        const gpuErr = gpu.init();
        if (gpuErr !== null) {
          showError("GPGPU init failed: " + gpuErr);
          throw new Error(gpuErr);
        }
      }

      createGPGPU(TEX_SIZE);

      // ===============================================================
      // 6. PARTICLE MESH (with palette + channel sampling)
      // ===============================================================
      const pointVert = /* glsl */ `
        uniform sampler2D uPos;
        uniform sampler2D uVel;
        uniform float uPointScale;
        uniform float uChannel;       // 0 mass, 1 speed, 2 kind, 3 density, 4 age
        uniform float uChannel2;
        uniform float uChannelMix;    // 0..1 cross-fade between uChannel and uChannel2
        uniform float uPaletteStops;  // number of palette stops (1..8)
        uniform vec3  uPalette[8];
        uniform float uMaxAge;
        uniform float uShowHalo;
        uniform float uTime;
        uniform float uBHHighlight;
        uniform float uSpeedMax;
        uniform float uDoppler;          // relativistic-ish brightness boost strength
        uniform float uKindTints[${NUM_KINDS * 3}]; // per-kind optional tint multipliers
        uniform vec2  uFollowUV;         // aRef of the followed body; (-1,-1) = inactive
        uniform float uFollowPulse;      // 0..1, drives attach-halo pulse
        uniform float uPointMax;         // sprite size cap, device px (F6)
        uniform float uPointMaxBH;       // same, for the black hole (kind 2)
        uniform float uViewScale;        // drawing-buffer height / 1440 (see syncPointViewScale)
        uniform float uTierGain;         // token mode: sqrt(65536 / N), so lower tiers match lush brightness
        uniform vec3  uPlanetPos;        // astrophage sink (PETROVA_LINE.md); kind 7 only
        uniform float uPlanetRadius;     // arrival radius; 0 = no kind-7 fade
        attribute vec2 aRef;
        varying vec3 vColor;
        varying float vAlpha;

        vec3 samplePalette(float t) {
          t = clamp(t, 0.0, 0.9999);
          float stops = max(uPaletteStops, 2.0);
          float f = t * (stops - 1.0);
          int i = int(floor(f));
          int j = i + 1;
          if (j > int(stops) - 1) j = int(stops) - 1;
          float m = f - float(i);
          return mix(uPalette[i], uPalette[j], m);
        }

        // Tiny 2D hash for cheap stochastic density
        vec2 hash22(vec2 p, float seed) {
          vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973) + seed * 0.173);
          p3 += dot(p3, p3.yzx + 19.19);
          return fract((p3.xx + p3.yz) * p3.zy);
        }

        float evalChannel(float ch, float mass, float speed, int kindI,
                          vec3 wpos, vec2 ref, float ageNorm) {
          if (ch < 0.5) {
            return clamp(log2(max(mass, 0.01) + 1.0) / 7.0, 0.0, 1.0);
          } else if (ch < 1.5) {
            return clamp(log2(1.0 + speed) / log2(1.0 + uSpeedMax), 0.0, 1.0);
          } else if (ch < 2.5) {
            return float(kindI) / float(${NUM_KINDS} - 1);
          } else if (ch < 3.5) {
            float rho = 0.0;
            for (int s = 0; s < 4; s++) {
              vec2 rn = hash22(ref * 93.1 + float(s) * 5.3, uTime * 0.01 + 0.2);
              vec4 pB = texture2D(uPos, rn);
              if (pB.w <= 0.0) continue;
              vec3 d = pB.xyz - wpos;
              float r2 = dot(d, d);
              rho += 1.0 / (1.0 + r2 * 0.01);
            }
            return clamp(rho * 0.3, 0.0, 1.0);
          } else {
            return ageNorm;
          }
        }

        void main() {
          vec4 pos = texture2D(uPos, aRef);
          vec4 vel = texture2D(uVel, aRef);
          float mass = pos.w;

          if (mass <= 0.0) {
            gl_Position = vec4(2.0); gl_PointSize = 0.0; vAlpha = 0.0; return;
          }

          float kindPacked = vel.w;
          float kindF = floor(kindPacked + 0.001);
          float ageNorm = kindPacked - kindF;
          int kindI = int(kindF);
          float speed = length(vel.xyz);

          bool isHalo = (kindI == 4);
          if (isHalo && uShowHalo < 0.5) {
            gl_Position = vec4(2.0); gl_PointSize = 0.0; vAlpha = 0.0; return;
          }

          vec4 mv = modelViewMatrix * vec4(pos.xyz, 1.0);
          gl_Position = projectionMatrix * mv;

          // Base size by mass
          float sz = uPointScale * (0.8 + pow(mass, 0.33) * 2.0);
          if (kindI == 2) sz *= 5.0;  // BH glow
          if (kindI == 3) sz *= 0.45; // dust small
          if (isHalo)     sz *= 0.4;
          // Size clamp (OPTIMIZATION_PLAN.md F6). Uncapped, a body a few
          // units from the camera asks for a sprite thousands of px wide;
          // drivers clamp at ALIASED_POINT_SIZE_RANGE (64…1024, GPU-
          // dependent), so the look differed per machine and near-camera
          // swarms were pure additive overdraw. Cap ordinary bodies at
          // uPointMax and pay part of the lost area back as brightness.
          // The black hole keeps a generous cap so its ×5 glow in the BH
          // scenes reads as before.
          // No brightness payback for capped sprites: the token contact
          // sheet showed a 2× boost on the black-hole glow white-out every
          // BH scene (their exposure/bloom were tuned without it). Capped
          // sprites are just smaller, as they already were on drivers with
          // a low ALIASED_POINT_SIZE_RANGE.
          // Sprite size scales with the viewport height (uViewScale) so the
          // composition tuned at 1440p holds at any canvas size — without it
          // a 1000 px-wide iframe or a 750 px tall preview is one white
          // glow, and a 2× screenshot renders sprites at half their
          // apparent size.
          float rawSz = sz * (320.0 / -mv.z) * uViewScale;
          float capSz = min(rawSz, kindI == 2 ? uPointMaxBH : uPointMax);
          float sizeBoost = 1.0;
          gl_PointSize = capSz;

          // --- channel value in [0,1] — with optional cross-fade to a 2nd channel ---
          float t = evalChannel(uChannel, mass, speed, kindI, pos.xyz, aRef, ageNorm);
          if (uChannelMix > 0.001) {
            float t2 = evalChannel(uChannel2, mass, speed, kindI, pos.xyz, aRef, ageNorm);
            t = mix(t, t2, uChannelMix);
          }

          vec3 c = samplePalette(t);

          // Per-kind tint (for soft galaxy-A/B differentiation without reserving a whole channel)
          vec3 tint = vec3(
            uKindTints[kindI * 3 + 0],
            uKindTints[kindI * 3 + 1],
            uKindTints[kindI * 3 + 2]
          );
          c *= tint;

          // BH hot-highlight: scene can dim or kill this (Event Horizon goes black)
          if (kindI == 2) c = mix(c, vec3(1.6, 0.9, 0.35), 0.75 * uBHHighlight);

          // Astrophage lifecycle fade (PETROVA_LINE.md §8.2), kind 7 only.
          // Age is reset to 0 on respawn, so ramping 0→1 over the first
          // sim-second of life hides the pop at the launch cap; dimming
          // to 0.2 between 2.5× and 1× the arrival radius sinks bodies
          // into the planet's glow instead of cutting them at a hard
          // edge. Other kinds never enter this branch.
          if (kindI == 7 && uPlanetRadius > 0.0) {
            float lifeS = ageNorm * uMaxAge;
            float ramp = smoothstep(0.0, 1.0, lifeS);
            float dP = length(pos.xyz - uPlanetPos);
            float fade = mix(0.2, 1.0,
                             smoothstep(uPlanetRadius, uPlanetRadius * 2.5, dP));
            c *= ramp * fade;
          }

          // Relativistic-ish Doppler beaming: brighten bodies moving toward the
          // camera, dim those moving away.  Applied as (1 + strength·β)^3.
          // Skipped for black holes and halo particles.
          if (uDoppler > 0.001 && kindI != 2 && !isHalo) {
            vec3 toCam = normalize(cameraPosition - pos.xyz);
            float beta = dot(vel.xyz, toCam) / max(uSpeedMax, 0.1);
            float b = clamp(1.0 + uDoppler * beta, 0.15, 2.5);
            c *= b * b * b;
          }

          // --- Follow-cam highlight: boost size and whiten the picked body.
          // uFollowUV == (-1, -1) when follow-cam is inactive.
          if (uFollowUV.x >= 0.0 &&
              abs(aRef.x - uFollowUV.x) < 0.0005 &&
              abs(aRef.y - uFollowUV.y) < 0.0005) {
            float bump = 1.6 + uFollowPulse * 1.4;
            gl_PointSize *= bump;
            c = mix(c, vec3(1.0, 1.0, 1.0), 0.45 + 0.35 * uFollowPulse);
            // Force full alpha even for halo so the marker is always visible.
            vColor = c;
            vAlpha = 1.0;
            return;
          }

          vColor = c * sizeBoost * uTierGain;
          vAlpha = isHalo ? 0.32 : 1.0;
        }
      `;

      const pointFrag = /* glsl */ `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          if (vAlpha <= 0.0) discard;
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          if (d > 0.5) discard;
          float a = smoothstep(0.5, 0.0, d);
          a = pow(a, 1.55);
          gl_FragColor = vec4(vColor * a * 1.35 * vAlpha, a * vAlpha);
        }
      `;

      const refGeom = new THREE.BufferGeometry();
      function populateRefGeom(texSize) {
        const n = texSize * texSize;
        const refs = new Float32Array(n * 2);
        const positions = new Float32Array(n * 3);
        let k = 0;
        for (let y = 0; y < texSize; y++) {
          for (let x = 0; x < texSize; x++) {
            refs[k * 2 + 0] = (x + 0.5) / texSize;
            refs[k * 2 + 1] = (y + 0.5) / texSize;
            k++;
          }
        }
        refGeom.setAttribute(
          "position",
          new THREE.BufferAttribute(positions, 3),
        );
        refGeom.setAttribute("aRef", new THREE.BufferAttribute(refs, 2));
      }
      populateRefGeom(TEX_SIZE);

      const pointMat = new THREE.ShaderMaterial({
        uniforms: {
          uPos: { value: null },
          uVel: { value: null },
          uPointScale: { value: 2.0 },
          uChannel: { value: 1.0 }, // default: speed
          uChannel2: { value: 1.0 },
          uChannelMix: { value: 0.0 }, // 0 = use uChannel, 1 = use uChannel2
          uPaletteStops: { value: 5.0 },
          uPalette: {
            value: [
              new THREE.Vector3(0, 0, 0),
              new THREE.Vector3(1, 1, 1),
              new THREE.Vector3(1, 1, 1),
              new THREE.Vector3(1, 1, 1),
              new THREE.Vector3(1, 1, 1),
              new THREE.Vector3(1, 1, 1),
              new THREE.Vector3(1, 1, 1),
              new THREE.Vector3(1, 1, 1),
            ],
          },
          uShowHalo: { value: 0.0 },
          uTime: { value: 0.0 },
          uMaxAge: { value: MAX_AGE },
          uBHHighlight: { value: 1.0 },
          uSpeedMax: { value: 30.0 },
          uDoppler: { value: 0.0 },
          uKindTints: { value: new Array(NUM_KINDS * 3).fill(1.0) },
          uFollowUV: { value: new THREE.Vector2(-1.0, -1.0) },
          uFollowPulse: { value: 0.0 },
          // Astrophage sink for the kind-7 arrival fade; set by
          // applyAstroUniforms, zero radius = inactive.
          uPlanetPos: { value: new THREE.Vector3(0, 0, 0) },
          uPlanetRadius: { value: 0.0 },
          // Device-pixel caps (F6). If a render-scale setting ever changes
          // the pixel ratio at runtime, rescale these with it.
          uPointMax: { value: 256.0 * renderer.getPixelRatio() },
          uPointMaxBH: { value: 1024.0 * renderer.getPixelRatio() },
          uViewScale: { value: 1.0 },
          uTierGain: { value: 1.0 },
        },
        vertexShader: pointVert,
        fragmentShader: pointFrag,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,
      });

      const bodies = new THREE.Points(refGeom, pointMat);
      bodies.frustumCulled = false;
      scene.add(bodies);

      // Sprite sizes are authored in device pixels for a 1440 px-tall frame
      // (the CONTRIBUTING screenshot spec). Scale them with the drawing
      // buffer so smaller canvases (iframes, previews, phones) and larger
      // captures keep the same composition. Called every frame and from the
      // capture path; __setPointRef(px) moves the reference.
      let POINT_REF_HEIGHT = 1440;
      const _dbSize = new THREE.Vector2();
      function syncPointViewScale() {
        const h = renderer.getDrawingBufferSize(_dbSize).y || POINT_REF_HEIGHT;
        pointMat.uniforms.uViewScale.value = Math.max(0.2, h / POINT_REF_HEIGHT);
        // Additive blending makes brightness ∝ body count. In token mode
        // the tier is a device concern, so lower tiers get a gain that
        // brings their integrated brightness to the lush look (√ because
        // sprites also overlap less): standard ×2, lite ×4. The main app
        // is untouched (gain 1).
        pointMat.uniforms.uTierGain.value = TOKEN.active
          ? Math.min(4, Math.max(1, Math.sqrt(65536 / MAX_BODIES)))
          : 1.0;
      }
      syncPointViewScale();
      if (typeof window !== "undefined") {
        window.__setPointRef = (px) => {
          if (px > 0) POINT_REF_HEIGHT = px;
          syncPointViewScale();
          return POINT_REF_HEIGHT;
        };
      }

      // ---- Photon ring  (scene-scoped; off by default) ----
      // Flat annulus in the disk plane (XZ).  Procedural glow: gaussian falloff
      // from a target radius, with a thin bright core for the "EHT" look.
      const ringMat = new THREE.ShaderMaterial({
        uniforms: {
          uRadius: { value: 12.0 },
          uThickness: { value: 1.5 },
          uColor: { value: new THREE.Color(1.15, 1.1, 1.05) },
          uOpacity: { value: 0.0 },
          uCoreBoost: { value: 0.8 },
        },
        vertexShader: `
          varying vec2 vLocal;
          void main() {
            vLocal = position.xy;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uRadius;
          uniform float uThickness;
          uniform vec3  uColor;
          uniform float uOpacity;
          uniform float uCoreBoost;
          varying vec2 vLocal;
          void main() {
            float d = length(vLocal);
            float dOff = abs(d - uRadius);
            float x = dOff / max(uThickness, 0.001);
            // Wide gaussian halo + narrow sharp core
            float halo = exp(-x * x);
            float core = exp(-(x * 3.0) * (x * 3.0)) * uCoreBoost;
            float intensity = (halo + core) * uOpacity;
            if (intensity < 0.002) discard;
            gl_FragColor = vec4(uColor * intensity * 1.25, intensity);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,
        side: THREE.DoubleSide,
      });
      // Ample padding so the gaussian halo doesn't get clipped
      const ringGeom = new THREE.PlaneGeometry(1, 1);
      const photonRing = new THREE.Mesh(ringGeom, ringMat);
      photonRing.rotation.x = -Math.PI / 2; // lay flat in XZ
      photonRing.frustumCulled = false;
      photonRing.visible = false;
      scene.add(photonRing);

      function setPhotonRing(cfg) {
        if (!cfg) {
          photonRing.visible = false;
          ringMat.uniforms.uOpacity.value = 0.0;
          return;
        }
        photonRing.visible = true;
        ringMat.uniforms.uRadius.value = cfg.radius;
        ringMat.uniforms.uThickness.value = cfg.thickness ?? 1.5;
        if (cfg.color)
          ringMat.uniforms.uColor.value.setRGB(
            cfg.color[0],
            cfg.color[1],
            cfg.color[2],
          );
        ringMat.uniforms.uCoreBoost.value = cfg.coreBoost ?? 0.8;
        ringMat.uniforms.uOpacity.value = cfg.opacity ?? 1.0;
        const span = 2 * (cfg.radius + (cfg.thickness ?? 1.5) * 5);
        photonRing.scale.set(span, span, 1);
      }

      // ---- Petrova Line decorations (scene-scoped; off by default) ----
      // Star + planet as camera-facing glow discs so they read as bodies
      // (PETROVA_LINE.md). Same lifecycle as the photon ring: applied by
      // setPetrovaDeco(cfg) on scene apply, opacity faded through zero
      // around swapT during transitions. One billboard material serves
      // both — the planet additionally gets a lit hemisphere and an
      // arrival-side glow lobe that faces `glowToward` (the star).
      function makeGlowDisc() {
        const mat = new THREE.ShaderMaterial({
          uniforms: {
            uSize: { value: 10.0 }, // quad half-size, world units
            uDiscR: { value: 0.3 }, // disc radius / uSize
            uLimb: { value: 0.3 }, // limb-glow width / uSize
            uColor: { value: new THREE.Color(1, 1, 1) },
            uLimbColor: { value: new THREE.Color(1, 0.7, 0.4) },
            uLimbGain: { value: 0.6 },
            uOpacity: { value: 0.0 },
            uGlowToward: { value: new THREE.Vector3(1, 0, 0) },
            uSideGlow: { value: 0.0 }, // arrival lobe strength
            uSideColor: { value: new THREE.Color(1, 0.4, 0.2) },
            uLit: { value: 0.0 }, // 1 = shade the disc as lit from uGlowToward
          },
          vertexShader: /* glsl */ `
            uniform float uSize;
            uniform vec3  uGlowToward;
            varying vec2 vLocal;
            varying vec2 vSide;
            void main() {
              vLocal = position.xy * 2.0; // PlaneGeometry(1,1): -1..1
