            if (jGlobal >= st && jGlobal < st + c) { seg = k; s = st; M = c; }
          }
          let i = i32(jGlobal - s);
          if (M < 2u || i >= i32(M) - 1) { return; } // M-1 internal nodes
          var d: i32 = 1;
          if (bhDelta(s, M, i, i - 1) > bhDelta(s, M, i, i + 1)) { d = -1; }
          let dmin = bhDelta(s, M, i, i - d);
          var lmax: i32 = 2;
          loop {
            if (bhDelta(s, M, i, i + lmax * d) <= dmin) { break; }
            lmax = lmax << 1;
          }
          var l: i32 = 0;
          var t: i32 = lmax >> 1;
          loop {
            if (t < 1) { break; }
            if (bhDelta(s, M, i, i + (l + t) * d) > dmin) { l = l + t; }
            t = t >> 1;
          }
          let j = i + l * d;
          let dnode = bhDelta(s, M, i, j);
          var spl: i32 = 0;
          var t2: i32 = l;
          loop {
            t2 = (t2 + 1) / 2;
            if (bhDelta(s, M, i, i + (spl + t2) * d) > dnode) {
              spl = spl + t2;
            }
            if (t2 <= 1) { break; }
          }
          var gamma: i32 = i + spl * d;
          if (d < 0) { gamma = gamma - 1; }
          let iMin = min(i, j);
          let iMax = max(i, j);
          var leftId: u32;
          var rightId: u32;
          if (iMin == gamma) {
            leftId = s + u32(gamma); // leaf
          } else {
            leftId = p.N + s + u32(gamma); // internal
          }
          if (iMax == gamma + 1) {
            rightId = s + u32(gamma + 1);
          } else {
            rightId = p.N + s + u32(gamma + 1);
          }
          let nodeId = p.N + s + u32(i);
          topo[nodeId].x = leftId;
          topo[nodeId].y = rightId;
          topo[leftId].z = nodeId;
          topo[rightId].z = nodeId;
          if (i == 0) { topo[nodeId].z = BH_INVALID; } // segment root
        }
      `;

      // -- leaves: COM/mass/AABB from sorted bodies, mark done -------
      const BH_WGSL_LEAFINIT =
        WGSL_SIM_PARAMS +
        BH_WGSL_COMMON +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read> positions: array<vec4<f32>>;
        @group(0) @binding(1) var<storage, read> idxSorted: array<u32>;
        @group(0) @binding(2) var<storage, read_write> comMass: array<vec4<f32>>;
        @group(0) @binding(3) var<storage, read_write> aabbN: array<vec4<f32>>;
        @group(0) @binding(4) var<storage, read_write> ext2: array<f32>;
        @group(0) @binding(5) var<storage, read_write> flagsA: array<u32>;
        // NB: no SimParams binding — the guard uses ctl's totalAlive.
        // With layout:"auto", a declared-but-unused binding would be
        // dropped from the layout and the bind group would fail.
        @group(0) @binding(6) var<storage, read> ctlR: array<u32>;
        @group(0) @binding(7) var<storage, read_write> flagsB: array<u32>;
        @compute @workgroup_size(256)
        fn bhLeafInit(@builtin(global_invocation_id) gid: vec3<u32>) {
          let j = gid.x;
          if (j >= ctlR[24]) { return; }
          let b = idxSorted[j];
          let pw = positions[b];
          comMass[j] = vec4<f32>(pw.xyz, max(pw.w, 0.0));
          aabbN[2u * j] = vec4<f32>(pw.xyz, 0.0);
          aabbN[2u * j + 1u] = vec4<f32>(pw.xyz, 0.0);
          ext2[j] = 0.0;
          // Leaves are done in BOTH ping-pong arrays so the aggregate
          // dispatches can cover internal nodes only (half the threads).
          flagsA[j] = 1u;
          flagsB[j] = 1u;
        }
      `;

      // -- ropes: skip pointer = right sibling of nearest left-child
      //    ancestor. Preorder traversal needs no stack with these. ----
      const BH_WGSL_ROPES =
        WGSL_SIM_PARAMS +
        BH_WGSL_COMMON +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read_write> topo: array<vec4<u32>>;
        @group(0) @binding(1) var<storage, read> ctlR: array<u32>;
        @group(0) @binding(2) var<storage, read> p: SimParams;
        @compute @workgroup_size(256)
        fn bhRopes(@builtin(global_invocation_id) gid: vec3<u32>) {
          let n = gid.x;
          if (n >= 2u * p.N) { return; }
          var inUse = false;
          if (n < p.N) {
            inUse = n < ctlR[24];
          } else {
            inUse = topo[n].x != BH_INVALID;
          }
          if (!inUse) { return; } // prep left rope = INVALID
          var q = n;
          var rope = BH_INVALID;
          var guard: u32 = 0u;
          loop {
            if (guard >= 64u) { break; }
            guard = guard + 1u;
            let par = topo[q].z;
            if (par == BH_INVALID) { break; }
            if (topo[par].x == q) {
              rope = topo[par].y;
              break;
            }
            q = par;
          }
          topo[n].w = rope;
        }
      `;

      // -- bottom-up aggregate, one wavefront per dispatch -----------
      const BH_WGSL_AGG =
        WGSL_SIM_PARAMS +
        BH_WGSL_COMMON +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read> topo: array<vec4<u32>>;
        @group(0) @binding(1) var<storage, read_write> comMass: array<vec4<f32>>;
        @group(0) @binding(2) var<storage, read_write> aabbN: array<vec4<f32>>;
        @group(0) @binding(3) var<storage, read_write> ext2: array<f32>;
        @group(0) @binding(4) var<storage, read> flagsIn: array<u32>;
        @group(0) @binding(5) var<storage, read_write> flagsOut: array<u32>;
        @group(0) @binding(6) var<storage, read> p: SimParams;
        @compute @workgroup_size(256)
        fn bhAggregate(@builtin(global_invocation_id) gid: vec3<u32>) {
          // Internal nodes only — leaves are pre-marked done in BOTH
          // flag arrays by bhLeafInit, so they never need copying.
          let t = gid.x;
          if (t >= p.N) { return; }
          let n = p.N + t;
          let left = topo[n].x;
          if (left == BH_INVALID) { // unused internal slot
            flagsOut[n] = 0u;
            return;
          }
          if (flagsIn[n] == 1u) {
            flagsOut[n] = 1u;
            return;
          }
          let right = topo[n].y;
          if (flagsIn[left] == 1u && flagsIn[right] == 1u) {
            let cmL = comMass[left];
            let cmR = comMass[right];
            let m = cmL.w + cmR.w;
            var com = vec3<f32>(0.0);
            if (m > 0.0) { com = (cmL.xyz * cmL.w + cmR.xyz * cmR.w) / m; }
            comMass[n] = vec4<f32>(com, m);
            let mn = min(aabbN[2u * left].xyz, aabbN[2u * right].xyz);
            let mx = max(aabbN[2u * left + 1u].xyz, aabbN[2u * right + 1u].xyz);
            aabbN[2u * n] = vec4<f32>(mn, 0.0);
            aabbN[2u * n + 1u] = vec4<f32>(mx, 0.0);
            let e = mx - mn;
            let s = max(e.x, max(e.y, e.z));
            ext2[n] = s * s;
            flagsOut[n] = 1u;
          } else {
            flagsOut[n] = 0u;
          }
        }
      `;
      const BH_WGSL_CHECK =
        WGSL_SIM_PARAMS +
        BH_WGSL_COMMON +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read> topo: array<vec4<u32>>;
        @group(0) @binding(1) var<storage, read> flagsA: array<u32>;
        @group(0) @binding(2) var<storage, read_write> ctlA: array<atomic<u32>>;
        @group(0) @binding(3) var<storage, read> p: SimParams;
        @compute @workgroup_size(256)
        fn bhCheck(@builtin(global_invocation_id) gid: vec3<u32>) {
          let t = gid.x;
          if (t >= p.N) { return; }
          let node = p.N + t;
          if (topo[node].x == BH_INVALID) { return; }
          if (flagsA[node] == 0u) { atomicAdd(&ctlA[25], 1u); }
        }
      `;

      // -- force: brute velStep with the tile loop swapped for
      //    per-segment stackless θ-MAC walks ---------------------------
      const BH_WGSL_FORCE =
        WGSL_SIM_PARAMS +
        BH_WGSL_COMMON +
        /* wgsl */ `
        const NUM_KINDS: u32 = 8u;
        @group(0) @binding(0) var<storage, read> positions: array<vec4<f32>>;
        @group(0) @binding(1) var<storage, read> velocities: array<vec4<f32>>;
        @group(0) @binding(2) var<storage, read_write> outVel: array<vec4<f32>>;
        @group(0) @binding(3) var<storage, read> p: SimParams;
        @group(0) @binding(4) var<storage, read> comMass: array<vec4<f32>>;
        @group(0) @binding(5) var<storage, read> ext2: array<f32>;
        @group(0) @binding(6) var<storage, read> topo: array<vec4<u32>>;
        @group(0) @binding(7) var<storage, read> ctlR: array<u32>;
        fn hash22(p2: vec2<f32>, seed: f32) -> vec2<f32> {
          var p3 = fract(vec3<f32>(p2.x, p2.y, p2.x) * vec3<f32>(0.1031, 0.1030, 0.0973) + seed * 0.173);
          p3 = p3 + dot(p3, p3.yzx + 19.19);
          return fract((p3.xx + p3.yz) * p3.zy);
        }
        ${WGSL_ASTRO_FNS}
        @compute @workgroup_size(256)
        fn bhForce(@builtin(global_invocation_id) gid: vec3<u32>) {
          let i = gid.x;
          if (i >= p.N) { return; }
          let alive = positions[i].w > 0.0;
          let posA = positions[i];
          let velA = velocities[i];
          let pA = posA.xyz;
          let kindFloat = floor(velA.w + 0.001);
          let ageNorm = velA.w - kindFloat;
          let kindA = clamp(i32(kindFloat), 0, i32(NUM_KINDS) - 1);
          var kRow: array<f32, NUM_KINDS>;
          for (var k: u32 = 0u; k < NUM_KINDS; k = k + 1u) {
            kRow[k] = p.K[u32(kindA) * NUM_KINDS + k];
          }
          let G = p.G;
          let eps2 = p.eps2;

          // Astrophage (kind 7) — PETROVA_LINE.md §3.1, same force law as
          // the brute kernel's kind-7 branch (star + planet gravity +
          // thrust with ASTRO_STEER steering; no tree walk, flocking,
          // spin or hand). This kernel has no barriers, so early return.
          if (alive && kindA == 7) {
            let starPos   = vec3<f32>(p.starX, p.starY, p.starZ);
            let planetPos = vec3<f32>(p.planetX, p.planetY, p.planetZ);
            let uvA = astroUv(i);
            if (p.planetRadius > 0.0 && length(pA - planetPos) < p.planetRadius) {
              let sp = astroSpawnPoint(uvA, p.frame);
              outVel[i] = vec4<f32>(astroLaunchVel(sp, uvA, p.frame), kindFloat);
              return;
            }
            let toStar   = starPos - pA;
            let toPlanet = planetPos - pA;
            let r2s = dot(toStar, toStar) + eps2;
            let r2p = dot(toPlanet, toPlanet) + eps2;
            let fStar   = G * p.starMass   * toStar   * inverseSqrt(r2s * r2s * r2s);
            let fPlanet = G * p.planetMass * toPlanet * inverseSqrt(r2p * r2p * r2p);
            let distP = max(length(toPlanet), 0.001);
            let dirP  = toPlanet / distP;
            let vA    = velA.xyz;
            let vPerp = vA - dot(vA, dirP) * dirP;
            let fThrust = dirP * p.astroThrust
                        - vPerp * (${ASTRO_STEER.toFixed(3)} * p.sign);
            let nv = vA + (fStar + fPlanet + fThrust) * p.dt * p.sign;
            let dAgeA = p.dt * abs(p.sign) / p.maxAge;
            outVel[i] = vec4<f32>(nv, kindFloat + clamp(ageNorm + dAgeA, 0.0, 0.9999));
            return;
          }

          var acc = vec3<f32>(0.0);
          if (alive) {
            let th2 = p.theta2;
            let cap = 4u * p.N + 64u;
            for (var b: u32 = 0u; b < NUM_KINDS; b = b + 1u) {
              let kw = kRow[b];
              let root = ctlR[16u + b];
              if (kw == 0.0 || root == BH_INVALID) { continue; }
              var node = root;
              var segAcc = vec3<f32>(0.0);
              var guard: u32 = 0u;
              loop {
                if (node == BH_INVALID || guard >= cap) { break; }
                guard = guard + 1u;
                let cm = comMass[node];
                let dvec = cm.xyz - pA;
                let d2 = dot(dvec, dvec);
                var take = node < p.N; // leaf: direct softened pair
                if (!take) {
                  take = ext2[node] < th2 * d2; // θ-MAC on tight AABB
                }
                if (take) {
                  let r2 = d2 + eps2;
                  let invR3 = inverseSqrt(r2 * r2 * r2);
                  segAcc = segAcc + cm.w * dvec * invR3;
                  node = topo[node].w; // rope
                } else {
                  node = topo[node].x; // descend left
                }
              }
              acc = acc + G * kw * segAcc;
            }
          }

          // ── stochastic neighborhood (flocking + radiation) — same
          // block as the brute kernel, verbatim. ──
          if (alive && (p.flock > 0.001 || p.radiation > 0.001)) {
            let xSelf = i % p.texSize;
            let ySelf = i / p.texSize;
            let uvSelf = (vec2<f32>(f32(xSelf), f32(ySelf)) + 0.5) / f32(p.texSize);
            var alignV = vec3<f32>(0.0);
            var cohC = vec3<f32>(0.0);
            var sepF = vec3<f32>(0.0);
            var brightDir = vec3<f32>(0.0);
            var wSum: f32 = 0.0;
            for (var s: u32 = 0u; s < 8u; s = s + 1u) {
              let rnd = hash22(uvSelf * 47.0 + f32(s) * 11.3, p.frame * 0.001 + 0.7);
              let rx = u32(floor(rnd.x * f32(p.texSize)));
              let ry = u32(floor(rnd.y * f32(p.texSize)));
              let cx = min(rx, p.texSize - 1u);
              let cy = min(ry, p.texSize - 1u);
              let randIdx = cy * p.texSize + cx;
              let posS = positions[randIdx];
              if (posS.w <= 0.0) { continue; }
              let velS = velocities[randIdx];
              let dS = posS.xyz - pA;
              let rS = length(dS) + 0.001;
              let w = 1.0 / (1.0 + rS * 0.02);
              alignV = alignV + velS.xyz * w;
              cohC = cohC + posS.xyz * w;
              sepF = sepF - dS / (rS * rS * rS + 0.001);
              let b2 = length(velS.xyz) * posS.w * w;
              brightDir = brightDir + (dS / rS) * b2;
              wSum = wSum + w;
            }
            if (wSum > 0.001) {
              alignV = alignV / wSum;
              cohC = cohC / wSum;
              var flockK: f32 = 0.0;
              if (kindA == 3) {
                flockK = 1.0;
              } else if (kindA == 0 || kindA == 5 || kindA == 6) {
                flockK = 0.12;
              }
              let fA = (alignV - velA.xyz) * 0.22;
              let fC = (cohC - pA) * 0.004;
              let fS = sepF * 0.04;
              acc = acc + (fA + fC + fS) * p.flock * flockK;
              if (p.radiation > 0.001) {
                brightDir = brightDir / wSum;
                acc = acc - brightDir * p.radiation * 0.00004;
              }
            }
          }

          if (alive && p.spin != 0.0) {
            let r = pA - vec3<f32>(p.comX, p.comY, p.comZ);
            acc = acc + cross(vec3<f32>(0.0, p.spin, 0.0), r);
          }

          if (alive && (p.handStrength > 0.0 || p.handPull > 0.0)) {
            let handPos = vec3<f32>(p.handX, p.handY, p.handZ);
            let toHand = pA - handPos;
            let r2h = dot(toHand, toHand);
            let sigma2 = max(p.handRadius * p.handRadius, 1e-3);
            let w = exp(-r2h / sigma2);
            acc = acc + p.handStrength * w * vec3<f32>(p.handVx, p.handVy, p.handVz);
            acc = acc - p.handPull * w * toHand;
          }

          let newVel = velA.xyz + acc * p.dt * p.sign;
          let dAge = p.dt * abs(p.sign) / p.maxAge;
          let newAge = clamp(ageNorm + dAge, 0.0, 0.9999);
          if (alive) {
            outVel[i] = vec4<f32>(newVel, kindFloat + newAge);
          } else {
            outVel[i] = velA;
          }
        }
      `;

      // ----- JS orchestration ---------------------------------------
      async function bhInitPipelines() {
        if (bhSim.pipelines || bhSim.failed) return;
        if (bhSim.initPromise) return bhSim.initPromise;
        bhSim.initPromise = (async () => {
          const device = wgpuSim.device;
          try {
            const mk = (code, entry) =>
              device.createComputePipelineAsync({
                layout: "auto",
                compute: {
                  module: device.createShaderModule({
                    code,
                    label: "bh:" + entry,
                  }),
                  entryPoint: entry,
                },
              });
            const [
              prep,
              aabbA,
              aabbB,
              morton,
              segsetup,
              hist,
              scan,
              scatter,
              build,
              leafInit,
              ropes,
              agg,
              check,
              force,
            ] = await Promise.all([
              mk(BH_WGSL_PREP, "bhPrep"),
              mk(BH_WGSL_AABB_A, "bhAabbA"),
              mk(BH_WGSL_AABB_B, "bhAabbB"),
              mk(BH_WGSL_MORTON, "bhMorton"),
              mk(BH_WGSL_SEGSETUP, "bhSegSetup"),
              mk(BH_WGSL_HIST, "bhHist"),
              mk(BH_WGSL_SCAN, "bhScan"),
              mk(BH_WGSL_SCATTER, "bhScatter"),
              mk(BH_WGSL_BUILD, "bhBuild"),
              mk(BH_WGSL_LEAFINIT, "bhLeafInit"),
              mk(BH_WGSL_ROPES, "bhRopes"),
              mk(BH_WGSL_AGG, "bhAggregate"),
              mk(BH_WGSL_CHECK, "bhCheck"),
              mk(BH_WGSL_FORCE, "bhForce"),
            ]);
            bhSim.pipelines = {
              prep,
              aabbA,
              aabbB,
              morton,
              segsetup,
              hist,
              scan,
              scatter,
              build,
              leafInit,
              ropes,
              agg,
              check,
              force,
            };
            console.info("[bh] pipelines compiled");
          } catch (e) {
            bhSim.failed = "pipeline compile: " + ((e && e.message) || e);
            console.warn("[bh]", bhSim.failed);
          }
        })();
        return bhSim.initPromise;
      }

      function bhAllocateBuffers(N) {
        const device = wgpuSim.device;
        if (bhSim.buffers) {
          for (const k of Object.keys(bhSim.buffers)) {
            const b = bhSim.buffers[k];
            if (Array.isArray(b)) for (const x of b) x && x.destroy();
            else if (b) b.destroy();
          }
        }
        const numBlocks = Math.ceil(N / 256);
        const total = 16 * numBlocks;
        const spanLen = Math.ceil(total / 256);
        const S = GPUBufferUsage.STORAGE;
        const SC = S | GPUBufferUsage.COPY_SRC;
        const mkBuf = (size, usage) =>
          device.createBuffer({ size: Math.max(size, 16), usage });
        const pp = [];
        for (let p8 = 0; p8 < 8; p8++) {
          const b = mkBuf(16, S | GPUBufferUsage.COPY_DST);
          device.queue.writeBuffer(
            b,
            0,
            new Uint32Array([p8 * 4, numBlocks, spanLen, total]),
          );
          pp.push(b);
        }
        bhSim.buffers = {
          keysA: mkBuf(N * 4, SC),
          keysB: mkBuf(N * 4, SC),
          idxA: mkBuf(N * 4, SC),
          idxB: mkBuf(N * 4, SC),
          hist: mkBuf(total * 4, S),
          partials: mkBuf(numBlocks * 2 * 16, S),
          aabbBox: mkBuf(2 * 16, SC),
          topo: mkBuf(2 * N * 16, SC),
          comMass: mkBuf(2 * N * 16, SC),
          aabbN: mkBuf(4 * N * 16, S),
          ext2: mkBuf(2 * N * 4, SC),
          flagsA: mkBuf(2 * N * 4, SC),
          flagsB: mkBuf(2 * N * 4, S),
          ctl: mkBuf(128, SC),
          pp,
        };
        bhSim.capacity = N;
        bhBuildBindGroups();
        const mb = (
          (N * (4 * 4 + 16 * 2 + 16 * 2 + 64 + 8 + 8)) /
          1048576
        ).toFixed(1);
        console.info(`[bh] buffers allocated for N=${N} (~${mb} MB)`);
      }

      function bhBuildBindGroups() {
        const device = wgpuSim.device;
        const P = bhSim.pipelines;
        const B = bhSim.buffers;
        const W = wgpuSim.buffers;
        const g = (pipe, bufs) =>
          device.createBindGroup({
            layout: pipe.getBindGroupLayout(0),
            entries: bufs.map((buf, i) => ({
              binding: i,
              resource: { buffer: buf },
            })),
          });
        // Radix ping-pong: even pass reads A writes B, odd reads B writes A.
        const keysIn = (p8) => (p8 % 2 === 0 ? B.keysA : B.keysB);
        const keysOut = (p8) => (p8 % 2 === 0 ? B.keysB : B.keysA);
        const idxIn = (p8) => (p8 % 2 === 0 ? B.idxA : B.idxB);
        const idxOut = (p8) => (p8 % 2 === 0 ? B.idxB : B.idxA);
        bhSim.groups = {
          prep: g(P.prep, [B.flagsA, B.flagsB, B.topo, B.ctl, W.params]),
          aabbA: [
            g(P.aabbA, [W.posA, B.partials, W.params]),
            g(P.aabbA, [W.posB, B.partials, W.params]),
          ],
          aabbB: g(P.aabbB, [B.partials, B.aabbBox, B.pp[0]]),
          morton: [
            g(P.morton, [
              W.posA,
              W.velA,
              B.keysA,
              B.idxA,
              B.aabbBox,
              B.ctl,
              W.params,
            ]),
            g(P.morton, [
              W.posB,
              W.velB,
              B.keysA,
              B.idxA,
              B.aabbBox,
              B.ctl,
              W.params,
            ]),
          ],
          segsetup: g(P.segsetup, [B.ctl, W.params]),
          hist: Array.from({ length: 8 }, (_, p8) =>
            g(P.hist, [keysIn(p8), B.hist, B.pp[p8], W.params]),
          ),
          scan: g(P.scan, [B.hist, B.pp[0]]),
          scatter: Array.from({ length: 8 }, (_, p8) =>
            g(P.scatter, [
              keysIn(p8),
              idxIn(p8),
              keysOut(p8),
              idxOut(p8),
              B.hist,
              B.pp[p8],
              W.params,
            ]),
          ),
          build: g(P.build, [B.keysA, B.topo, B.ctl, W.params]),
          leafInit: [
            g(P.leafInit, [
              W.posA,
              B.idxA,
              B.comMass,
              B.aabbN,
              B.ext2,
              B.flagsA,
              B.ctl,
              B.flagsB,
            ]),
            g(P.leafInit, [
              W.posB,
              B.idxA,
              B.comMass,
              B.aabbN,
              B.ext2,
              B.flagsA,
              B.ctl,
              B.flagsB,
            ]),
          ],
          ropes: g(P.ropes, [B.topo, B.ctl, W.params]),
          aggAB: g(P.agg, [
            B.topo,
            B.comMass,
            B.aabbN,
            B.ext2,
            B.flagsA,
            B.flagsB,
            W.params,
          ]),
          aggBA: g(P.agg, [
            B.topo,
            B.comMass,
            B.aabbN,
            B.ext2,
            B.flagsB,
            B.flagsA,
            W.params,
          ]),
          check: g(P.check, [B.topo, B.flagsA, B.ctl, W.params]),
          force: [
            g(P.force, [
              W.posA,
              W.velA,
              W.velB,
              W.params,
              B.comMass,
              B.ext2,
              B.topo,
              B.ctl,
            ]),
            g(P.force, [
              W.posB,
              W.velB,
              W.velA,
              W.params,
              B.comMass,
              B.ext2,
              B.topo,
              B.ctl,
            ]),
          ],
        };
        bhSim.epoch = wgpuSim.epoch | 0;
      }

      // Encode the full tree build into an existing command encoder.
      // ts (optional) = wgpuSim.tsQuery when this substep is sampled:
      // slot 4 = build begin (prep pass), slot 5 = build end (check).
      function bhEncodeBuild(enc, which, ts) {
        const P = bhSim.pipelines;
        const Gp = bhSim.groups;
        const N = bhSim.capacity;
        const nb = Math.ceil(N / 256);
        const n2 = Math.ceil((2 * N) / 256);
        const pass = (pipe, group, wgs, desc) => {
          const cp = enc.beginComputePass(desc || {});
          cp.setPipeline(pipe);
          cp.setBindGroup(0, group);
          cp.dispatchWorkgroups(wgs);
          cp.end();
        };
        pass(
          P.prep,
          Gp.prep,
          n2,
          ts
            ? {
                timestampWrites: {
                  querySet: ts.set,
                  beginningOfPassWriteIndex: 4,
                },
              }
            : {},
        );
        pass(P.aabbA, Gp.aabbA[which], nb);
        pass(P.aabbB, Gp.aabbB, 1);
        pass(P.morton, Gp.morton[which], nb);
        pass(P.segsetup, Gp.segsetup, 1);
        for (let p8 = 0; p8 < 8; p8++) {
          pass(P.hist, Gp.hist[p8], nb);
          pass(P.scan, Gp.scan, 1);
          pass(P.scatter, Gp.scatter[p8], nb);
        }
        pass(P.build, Gp.build, nb);
        pass(P.leafInit, Gp.leafInit[which], nb);
        pass(P.ropes, Gp.ropes, n2);
        // Even iteration count keeps the final flags in flagsA (check
        // and the next frame's leafInit both assume that parity).
        // Tunable at runtime: bhSim.aggIters — must exceed the deepest
        // tree; __bhTree() reports the measured depth per scene.
        let iters = Math.max(8, bhSim.aggIters | 0);
        if (iters % 2 === 1) iters++;
        for (let t = 0; t < iters; t++) {
          pass(P.agg, t % 2 === 0 ? Gp.aggAB : Gp.aggBA, nb);
        }
        pass(
          P.check,
          Gp.check,
          nb,
          ts
            ? { timestampWrites: { querySet: ts.set, endOfPassWriteIndex: 5 } }
            : {},
        );
      }

      // True when BH can run THIS substep; kicks async init otherwise.
      function bhReadyForStep() {
        if (!wgpuSim.available || !wgpuSim.buffers || bhSim.failed)
          return false;
        if (!bhSim.pipelines) {
          bhInitPipelines();
          return false;
        }
        if (
          bhSim.capacity !== wgpuSim.capacity ||
          (bhSim.epoch | 0) !== (wgpuSim.epoch | 0)
        ) {
          bhAllocateBuffers(wgpuSim.capacity);
        }
        return !!bhSim.buffers;
      }

      async function bhEnsureReady() {
        if (!wgpuSim.available || !wgpuSim.buffers) return false;
        if (!bhSim.pipelines && !bhSim.failed) await bhInitPipelines();
        if (bhSim.failed) return false;
        if (
          bhSim.capacity !== wgpuSim.capacity ||
          (bhSim.epoch | 0) !== (wgpuSim.epoch | 0)
        ) {
          bhAllocateBuffers(wgpuSim.capacity);
        }
        return !!bhSim.buffers;
      }

      // ----- verify harness (BH_TESTING.md) -------------------------
      async function bhReadback(list) {
        // list: [buffer, bytes][] → one staging buffer, one map.
        const device = wgpuSim.device;
        const totalBytes = list.reduce((a, x) => a + x[1], 0);
        const stage = device.createBuffer({
          size: totalBytes,
          usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
        });
        const enc = device.createCommandEncoder();
        let off = 0;
        for (const [buf, bytes] of list) {
          enc.copyBufferToBuffer(buf, 0, stage, off, bytes);
          off += bytes;
        }
        device.queue.submit([enc.finish()]);
        await stage.mapAsync(GPUMapMode.READ);
        const ab = stage.getMappedRange().slice(0);
        stage.unmap();
        stage.destroy();
        return ab;
      }

      // M1–M4 gate: build a tree from the live state and structurally
      // validate it on the CPU. Run at ≤99k for speed (works anywhere).
      async function bhVerifyTree() {
        if (!(await bhEnsureReady())) {
          console.warn("[bh] tree verify: not ready", bhSim.failed || "");
          return null;
        }
        if (!wgpuSim.active) wgpuUploadState();
        if (!writeWgpuParams()) return null;
        const device = wgpuSim.device;
        const N = bhSim.capacity;
        if (N > 262144) {
          console.warn(
            "[bh] tree verify at N=" + N + " — readback is large; prefer ≤99k",
          );
        }
        const which = wgpuSim.which | 0;
        const B = bhSim.buffers;
        const W = wgpuSim.buffers;
        const posBuf = which === 0 ? W.posA : W.posB;
        const velBuf = which === 0 ? W.velA : W.velB;
        const enc = device.createCommandEncoder();
        bhEncodeBuild(enc, which, null);
        device.queue.submit([enc.finish()]);
        const ab = await bhReadback([
          [posBuf, N * 16],
          [velBuf, N * 16],
          [B.keysA, N * 4],
          [B.idxA, N * 4],
          [B.topo, 2 * N * 16],
          [B.comMass, 2 * N * 16],
          [B.ext2, 2 * N * 4],
          [B.ctl, 128],
        ]);
        let off = 0;
        const take = (Ctor, count) => {
          const v = new Ctor(ab, off, count);
          off += count * Ctor.BYTES_PER_ELEMENT;
          return v;
        };
        const pos = take(Float32Array, N * 4);
        const vel = take(Float32Array, N * 4);
        const keys = take(Uint32Array, N);
        const idx = take(Uint32Array, N);
        const topo = take(Uint32Array, 2 * N * 4);
        const com = take(Float32Array, 2 * N * 4);
        take(Float32Array, 2 * N); // ext2 — presence only
        const ctl = take(Uint32Array, 32);
        const INV = 0xffffffff;
        const errs = [];
        // (a) alive counts per kind
        const jsCount = new Array(8).fill(0);
        const jsMass = new Array(8).fill(0);
        const jsCom = Array.from({ length: 8 }, () => [0, 0, 0]);
        for (let i = 0; i < N; i++) {
          const m = pos[i * 4 + 3];
          if (m <= 0) continue;
          const k = Math.min(
            7,
            Math.max(0, Math.floor(vel[i * 4 + 3] + 0.001)),
          );
          jsCount[k]++;
          jsMass[k] += m;
          jsCom[k][0] += pos[i * 4] * m;
          jsCom[k][1] += pos[i * 4 + 1] * m;
          jsCom[k][2] += pos[i * 4 + 2] * m;
        }
        for (let k = 0; k < 8; k++) {
          if (ctl[k] !== jsCount[k]) {
            errs.push(`aliveCount[${k}]=${ctl[k]} js=${jsCount[k]}`);
          }
        }
        const totalAlive = ctl[24];
        if (totalAlive !== jsCount.reduce((a, b) => a + b, 0)) {
          errs.push(
            `totalAlive=${totalAlive} js=${jsCount.reduce((a, b) => a + b, 0)}`,
          );
        }
        // (b) sorted keys, kind-contiguous
        for (let j = 1; j < totalAlive; j++) {
          if (keys[j] < keys[j - 1]) {
            errs.push(`keys unsorted at ${j}`);
            break;
          }
        }
        for (let j = 0; j < totalAlive; j++) {
          const kindBits = keys[j] >>> 27;
          const b = idx[j];
          const kJs = Math.min(
            7,
            Math.max(0, Math.floor(vel[b * 4 + 3] + 0.001)),
          );
          if (kindBits !== kJs) {
            errs.push(
              `key kind bits ${kindBits} != body kind ${kJs} at slot ${j}`,
            );
            break;
          }
        }
        // (c) not-converged counter
        if (ctl[25] !== 0) errs.push(`aggregate notConverged=${ctl[25]}`);
        // (d) per-segment structure: stack walk + rope walk + mass/COM
        const visited = new Uint8Array(2 * N);
        let maxDepth = 0;
        const segs = [];
        for (let k = 0; k < 8; k++) {
          const M = ctl[k];
          const s = ctl[8 + k];
          const root = ctl[16 + k];
          segs.push({ kind: k, count: M, start: s, root });
          if (M === 0) {
            if (root !== INV) errs.push(`empty seg ${k} has root`);
            continue;
          }
          // stack walk over left/right; depth tracked because the
          // aggregate wavefront count (bhSim.aggIters) must exceed the
          // deepest tree — maxDepth in the report is the tuning input.
          let leaves = 0;
          let pops = 0;
          const stack = [root];
          const dstack = [0];
          while (stack.length && pops < 4 * N + 64) {
            const n = stack.pop();
            const dep = dstack.pop();
            pops++;
            if (n === INV || n >= 2 * N) {
              errs.push(`seg ${k}: bad node ${n}`);
              break;
            }
            if (visited[n]) {
              errs.push(`seg ${k}: node ${n} visited twice`);
              break;
            }
            visited[n] = 1;
            if (dep > maxDepth) maxDepth = dep;
            if (n < N) {
              leaves++;
              if (n < s || n >= s + M) {
                errs.push(`seg ${k}: leaf ${n} outside [${s},${s + M})`);
                break;
              }
            } else {
              stack.push(topo[n * 4], topo[n * 4 + 1]);
              dstack.push(dep + 1, dep + 1);
            }
          }
          if (leaves !== M)
            errs.push(`seg ${k}: stack walk saw ${leaves}/${M} leaves`);
          // rope walk (the force kernel's traversal, always descending)
          let ropeLeaves = 0;
          let node = root;
          let guard = 0;
          while (node !== INV && guard < 4 * N + 64) {
            guard++;
            if (node < N) {
              ropeLeaves++;
              node = topo[node * 4 + 3];
            } else {
              node = topo[node * 4];
            }
          }
          if (ropeLeaves !== M)
            errs.push(`seg ${k}: rope walk saw ${ropeLeaves}/${M} leaves`);
          // root mass + COM vs JS
          const rm = com[root * 4 + 3];
          if (
            Math.abs(rm - jsMass[k]) >
            Math.max(1e-4 * Math.abs(jsMass[k]), 1e-4)
          ) {
            errs.push(`seg ${k}: root mass ${rm} js ${jsMass[k]}`);
          }
          if (jsMass[k] > 0) {
            for (let c = 0; c < 3; c++) {
              const want = jsCom[k][c] / jsMass[k];
              const got = com[root * 4 + c];
              if (
                Math.abs(got - want) > Math.max(1e-3 * Math.abs(want), 1e-2)
              ) {
                errs.push(
                  `seg ${k}: root COM[${c}] ${got.toFixed(4)} js ${want.toFixed(4)}`,
                );
                break;
              }
            }
          }
        }
        const pass = errs.length === 0;
        console[pass ? "info" : "warn"](
          `[bh] tree verify (${pass ? "OK" : "FAIL"}): N=${N} alive=${totalAlive} ` +
            `maxDepth=${maxDepth} (aggIters=${bhSim.aggIters}) segs=` +
            segs
              .filter((x) => x.count > 0)
              .map((x) => `${x.kind}:${x.count}`)
              .join(" "),
          pass ? "" : errs.slice(0, 12),
        );
        if (pass && maxDepth + 6 < bhSim.aggIters) {
          console.info(
            `[bh] depth headroom: this scene converges in ~${maxDepth} wavefronts; ` +
              `try bhSim.aggIters = ${maxDepth + 6} (then re-run __bhTree to confirm notConverged=0)`,
          );
        }
        return { pass, errs, segs, totalAlive, N, maxDepth };
      }

      // M5/M6 gate: identical input → BH accel vs brute accel.
      // RMS relative error < 1% at θ=0.5 is the ship gate.
      async function bhVerifyForce() {
        if (!(await bhEnsureReady())) {
          console.warn("[bh] force verify: not ready", bhSim.failed || "");
          return null;
        }
        if (!wgpuSim.active) wgpuUploadState();
        if (!writeWgpuParams()) return null;
        const device = wgpuSim.device;
        const N = bhSim.capacity;
        const bytes = N * 16;
        const which = wgpuSim.which | 0;
        const B = bhSim.buffers;
        const W = wgpuSim.buffers;
        const posBuf = which === 0 ? W.posA : W.posB;
        const velBuf = which === 0 ? W.velA : W.velB;
        const outBrute = device.createBuffer({
          size: bytes,
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
        });
        const outBH = device.createBuffer({
          size: bytes,
          usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC,
        });
        const bruteGroup = device.createBindGroup({
          layout: wgpuSim.bindLayout,
          entries: [
            { binding: 0, resource: { buffer: posBuf } },
            { binding: 1, resource: { buffer: velBuf } },
            { binding: 2, resource: { buffer: outBrute } },
            { binding: 3, resource: { buffer: W.params } },
          ],
        });
        const bhGroup = device.createBindGroup({
          layout: bhSim.pipelines.force.getBindGroupLayout(0),
          entries: [
            { binding: 0, resource: { buffer: posBuf } },
            { binding: 1, resource: { buffer: velBuf } },
            { binding: 2, resource: { buffer: outBH } },
            { binding: 3, resource: { buffer: W.params } },
            { binding: 4, resource: { buffer: B.comMass } },
            { binding: 5, resource: { buffer: B.ext2 } },
            { binding: 6, resource: { buffer: B.topo } },
            { binding: 7, resource: { buffer: B.ctl } },
          ],
        });
        const nb = Math.ceil(N / 256);
        const enc = device.createCommandEncoder();
        bhEncodeBuild(enc, which, null);
        let cp = enc.beginComputePass();
        cp.setPipeline(bhSim.pipelines.force);
        cp.setBindGroup(0, bhGroup);
        cp.dispatchWorkgroups(nb);
        cp.end();
        cp = enc.beginComputePass();
        cp.setPipeline(wgpuSim.pipelines.vel);
        cp.setBindGroup(0, bruteGroup);
        cp.dispatchWorkgroups(nb);
        cp.end();
        device.queue.submit([enc.finish()]);
        const ab = await bhReadback([
          [posBuf, bytes],
          [velBuf, bytes],
          [outBrute, bytes],
          [outBH, bytes],
        ]);
        outBrute.destroy();
        outBH.destroy();
        const pos = new Float32Array(ab, 0, N * 4);
        const vin = new Float32Array(ab, bytes, N * 4);
        const vbr = new Float32Array(ab, bytes * 2, N * 4);
        const vbh = new Float32Array(ab, bytes * 3, N * 4);
        let refSum = 0;
        let alive = 0;
        for (let i = 0; i < N; i++) {
          if (pos[i * 4 + 3] <= 0) continue;
          const dx = vbr[i * 4] - vin[i * 4];
          const dy = vbr[i * 4 + 1] - vin[i * 4 + 1];
          const dz = vbr[i * 4 + 2] - vin[i * 4 + 2];
          refSum += Math.sqrt(dx * dx + dy * dy + dz * dz);
          alive++;
        }
        const refMean = alive ? refSum / alive : 0;
        const rel = new Float32Array(alive);
        let ri = 0;
        let sumSq = 0;
        let maxRel = 0;
        for (let i = 0; i < N; i++) {
          if (pos[i * 4 + 3] <= 0) continue;
          const bx = vbr[i * 4] - vin[i * 4];
          const by = vbr[i * 4 + 1] - vin[i * 4 + 1];
          const bz = vbr[i * 4 + 2] - vin[i * 4 + 2];
          const hx = vbh[i * 4] - vin[i * 4];
          const hy = vbh[i * 4 + 1] - vin[i * 4 + 1];
          const hz = vbh[i * 4 + 2] - vin[i * 4 + 2];
          const dref = Math.sqrt(bx * bx + by * by + bz * bz);
          const derr = Math.sqrt(
            (hx - bx) * (hx - bx) +
              (hy - by) * (hy - by) +
              (hz - bz) * (hz - bz),
          );
          const r = derr / (dref + 1e-3 * refMean + 1e-12);
          rel[ri++] = r;
          sumSq += r * r;
          if (r > maxRel) maxRel = r;
        }
        rel.sort();
        const rms = alive ? Math.sqrt(sumSq / alive) : 0;
        const p99 = alive
          ? rel[Math.min(alive - 1, Math.floor(alive * 0.99))]
          : 0;
        const pass = rms < 0.01 && p99 < 0.05;
        console[pass ? "info" : "warn"](
          `[bh] force verify (${pass ? "OK" : "FAIL"}): θ=${bhSim.theta} N=${N} alive=${alive} ` +
            `rmsRel=${(rms * 100).toFixed(3)}% p99=${(p99 * 100).toFixed(2)}% max=${(maxRel * 100).toFixed(2)}%`,
        );
        return { pass, rms, p99, maxRel, alive, theta: bhSim.theta };
      }

      // Wall-clock per-substep cost, brute vs BH, on the live state.
      // NOTE: advances the sim by 2n substeps (it is a live painting).
      async function bhBench(n) {
        const steps = Math.max(10, n | 0 || 60);
        if (!(await bhEnsureReady())) {
          console.warn("[bh] bench: not ready", bhSim.failed || "");
          return null;
        }
        if (!wgpuSim.active) {
          console.warn("[bh] bench: activate the WebGPU backend first");
          return null;
        }
        const device = wgpuSim.device;
        const run = async (mode) => {
          await device.queue.onSubmittedWorkDone();
          const t0 = performance.now();
          for (let k = 0; k < steps; k++) wgpuStep(mode);
          await device.queue.onSubmittedWorkDone();
          return (performance.now() - t0) / steps;
        };
        const bruteMs = await run("brute");
        const bhMs = await run("bh");
        console.info(
          `[bh] bench N=${bhSim.capacity}: brute=${bruteMs.toFixed(2)}ms/substep ` +
            `bh=${bhMs.toFixed(2)}ms/substep (${(bruteMs / bhMs).toFixed(2)}×)`,
        );
        return { bruteMs, bhMs, speedup: bruteMs / bhMs, steps };
      }

      if (typeof window !== "undefined") {
        window.__bhTree = () =>
          bhVerifyTree().catch((e) => {
            console.warn("[bh] tree verify threw:", e);
            return null;
          });
        window.__bhCompare = () =>
          bhVerifyForce().catch((e) => {
            console.warn("[bh] force verify threw:", e);
            return null;
          });
        window.__bhBench = (n) =>
          bhBench(n).catch((e) => {
            console.warn("[bh] bench threw:", e);
            return null;
          });
        window.__bhToggle = (on) => {
          bhSim.wanted = on !== false;
          if (bhSim.wanted) bhEnsureReady();
          if (typeof showToast === "function") {
            showToast(
              "Barnes-Hut",
              bhSim.wanted ? `on θ=${bhSim.theta}` : "off",
            );
          }
          return bhSim.wanted;
        };
        window.__bhStatus = () => ({
          wanted: bhSim.wanted,
          ready: !!(bhSim.pipelines && bhSim.buffers && !bhSim.failed),
          failed: bhSim.failed,
          theta: bhSim.theta,
          capacity: bhSim.capacity,
          timing: { ...wgpuSim.timing },
        });
      }

      async function wgpuInitPipelines() {
        if (!wgpuSim.available || wgpuSim.pipelines) return;
        const device = wgpuSim.device;
        device.pushErrorScope("validation");
        const bindLayout = device.createBindGroupLayout({
          entries: [
            {
              binding: 0,
              visibility: GPUShaderStage.COMPUTE,
              buffer: { type: "read-only-storage" },
            },
            {
              binding: 1,
              visibility: GPUShaderStage.COMPUTE,
              buffer: { type: "read-only-storage" },
            },
            {
              binding: 2,
              visibility: GPUShaderStage.COMPUTE,
              buffer: { type: "storage" },
            },
            {
              binding: 3,
              visibility: GPUShaderStage.COMPUTE,
              buffer: { type: "read-only-storage" },
            },
          ],
        });
        const layout = device.createPipelineLayout({
          bindGroupLayouts: [bindLayout],
        });
        const velModule = device.createShaderModule({ code: WGSL_VEL_SHADER });
        const posModule = device.createShaderModule({ code: WGSL_POS_SHADER });
        const velPipeline = device.createComputePipeline({
          layout,
          compute: { module: velModule, entryPoint: "velStep" },
        });
        const posPipeline = device.createComputePipeline({
          layout,
          compute: { module: posModule, entryPoint: "posStep" },
        });
        const err = await device.popErrorScope();
        if (err) {
          console.warn("[wgpu] pipeline validation failed:", err.message);
          wgpuSim.available = false;
          wgpuSim.reason = "pipeline validation failed";
          return;
        }
        wgpuSim.bindLayout = bindLayout;
        wgpuSim.pipelines = { vel: velPipeline, pos: posPipeline };
        // Timestamp plumbing — N-independent, so it lives here rather
        // than in wgpuAllocateBuffers (which tears down on tier change).
        // Slots: 0/1 = velStep (or BH force) begin/end, 2/3 = posStep
        // begin/end, 4/5 = BH build phase (prep → check), 6/7 spare.
        if (wgpuSim.hasTimestamps && !wgpuSim.tsQuery) {
          wgpuSim.tsQuery = {
            set: device.createQuerySet({ type: "timestamp", count: 8 }),
            resolve: device.createBuffer({
              size: 64,
              usage: GPUBufferUsage.QUERY_RESOLVE | GPUBufferUsage.COPY_SRC,
            }),
            read: device.createBuffer({
              size: 64,
              usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST,
            }),
            busy: false,
            tick: 0,
          };
        }
        console.info("[wgpu] pipelines compiled");
      }

      // Allocate ping-pong storage buffers + params + double-buffered
      // staging buffers for the requested body count. Replaces any
      // existing allocation. Called once at probe success and again
      // by step 8 when the user changes density tier.
      function wgpuAllocateBuffers(N) {
        if (!wgpuSim.available || !wgpuSim.pipelines) return;
        const device = wgpuSim.device;
        // Bump epoch BEFORE destroy so any in-flight readback's .then
        // snapshot mismatches and bails out instead of writing into the
        // freshly-resized DataTextures. Pair with readbackBusy=false so
        // the next wgpuFrameStep isn't blocked by a now-orphaned token.
        wgpuSim.epoch = (wgpuSim.epoch | 0) + 1;
        wgpuSim.readbackBusy = false;
        if (wgpuSim.buffers) {
          for (const k of ["posA", "posB", "velA", "velB", "params"]) {
            const b = wgpuSim.buffers[k];
            if (b) b.destroy();
          }
          for (const sb of wgpuSim.buffers.staging || []) if (sb) sb.destroy();
          for (const sb of wgpuSim.buffers.frameStaging || [])
            if (sb) sb.destroy();
        }
        const bodyBytes = N * 16; // vec4<f32>
        const PARAMS_BYTES = WGPU_PARAMS_BYTES; // SimParams: 28 floats + K[64] + 14 astro floats = 424B → 432
        const make = () =>
          device.createBuffer({
            size: bodyBytes,
            usage:
              GPUBufferUsage.STORAGE |
              GPUBufferUsage.COPY_DST |
              GPUBufferUsage.COPY_SRC,
          });
        wgpuSim.buffers = {
          posA: make(),
          posB: make(),
          velA: make(),
          velB: make(),
          params: device.createBuffer({
            size: PARAMS_BYTES,
            usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
          }),
          staging: [
            device.createBuffer({
              size: bodyBytes,
              usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
            }),
            device.createBuffer({
              size: bodyBytes,
              usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
            }),
          ],
          // Dedicated readback pair for the per-frame loop in wgpuFrameStep.
          // Kept separate from staging[0..1] (used by ad-hoc devtools verifies
          // and pushToRender) so the two paths can't fight over a buffer.
          frameStaging: [
            device.createBuffer({
              size: bodyBytes,
              usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
            }),
            device.createBuffer({
              size: bodyBytes,
              usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
            }),
          ],
        };
        wgpuSim.capacity = N;
        const totalMB = ((4 * bodyBytes + 4 * bodyBytes) / 1048576).toFixed(1);
        console.info(`[wgpu] buffers allocated for N=${N} (~${totalMB} MB)`);

        // Phase 7a: persistent CPU-mirror DataTextures the renderer can
        // read from when WebGPU is the live source. Sized to TEX_SIZE,
        // float RGBA, same shape as the GPGPU render targets so they're
        // drop-in replacements at pointMat.uniforms.uPos/uVel.
        if (wgpuSim.posTex) wgpuSim.posTex.dispose();
        if (wgpuSim.velTex) wgpuSim.velTex.dispose();
        const posData = new Float32Array(N * 4);
        const velData = new Float32Array(N * 4);
        wgpuSim.posTex = new THREE.DataTexture(
          posData,
          TEX_SIZE,
          TEX_SIZE,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        wgpuSim.velTex = new THREE.DataTexture(
          velData,
          TEX_SIZE,
          TEX_SIZE,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        wgpuSim.posTex.needsUpdate = true;
        wgpuSim.velTex.needsUpdate = true;
      }

      // ----- step 3: upload + readback round-trip ------------------
      // Writes the CPU-side scene state (`state.positions` /
      // `state.velocities`) into the WebGPU side-A buffers. The
      // WebGL2 path does the same upload via DataTexture+blit; the two
      // mirror each other until the WebGPU compute path takes over.
      function wgpuUploadState() {
        if (!wgpuSim.available || !wgpuSim.buffers) return;
        if (wgpuSim.capacity < MAX_BODIES) {
          // Density tier grew underneath us — re-allocate. Step 8 will
          // wire this into rebuildPipeline; for now it's defensive.
          wgpuAllocateBuffers(MAX_BODIES);
        }
        const device = wgpuSim.device;
        const N = MAX_BODIES;
        device.queue.writeBuffer(
          wgpuSim.buffers.posA,
          0,
          state.positions.buffer,
          state.positions.byteOffset,
          N * 16,
        );
        device.queue.writeBuffer(
          wgpuSim.buffers.velA,
          0,
          state.velocities.buffer,
          state.velocities.byteOffset,
          N * 16,
        );
        // Live state now lives on side A — reset the ping-pong cursor so
        // the next wgpuStep reads from posA/velA. Without this, if the
        // ping-pong was on B (e.g., after a verify or several wgpuSteps),
        // the next step would read stale data from B and write the
        // freshly-uploaded data away.
        wgpuSim.which = 0;
        // Fresh state means fresh kinds/ages — make the next readback
        // include velocities even if the vel-cadence would skip them,
        // so point colors don't lag a scene rewrite.
        wgpuSim.forceVelRead = true;
      }

      // Round-trip check: copy posA/velA into the two staging buffers,
      // mapAsync, compare to `state.positions`/`state.velocities`. Any
      // diff > 1e-6 indicates a layout / size / endianness mismatch we
      // need to find before wiring step-4 compute. Logs results.
      async function wgpuReadbackVerify() {
        if (!wgpuSim.available || !wgpuSim.buffers) return null;
        const device = wgpuSim.device;
        const N = wgpuSim.capacity;
        const bytes = N * 16;
        const enc = device.createCommandEncoder();
        enc.copyBufferToBuffer(
          wgpuSim.buffers.posA,
          0,
          wgpuSim.buffers.staging[0],
          0,
          bytes,
        );
        enc.copyBufferToBuffer(
          wgpuSim.buffers.velA,
          0,
          wgpuSim.buffers.staging[1],
          0,
          bytes,
        );
        device.queue.submit([enc.finish()]);
        await Promise.all([
          wgpuSim.buffers.staging[0].mapAsync(GPUMapMode.READ),
          wgpuSim.buffers.staging[1].mapAsync(GPUMapMode.READ),
        ]);
        const posOut = new Float32Array(
          wgpuSim.buffers.staging[0].getMappedRange(),
        ).slice();
        const velOut = new Float32Array(
          wgpuSim.buffers.staging[1].getMappedRange(),
        ).slice();
        wgpuSim.buffers.staging[0].unmap();
        wgpuSim.buffers.staging[1].unmap();
        let posMaxDiff = 0;
        let velMaxDiff = 0;
        let mismatch = 0;
        const len = N * 4;
        for (let i = 0; i < len; i++) {
          const dPos = Math.abs(posOut[i] - state.positions[i]);
          const dVel = Math.abs(velOut[i] - state.velocities[i]);
          if (dPos > posMaxDiff) posMaxDiff = dPos;
          if (dVel > velMaxDiff) velMaxDiff = dVel;
          if (dPos > 1e-6 || dVel > 1e-6) mismatch++;
        }
        const result = {
          N,
          posMaxDiff,
          velMaxDiff,
          mismatch,
          pass: posMaxDiff < 1e-6 && velMaxDiff < 1e-6,
        };
        const tag = result.pass ? "OK" : "MISMATCH";
        console.info(
          `[wgpu] readback verify (${tag}): N=${N} posMaxDiff=${posMaxDiff.toExponential(2)} velMaxDiff=${velMaxDiff.toExponential(2)} mismatched=${mismatch}`,
        );
        return result;
      }

      // Devtools-friendly entry point — call from console anytime to
      // re-run the round-trip against current GPU state.
      if (typeof window !== "undefined") {
        window.__wgpuVerify = _wgpuGuard("readback verify", wgpuReadbackVerify);
      }

      // ----- step 4a: writeWgpuParams + dispatch sanity test -------
      // Pack current sim uniforms into the WebGPU params storage
      // buffer. Layout matches the WGSL SimParams struct.
      const _wgpuParamsScratch = new ArrayBuffer(WGPU_PARAMS_BYTES);
      const _wgpuParamsF32 = new Float32Array(_wgpuParamsScratch);
      const _wgpuParamsU32 = new Uint32Array(_wgpuParamsScratch);
      function writeWgpuParams(overrides) {
        if (!wgpuSim.available || !wgpuSim.buffers) return false;
        if (!velVar || !velVar.material || !posVar || !posVar.material) {
          return false;
        }
        const o = overrides || {};
        const u = velVar.material.uniforms;
        const pu = posVar.material.uniforms;
        _wgpuParamsF32[0] = o.dt ?? pu.uDt.value;
        _wgpuParamsF32[1] = o.G ?? u.uG.value;
        _wgpuParamsF32[2] = o.eps2 ?? u.uEps2.value;
        _wgpuParamsF32[3] = o.sign ?? u.uSign.value;
        _wgpuParamsF32[4] = o.frame ?? u.uFrame.value;
        _wgpuParamsF32[5] = o.flock ?? u.uFlock.value;
        _wgpuParamsF32[6] = o.radiation ?? u.uRadiation.value;
        _wgpuParamsF32[7] = o.maxAge ?? u.uMaxAge.value;
        _wgpuParamsU32[8] = MAX_BODIES | 0;
        _wgpuParamsU32[9] = NUM_KINDS | 0;
        _wgpuParamsU32[10] = TEX_SIZE | 0;
        _wgpuParamsF32[11] = o.spin ?? u.uSpin.value;
        const com = u.uCom.value;
        _wgpuParamsF32[12] = o.comX ?? com.x;
        _wgpuParamsF32[13] = o.comY ?? com.y;
        _wgpuParamsF32[14] = o.comZ ?? com.z;
        _wgpuParamsF32[15] = 0;
        const hp = u.uHandPos ? u.uHandPos.value : null;
        const hv = u.uHandVel ? u.uHandVel.value : null;
        _wgpuParamsF32[16] = hp ? hp.x : 0;
        _wgpuParamsF32[17] = hp ? hp.y : 0;
        _wgpuParamsF32[18] = hp ? hp.z : 0;
        _wgpuParamsF32[19] = u.uHandStrength ? u.uHandStrength.value : 0;
        _wgpuParamsF32[20] = hv ? hv.x : 0;
        _wgpuParamsF32[21] = hv ? hv.y : 0;
        _wgpuParamsF32[22] = hv ? hv.z : 0;
        _wgpuParamsF32[23] = u.uHandRadius ? u.uHandRadius.value : 1;
        _wgpuParamsF32[24] = u.uHandPull ? u.uHandPull.value : 0;
        // Slot 25 = SimParams.theta2 (Barnes-Hut MAC, BARNES_HUT_PLAN.md).
        // Harmless for the brute kernels, which never read it.
        _wgpuParamsF32[25] = bhSim.theta * bhSim.theta;
        _wgpuParamsF32[26] = 0;
        _wgpuParamsF32[27] = 0;
        const K = u.uK.value;
        for (let i = 0; i < NUM_KINDS * NUM_KINDS; i++) {
          _wgpuParamsF32[28 + i] = K[i];
        }
        // Astrophage slots 92..105 (SimParams.starX .. spawnRadius), in
        // struct order. K occupies 28..91 (28 + 64 = 92).
        const A0 = 28 + NUM_KINDS * NUM_KINDS;
        const sp = u.uStarPos ? u.uStarPos.value : null;
        const pp = u.uPlanetPos ? u.uPlanetPos.value : null;
        const so = u.uSpawnOffset ? u.uSpawnOffset.value : null;
        _wgpuParamsF32[A0 + 0] = sp ? sp.x : 0;
        _wgpuParamsF32[A0 + 1] = sp ? sp.y : 0;
        _wgpuParamsF32[A0 + 2] = sp ? sp.z : 0;
        _wgpuParamsF32[A0 + 3] = u.uStarMass ? u.uStarMass.value : 0;
        _wgpuParamsF32[A0 + 4] = pp ? pp.x : 0;
        _wgpuParamsF32[A0 + 5] = pp ? pp.y : 0;
        _wgpuParamsF32[A0 + 6] = pp ? pp.z : 0;
        _wgpuParamsF32[A0 + 7] = u.uPlanetMass ? u.uPlanetMass.value : 0;
        _wgpuParamsF32[A0 + 8] = u.uAstroThrust ? u.uAstroThrust.value : 0;
        _wgpuParamsF32[A0 + 9] = u.uPlanetRadius ? u.uPlanetRadius.value : 0;
        _wgpuParamsF32[A0 + 10] = so ? so.x : 0;
        _wgpuParamsF32[A0 + 11] = so ? so.y : 0;
        _wgpuParamsF32[A0 + 12] = so ? so.z : 0;
        _wgpuParamsF32[A0 + 13] = u.uSpawnRadius ? u.uSpawnRadius.value : 0;
        wgpuSim.device.queue.writeBuffer(
          wgpuSim.buffers.params,
          0,
          _wgpuParamsScratch,
          0,
          WGPU_PARAMS_BYTES,
        );
        return true;
      }

      // Minimal end-to-end dispatch: snapshot live state into the
      // posA / velA buffers, run velStep once, copy velB → staging,
      // log the first alive body's new velocity. No comparison vs
      // WebGL2 yet (step 4c). Devtools-only.
      async function wgpuTestVelStep() {
        if (!wgpuSim.available || !wgpuSim.pipelines || !wgpuSim.buffers) {
          console.warn("[wgpu] dispatch test: not ready");
          return null;
        }
        if (!writeWgpuParams()) {
          console.warn("[wgpu] dispatch test: writeWgpuParams failed");
          return null;
        }
        const device = wgpuSim.device;
        const N = MAX_BODIES;
        const bytes = N * 16;
        const posSnap = new Float32Array(N * 4);
        const velSnap = new Float32Array(N * 4);
        renderer.readRenderTargetPixels(
          gpu.getCurrentRenderTarget(posVar),
          0,
          0,
          TEX_SIZE,
          TEX_SIZE,
          posSnap,
        );
        renderer.readRenderTargetPixels(
          gpu.getCurrentRenderTarget(velVar),
          0,
          0,
          TEX_SIZE,
          TEX_SIZE,
          velSnap,
        );
        device.queue.writeBuffer(
          wgpuSim.buffers.posA,
          0,
          posSnap.buffer,
          posSnap.byteOffset,
          bytes,
        );
        device.queue.writeBuffer(
          wgpuSim.buffers.velA,
          0,
          velSnap.buffer,
          velSnap.byteOffset,
          bytes,
        );
        const bindGroup = device.createBindGroup({
          layout: wgpuSim.bindLayout,
          entries: [
            { binding: 0, resource: { buffer: wgpuSim.buffers.posA } },
            { binding: 1, resource: { buffer: wgpuSim.buffers.velA } },
            { binding: 2, resource: { buffer: wgpuSim.buffers.velB } },
            { binding: 3, resource: { buffer: wgpuSim.buffers.params } },
          ],
        });
        const enc = device.createCommandEncoder();
        const pass = enc.beginComputePass();
        pass.setPipeline(wgpuSim.pipelines.vel);
        pass.setBindGroup(0, bindGroup);
        pass.dispatchWorkgroups(Math.ceil(N / 256));
        pass.end();
        enc.copyBufferToBuffer(
          wgpuSim.buffers.velB,
          0,
          wgpuSim.buffers.staging[0],
          0,
          bytes,
        );
        device.queue.submit([enc.finish()]);
        await wgpuSim.buffers.staging[0].mapAsync(GPUMapMode.READ);
        const out = new Float32Array(
          wgpuSim.buffers.staging[0].getMappedRange(),
        ).slice();
        wgpuSim.buffers.staging[0].unmap();
        for (let i = 0; i < N; i++) {
          if (posSnap[i * 4 + 3] > 0) {
            const v = [out[i * 4], out[i * 4 + 1], out[i * 4 + 2]];
            console.info(
              `[wgpu] dispatch test OK: body ${i} velNew=${v.map((x) => x.toExponential(2))}`,
            );
            return { N, body: i, v };
          }
        }
        console.warn("[wgpu] dispatch test: no alive bodies in input");
        return null;
      }
      if (typeof window !== "undefined") {
        window.__wgpuTestVelStep = _wgpuGuard("vel-step test", wgpuTestVelStep);
      }

      // ----- step 4c: numeric comparison vs WebGL2 -----------------
      // Compare WebGPU velocity output against WebGL2's for one substep
      // on the same input state. Non-destructive: snapshots the live
      // state, runs both paths, restores the snapshot.
      // Returns { N, live, maxAbs, maxRel, rms, pass }.
      async function wgpuStepVerify() {
        if (!wgpuSim.available || !wgpuSim.pipelines || !wgpuSim.buffers) {
          console.warn("[wgpu] verify: not ready");
          return null;
        }
        const N = MAX_BODIES;
        const len = N * 4;
        const bytes = N * 16;

        // 1. Snapshot WebGL state.
        const posSnap = new Float32Array(len);
        const velSnap = new Float32Array(len);
        renderer.readRenderTargetPixels(
          gpu.getCurrentRenderTarget(posVar),
          0,
          0,
          TEX_SIZE,
          TEX_SIZE,
          posSnap,
        );
        renderer.readRenderTargetPixels(
          gpu.getCurrentRenderTarget(velVar),
          0,
          0,
          TEX_SIZE,
          TEX_SIZE,
          velSnap,
        );

        // 2. WebGL2: run one compute SYNCHRONOUSLY (before any await),
        // read back the resulting velocity, restore the snapshot. Doing
        // all of this before we yield to the event loop is critical —
        // otherwise the render loop's rAF would interleave during our
        // await and add extra substeps, making wglVel much further past
        // the snapshot than wgpuVel.
        gpu.compute();
        const wglVel = new Float32Array(len);
        renderer.readRenderTargetPixels(
          gpu.getCurrentRenderTarget(velVar),
          0,
          0,
          TEX_SIZE,
          TEX_SIZE,
          wglVel,
        );
        // Restore the snapshot to the now-current ping-pong target so
        // the live sim is undisturbed. Both pos and vel advanced.
        const posTex = new THREE.DataTexture(
          posSnap,
          TEX_SIZE,
          TEX_SIZE,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        posTex.needsUpdate = true;
        const velTex = new THREE.DataTexture(
          velSnap,
          TEX_SIZE,
          TEX_SIZE,
          THREE.RGBAFormat,
          THREE.FloatType,
        );
        velTex.needsUpdate = true;
        blit(posTex, gpu.getCurrentRenderTarget(posVar));
        blit(velTex, gpu.getCurrentRenderTarget(velVar));
        posTex.dispose();
        velTex.dispose();

        // 3. WebGPU: upload snapshot, write params, dispatch velStep,
        // await readback. Safe to await now — WebGL is back at snapshot
        // and the render loop won't disturb our comparison.
        const device = wgpuSim.device;
        device.queue.writeBuffer(
          wgpuSim.buffers.posA,
          0,
          posSnap.buffer,
          posSnap.byteOffset,
          bytes,
        );
        device.queue.writeBuffer(
          wgpuSim.buffers.velA,
          0,
          velSnap.buffer,
          velSnap.byteOffset,
          bytes,
        );
        writeWgpuParams();

          // huge deltas can't teleport the camera.
          const k =
            Math.max(-3, Math.min(3, wheelDeltaPx(e) / 100)) *
            smoothZoom.perNotch;
          if (followCamActive()) {
            followCam.distScaleTarget = Math.max(
              0.25,
              Math.min(4, followCam.distScaleTarget * Math.exp(k)),
            );
            return;
          }
          if (transitionRaf) return;
          if (!isFinite(smoothZoom.logTarget)) {
            smoothZoom.logTarget = Math.log(
              Math.max(camera.position.distanceTo(controls.target), 1e-3),
            );
          }
          smoothZoom.logTarget = Math.max(
            Math.log(controls.minDistance),
            Math.min(Math.log(controls.maxDistance), smoothZoom.logTarget + k),
          );
        },
        { capture: true, passive: false },
      );
      function tickSmoothZoom(dt) {
        if (!isFinite(smoothZoom.logTarget)) return;
        if (transitionRaf || movie.active || followCamActive()) {
          smoothZoom.logTarget = NaN;
          return;
        }
        const cur = Math.max(camera.position.distanceTo(controls.target), 1e-3);
        const curLog = Math.log(cur);
        const a = 1 - Math.exp(-Math.min(dt, 0.05) / smoothZoom.tau);
        let nextLog = curLog + (smoothZoom.logTarget - curLog) * a;
        if (Math.abs(smoothZoom.logTarget - nextLog) < 5e-4) {
          nextLog = smoothZoom.logTarget;
          smoothZoom.logTarget = NaN; // settled; next wheel re-seeds
        }
        const ratio = Math.exp(nextLog - curLog);
        camera.position
          .sub(controls.target)
          .multiplyScalar(ratio)
          .add(controls.target);
      }

      // ===============================================================
      // 2b. STARGAZER INTRO (cold open — see STARGAZER_INTRO_PLAN.md)
      // ===============================================================
      // A short cinematic pre-roll: cute character + telescope on a
      // hill, the camera glides over and into the eyepiece, which is
      // textured with the live sim composer. After ~12s, the canvas
      // hands off to the regular sim render path.
      //
      // State lives on `intro`. When `intro.active === true` the main
      // loop renders `intro.scene` instead of `composer.render()` and
      // skips the sim physics step.
      const INTRO_BEATS = {
        ESTABLISH: 10.0,
        APPROACH: 4.0,
        LEAN_IN: 3.0,
        REACT: 3.0,
        THROUGH: 3.0,
      };
      const INTRO_TOTAL =
        INTRO_BEATS.ESTABLISH +
        INTRO_BEATS.APPROACH +
        INTRO_BEATS.LEAN_IN +
        INTRO_BEATS.REACT +
        INTRO_BEATS.THROUGH;
      const intro = {
        active: false, // gated in boot()
        beat: "IDLE", // ESTABLISH | APPROACH | LEAN_IN | REACT | THROUGH | DONE
        t: 0, // seconds within the current beat
        T: 0, // seconds since intro start
        scene: null, // THREE.Scene built in step 2
        camera: null, // shares main `camera` — set on enter
        // Cache of beat durations so the cinematic move can read them.
        beatDur: { ...INTRO_BEATS },
        // Set by skip / click handlers; consumed in tickIntro().
        clickAdvance: false,
        skipToEnd: false,
        // Saved camera state so we can restore on intro end.
        savedCam: null,
        savedFov: null,
        savedControlsEnabled: null,
      };

      function introShouldPlay() {
        if (TOKEN.active) return false;
        try {
          const url = new URL(location.href);
          const p = url.searchParams.get("intro");
          if (p === "0") return false;
          if (p === "1") return true;
          // Honor user's reduced-motion preference: a 12-second cinematic
          // dolly is exactly the kind of thing the setting is meant to
          // opt out of. Treat it as "intro already seen."
          if (
            window.matchMedia &&
            window.matchMedia("(prefers-reduced-motion: reduce)").matches
          ) {
            try {
              localStorage.setItem("phos.introSeen", "1");
            } catch (e) {}
            return false;
          }
          // Default: only on first visit. localStorage flag persists
          // across sessions; set on intro completion or skip.
          const seen = localStorage.getItem("phos.introSeen");
          return seen !== "1";
        } catch (e) {
          return false;
        }
      }

      function introMarkSeen() {
        try {
          localStorage.setItem("phos.introSeen", "1");
        } catch (e) {}
      }

      // Build the intro scene: hillside + character + telescope under a
      // moonlit starfield. Cute-chibi character is ~7 primitives; the
      // telescope is 4. Cheap to build, cheap to render.
      function buildIntroScene() {
        const s = new THREE.Scene();
        s.background = new THREE.Color(0x080b14);
        s.fog = new THREE.FogExp2(0x080b14, 0.011);

        // ---- Lighting -------------------------------------------------
        // Soft cool moonlight from above-left — bright enough to read
        // the silhouettes against the sky and pick out the hillside
        // contours.
        const moon = new THREE.DirectionalLight(0xb8c8e8, 1.0);
        moon.position.set(-8, 12, 6);
        s.add(moon);
        // A second, opposite-side fill so the character has rim light
        // when the camera comes around for the side-profile bow shot.
        const fill = new THREE.DirectionalLight(0x6a78a0, 0.45);
        fill.position.set(8, 6, -4);
        s.add(fill);
        // Warm lantern at the telescope base — gives a focal point.
        const lantern = new THREE.PointLight(0xffd089, 2.2, 16, 1.6);
        lantern.position.set(0.5, 0.45, -0.35);
        s.add(lantern);
        // A small warm light at the eyepiece — only turned up during
        // LEAN_IN/THROUGH so it reads as "the cosmos through the lens
        // is lighting the character's face."
        const eyepieceGlow = new THREE.PointLight(0xfff0c8, 0.0, 4, 1.4);
        eyepieceGlow.position.set(-0.66, 1.015, 0);
        s.add(eyepieceGlow);
        intro.eyepieceGlowLight = eyepieceGlow;
        // Ambient lift — warmer and brighter than before so silhouettes
        // read clearly without losing the night mood.
        s.add(new THREE.AmbientLight(0x2a3048, 0.7));
        intro.lantern = lantern;

        // ---- Starfield (dedicated to introScene) ----------------------
        // Smaller than the sim starfield — we don't need the same
        // density at this camera distance. Same twinkle math, scaled
        // for a much smaller world.
        {
          const N = 3200;
          const pos = new Float32Array(N * 3);
          const phase = new Float32Array(N);
          const sz = new Float32Array(N);
          for (let i = 0; i < N; i++) {
            // Hemisphere above the horizon — denser overhead, sparser
            // toward the horizon haze line.
            const u = Math.random();
            const v = Math.random();
            const theta = Math.acos(0.05 + 0.95 * v); // 0 = up, ~π/2 = horizon
            const phi = u * 2 * Math.PI;
            const r = 220 + Math.random() * 120;
            const sy = Math.cos(theta);
            const sxz = Math.sin(theta);
            pos[i * 3 + 0] = r * sxz * Math.cos(phi);
            pos[i * 3 + 1] = r * sy + 6; // lift a touch off the horizon
            pos[i * 3 + 2] = r * sxz * Math.sin(phi);
            phase[i] = Math.random() * 6.2831853;
            sz[i] =
              Math.random() < 0.03
                ? 2.4 + Math.random() * 1.4
                : 0.8 + Math.random() * 1.3;
          }
          const geo = new THREE.BufferGeometry();
          geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
          geo.setAttribute("aPhase", new THREE.BufferAttribute(phase, 1));
          geo.setAttribute("aSize", new THREE.BufferAttribute(sz, 1));
          const mat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uIntensity: { value: 0.85 } },
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexShader: `
              uniform float uTime;
              attribute float aPhase;
              attribute float aSize;
              varying float vT;
              void main() {
                vec4 mv = modelViewMatrix * vec4(position, 1.0);
                gl_Position = projectionMatrix * mv;
                float tw = 0.55 + 0.45 * sin(uTime * 0.9 + aPhase)
                                + 0.35 * sin(uTime * 0.31 + aPhase * 2.17);
                vT = clamp(tw * 0.5 + 0.3, 0.15, 1.0);
                gl_PointSize = aSize;
              }
            `,
            fragmentShader: `
              uniform float uIntensity;
              varying float vT;
              void main() {
                vec2 c = gl_PointCoord - 0.5;
                float d = length(c);
                if (d > 0.5) discard;
                float a = smoothstep(0.5, 0.0, d) * vT * uIntensity;
                gl_FragColor = vec4(vec3(0.78, 0.88, 1.02) * a, a);
              }
            `,
          });
          const stars = new THREE.Points(geo, mat);
          stars.frustumCulled = false;
          s.add(stars);
          intro.starsMat = mat;
        }

        // ---- Hillside ------------------------------------------------
        // A subdivided plane displaced by a low-freq smoothed noise so
        // the silhouette against the sky has gentle bumps. Tilted very
        // slightly forward so the foreground sits a touch lower than
        // the horizon.
        {
          const W = 80,
            H = 60,
            SX = 96,
            SY = 72;
          const geo = new THREE.PlaneGeometry(W, H, SX, SY);
          // Deterministic tiny "noise" so the bumps stay put each load.
          const seed = 17.31;
          const pos = geo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const y = pos.getY(i); // pre-rotation Y is the depth axis
            // Two octaves of cheap sin-noise.
            const n =
              0.55 *
                Math.sin(x * 0.18 + seed) *
                Math.cos(y * 0.21 + seed * 0.7) +
              0.22 *
                Math.sin(x * 0.42 + seed * 1.7) *
                Math.cos(y * 0.37 + seed * 0.3);
            // Lift the back edge so the hill rolls up to a horizon.
            const back = Math.max(0, (y + H * 0.5) / H);
            pos.setZ(i, n + back * 1.4);
          }
          pos.needsUpdate = true;
          geo.computeVertexNormals();
          const mat = new THREE.MeshStandardMaterial({
            color: 0x2a3344,
            roughness: 1,
            metalness: 0,
            flatShading: false,
          });
          const ground = new THREE.Mesh(geo, mat);
          ground.rotation.x = -Math.PI / 2;
          ground.position.y = 0;
          s.add(ground);
        }

        // ---- Telescope -----------------------------------------------
        // Tripod (3 thin cylinders) + barrel (one cylinder) tilted at
        // the sky + tiny eyepiece sphere on the back end.
        {
          const tele = new THREE.Group();
          const dark = new THREE.MeshStandardMaterial({
            color: 0x2a2018,
            roughness: 0.85,
            metalness: 0.1,
          });
          const brass = new THREE.MeshStandardMaterial({
            color: 0x9b7242,
            roughness: 0.55,
            metalness: 0.55,
            emissive: 0x2a1808,
            emissiveIntensity: 0.25,
          });
          // Tripod legs — three around y-axis.
          for (let i = 0; i < 3; i++) {
            const ang = (i / 3) * Math.PI * 2;
            const leg = new THREE.Mesh(
              new THREE.CylinderGeometry(0.025, 0.025, 1.3, 6),
              dark,
            );
            leg.position.set(Math.cos(ang) * 0.28, 0.65, Math.sin(ang) * 0.28);
            leg.rotation.z = -Math.cos(ang) * 0.22;
            leg.rotation.x = Math.sin(ang) * 0.22;
            tele.add(leg);
          }
          // Barrel — pointing up and slightly toward the sky.
          // Barrel tilts at ~51° above horizontal toward +X. The +Y end
          // (objective) points up at the sky; the -Y end (eyepiece) sits
          // at character head height on the -X side, where the character
          // can walk up to it.
          const BARREL_TILT = -Math.PI / 3.5;
          const barrel = new THREE.Mesh(
            new THREE.CylinderGeometry(0.085, 0.07, 1.55, 16),
            brass,
          );
          barrel.position.set(0, 1.55, 0);
          barrel.rotation.z = BARREL_TILT;
          tele.add(barrel);
          // Eyepiece — small sphere at the back end of the barrel.
          // Local -Y direction after BARREL_TILT rotation around Z,
          // scaled to just outside the cylinder length (half-len 0.775,
          // so 0.85 puts the sphere a hair beyond the end).
          const eyepiece = new THREE.Mesh(
            new THREE.SphereGeometry(0.13, 24, 16),
            new THREE.MeshBasicMaterial({ color: 0x0a0610 }),
          );
          const eyepieceDir = new THREE.Vector3(0, -1, 0).applyEuler(
            new THREE.Euler(0, 0, BARREL_TILT),
          );
          eyepiece.position.set(
            0 + eyepieceDir.x * 0.85,
            1.55 + eyepieceDir.y * 0.85,
            0 + eyepieceDir.z * 0.85,
          );
          tele.add(eyepiece);
          // Pulsing glow ring around the eyepiece — reads as "click here"
          // during ESTABLISH. Fades out once the camera starts moving.
          const glowGeo = new THREE.RingGeometry(0.16, 0.26, 24);
          const glowMat = new THREE.MeshBasicMaterial({
            color: 0xffd089,
            transparent: true,
            opacity: 0.0,
            side: THREE.DoubleSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
          });
          const glow = new THREE.Mesh(glowGeo, glowMat);
          glow.position.copy(eyepiece.position);
          // Face the glow toward the camera's likely ESTABLISH location.
          glow.lookAt(8, 4, 8);
          tele.add(glow);

          tele.position.set(0, 0, 0);
          s.add(tele);
          intro.telescope = tele;
          intro.eyepiece = eyepiece;
          intro.eyepieceGlow = glow;
          intro.eyepieceGlowMat = glowMat;
        }

        // ---- "giverny" garden sign -----------------------------------
        // A small wooden marker plank with painted text. Single post
        // sits BEHIND the plank (negative local Z) so it doesn't
        // obstruct the text from the camera POV — earlier centered
        // post hid the 'e' in "giverny."
        {
          const sign = new THREE.Group();
          const wood = new THREE.MeshStandardMaterial({
            color: 0x7a5230,
            roughness: 0.95,
            metalness: 0,
          });
          const woodDark = new THREE.MeshStandardMaterial({
            color: 0x4a2e18,
            roughness: 1,
            metalness: 0,
          });
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(0.04, 0.04, 0.95, 6),
            woodDark,
          );
          // Behind the plank: local z negative pushes the post past
          // the plank's back face (plank depth is 0.05, half = 0.025).
          post.position.set(0, 0.42, -0.07);
          sign.add(post);
          // Slightly larger plank with a touch more thickness so the
          // plank itself reads from a distance.
          const plank = new THREE.Mesh(
            new THREE.BoxGeometry(0.78, 0.26, 0.05),
            wood,
          );
          plank.position.y = 0.78;
          sign.add(plank);
          // Painted text via a CanvasTexture — bumped resolution +
          // tighter font for legibility at the establishing distance.
          const canvas = document.createElement("canvas");
          canvas.width = 768;
          canvas.height = 256;
          const c2d = canvas.getContext("2d");
          c2d.clearRect(0, 0, 768, 256);
          // Soft warm dropshadow to lift the letters off the wood.
          c2d.shadowColor = "rgba(0, 0, 0, 0.55)";
          c2d.shadowBlur = 6;
          c2d.shadowOffsetY = 3;
          c2d.font = "italic 700 168px Georgia, 'Times New Roman', serif";
          c2d.textAlign = "center";
          c2d.textBaseline = "middle";
          c2d.fillStyle = "#fce7c0";
          c2d.fillText("giverny", 384, 140);
          const tex = new THREE.CanvasTexture(canvas);
          tex.anisotropy = renderer.capabilities.getMaxAnisotropy
            ? renderer.capabilities.getMaxAnisotropy()
            : 1;
          tex.minFilter = THREE.LinearMipmapLinearFilter;
          tex.magFilter = THREE.LinearFilter;
