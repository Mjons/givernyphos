<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Universe Sim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg-0: #05060a;
        --bg-panel: rgba(10, 10, 14, 0.62);
        --bg-overlay: rgba(3, 4, 8, 0.78);
        --border-1: rgba(255, 255, 255, 0.08);
        --border-2: rgba(255, 255, 255, 0.14);
        --text-0: #e8ebf2;
        --text-1: #9ea4b2;
        --text-2: #5a6070;
        --text-3: #363a44;
        --accent: #8ab4ff;
        --accent-dim: rgba(138, 180, 255, 0.55);
        --accent-glow: rgba(138, 180, 255, 0.22);
        --danger: #ff6a70;
        --font-sans: "Inter", -apple-system, "Segoe UI", sans-serif;
        --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
        --r-1: 6px;
        --r-2: 10px;
        --r-3: 14px;
        --shadow-1: 0 10px 32px rgba(0, 0, 0, 0.5);
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg-0);
        color: var(--text-0);
        font-family: var(--font-sans);
        font-size: 13px;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        -webkit-user-select: none;
        user-select: none;
      }
      canvas#canvas {
        display: block;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      .hud-scene {
        position: absolute;
        top: 16px;
        left: 68px;
        font-variant: small-caps;
        letter-spacing: 0.14em;
        text-shadow: 0 1px 4px #000;
        transition: opacity 220ms var(--ease);
      }
      .hud-scene .name {
        color: var(--text-0);
        font-weight: 500;
        font-size: 13px;
      }
      .hud-scene .caption {
        color: var(--text-2);
        font-size: 9px;
        letter-spacing: 0.22em;
        margin-top: 2px;
      }
      .hud-scene .count {
        color: var(--text-2);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.08em;
        font-variant: normal;
        margin-top: 6px;
      }
      .hud-scene .stats {
        margin-top: 6px;
        color: var(--text-2);
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.04em;
        font-variant: normal;
        line-height: 1.6;
      }
      .hud-scene .stats span {
        color: var(--text-1);
      }

      .hud-state {
        position: absolute;
        top: 16px;
        right: 18px;
        display: flex;
        gap: 10px;
        align-items: center;
        font-variant: small-caps;
        letter-spacing: 0.12em;
        font-size: 11px;
        color: var(--text-1);
        text-shadow: 0 1px 4px #000;
        transition: opacity 220ms var(--ease);
      }
      .hud-state .icon {
        font-size: 13px;
        color: var(--accent);
        width: 12px;
        text-align: center;
      }
      .hud-state .dt {
        font-family: var(--font-mono);
        color: var(--text-2);
        font-variant: normal;
      }

      .hud-hint {
        position: absolute;
        bottom: 14px;
        left: 68px;
        font-size: 10px;
        color: var(--text-3);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-shadow: 0 1px 4px #000;
        pointer-events: none;
        opacity: 0.7;
      }
      .hud-fps {
        position: absolute;
        bottom: 12px;
        right: 18px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-3);
        letter-spacing: 0.1em;
        text-shadow: 0 1px 4px #000;
      }
      .rec-dot {
        position: absolute;
        bottom: 14px;
        right: 42px;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ff3b48;
        box-shadow: 0 0 10px #ff3b48;
        animation: blink 1s ease-in-out infinite;
        display: none;
      }
      .rec-dot.active {
        display: block;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      #rail {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 0;
        gap: 2px;
        z-index: 20;
        background: linear-gradient(
          to right,
          rgba(5, 6, 10, 0.72),
          rgba(5, 6, 10, 0)
        );
        transition:
          opacity 220ms var(--ease),
          transform 220ms var(--ease);
      }
      .rail-spacer {
        flex: 1;
      }
      .rail-btn {
        width: 36px;
        height: 36px;
        border: none;
        background: transparent;
        color: var(--text-2);
        border-radius: var(--r-1);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        transition:
          color 150ms var(--ease),
          background 150ms var(--ease);
      }
      .rail-btn:hover {
        color: var(--text-0);
        background: rgba(255, 255, 255, 0.04);
      }
      .rail-btn.active {
        color: var(--accent);
        background: var(--accent-glow);
      }
      .rail-btn.active::before {
        content: "";
        position: absolute;
        left: -6px;
        top: 10px;
        bottom: 10px;
        width: 2px;
        border-radius: 2px;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent-glow);
      }
      .rail-btn svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .rail-tooltip {
        position: absolute;
        left: 46px;
        top: 50%;
        transform: translate(-4px, -50%);
        background: rgba(12, 14, 20, 0.94);
        color: var(--text-0);
        font-size: 11px;
        padding: 5px 9px;
        border-radius: var(--r-1);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        border: 1px solid var(--border-1);
        transition:
          opacity 120ms var(--ease),
          transform 120ms var(--ease);
      }
      .rail-btn:hover .rail-tooltip {
        opacity: 1;
        transform: translate(0, -50%);
      }
      .rail-tooltip kbd {
        margin-left: 6px;
        color: var(--text-2);
        font-family: var(--font-mono);
        font-size: 10px;
      }

      #panel {
        position: fixed;
        top: 14px;
        left: 56px;
        bottom: 14px;
        width: 304px;
        background: var(--bg-panel);
        border: 1px solid var(--border-1);
        border-radius: var(--r-3);
        backdrop-filter: blur(20px) saturate(1.2);
        -webkit-backdrop-filter: blur(20px) saturate(1.2);
        box-shadow: var(--shadow-1);
        padding: 20px 18px 18px;
        z-index: 15;
        transform: translateX(-18px);
        opacity: 0;
        pointer-events: none;
        transition:
          transform 180ms var(--ease),
          opacity 180ms var(--ease);
        overflow-y: auto;
        overflow-x: hidden;
      }
      #panel.open {
        transform: translateX(0);
        opacity: 1;
        pointer-events: auto;
      }
      #panel::-webkit-scrollbar {
        width: 6px;
      }
      #panel::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.06);
        border-radius: 3px;
      }
      .panel-title {
        font-size: 10px;
        color: var(--text-2);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }
      .panel-title .hint {
        float: right;
        color: var(--text-3);
        letter-spacing: 0.12em;
        font-family: var(--font-mono);
        text-transform: none;
      }
      .panel-section {
        margin-bottom: 18px;
      }
      .panel-section-title {
        font-size: 9px;
        color: var(--text-2);
        letter-spacing: 0.26em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }

      .slider-row {
        margin-bottom: 10px;
      }
      .slider-row .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 4px;
      }
      .slider-row label {
        font-size: 11px;
        color: var(--text-1);
        font-weight: 500;
      }
      .slider-row .value {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--accent);
        font-weight: 500;
      }
      .slider-row input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 2px;
        background: var(--border-2);
        border-radius: 2px;
        outline: none;
        cursor: pointer;
      }
      .slider-row input[type="range"]::-webkit-slider-runnable-track {
        height: 2px;
        background: linear-gradient(
          to right,
          var(--accent) var(--pct, 50%),
          var(--border-2) var(--pct, 50%)
        );
        border-radius: 2px;
      }
      .slider-row input[type="range"]::-moz-range-track {
        height: 2px;
        background: linear-gradient(
          to right,
          var(--accent) var(--pct, 50%),
          var(--border-2) var(--pct, 50%)
        );
        border-radius: 2px;
      }
      .slider-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        background: var(--accent);
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 6px var(--accent-glow);
        margin-top: -5px;
      }
      .slider-row input[type="range"]::-moz-range-thumb {
        width: 12px;
        height: 12px;
        background: var(--accent);
        border: none;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 0 6px var(--accent-glow);
      }

      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        cursor: pointer;
      }
      .toggle-row label {
        font-size: 11px;
        color: var(--text-1);
        font-weight: 500;
        cursor: pointer;
        flex: 1;
      }
      .toggle-switch {
        position: relative;
        width: 28px;
        height: 16px;
        background: var(--border-2);
        border-radius: 8px;
        transition: background 140ms var(--ease);
        flex-shrink: 0;
      }
      .toggle-switch::after {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 12px;
        height: 12px;
        background: var(--text-2);
        border-radius: 50%;
        transition:
          transform 140ms var(--ease),
          background 140ms var(--ease);
      }
      .toggle-row input {
        display: none;
      }
      .toggle-row input:checked + .toggle-switch {
        background: var(--accent-glow);
      }
      .toggle-row input:checked + .toggle-switch::after {
        transform: translateX(12px);
        background: var(--accent);
        box-shadow: 0 0 6px var(--accent-glow);
      }

      /* Help badge — a tiny "?" next to a control's label.  Hovering it
         pops a glass tooltip explaining what the control does. The
         tooltip itself lives in document.body as a portal so it can
         escape the panel's overflow clipping and slide animation. */
      .help-badge {
        display: inline-flex;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        margin-left: 6px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-2);
        font-size: 9px;
        font-weight: 600;
        font-family: var(--font-mono);
        align-items: center;
        justify-content: center;
        cursor: help;
        user-select: none;
        vertical-align: middle;
        transition:
          background 140ms var(--ease),
          color 140ms var(--ease);
      }
      .help-badge:hover {
        background: var(--accent-glow);
        color: var(--accent);
      }
      #help-tip {
        position: fixed;
        top: 0;
        left: 0;
        min-width: 180px;
        max-width: 260px;
        padding: 8px 10px;
        background: var(--bg-overlay);
        border: 1px solid var(--border-2);
        border-radius: var(--r-1);
        color: var(--text-0);
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 400;
        line-height: 1.45;
        letter-spacing: 0;
        text-transform: none;
        opacity: 0;
        pointer-events: none;
        white-space: normal;
        text-align: left;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        transform: translateY(4px);
        transition:
          opacity 160ms var(--ease),
          transform 160ms var(--ease);
        z-index: 1000;
      }
      #help-tip.show {
        opacity: 1;
        transform: translateY(0);
      }

      .select-row {
        margin-bottom: 10px;
      }
      .select-row label {
        display: block;
        font-size: 11px;
        color: var(--text-1);
        font-weight: 500;
        margin-bottom: 5px;
      }
      .select-row select {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-1);
        color: var(--text-0);
        padding: 6px 8px;
        border-radius: var(--r-1);
        font-family: var(--font-sans);
        font-size: 11px;
        outline: none;
        cursor: pointer;
      }
      .select-row select:focus {
        border-color: var(--accent-dim);
      }
      .select-row select option {
        background: #0c0e15;
        color: var(--text-0);
      }

      .button-row {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .btn {
        flex: 1;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-1);
        color: var(--text-0);
        padding: 7px 10px;
        border-radius: var(--r-1);
        font-family: var(--font-sans);
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        transition: all 120ms var(--ease);
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--border-2);
      }
      .btn.primary {
        background: var(--accent-glow);
        border-color: var(--accent-dim);
        color: var(--accent);
      }
      .btn.primary:hover {
        background: rgba(138, 180, 255, 0.3);
      }
      .btn.active {
        background: var(--accent-glow);
        border-color: var(--accent-dim);
        color: var(--accent);
      }

      .pill-row {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .pill {
        padding: 5px 10px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-1);
        border-radius: 999px;
        font-size: 10px;
        color: var(--text-1);
        cursor: pointer;
        letter-spacing: 0.05em;
        transition: all 120ms var(--ease);
      }
      .pill:hover {
        color: var(--text-0);
        border-color: var(--border-2);
      }
      .pill.active {
        background: var(--accent-glow);
        border-color: var(--accent-dim);
        color: var(--accent);
      }

      .read-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        padding: 4px 0;
      }
      .read-row label {
        color: var(--text-2);
      }
      .read-row .val {
        font-family: var(--font-mono);
        color: var(--text-1);
      }

      .viewport-slots {
        display: grid;
        grid-template-columns: repeat(9, 1fr);
        gap: 4px;
        margin-bottom: 8px;
      }
      .vp-slot {
        aspect-ratio: 1;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-1);
        border-radius: var(--r-1);
        color: var(--text-2);
        font-family: var(--font-mono);
        font-size: 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 120ms var(--ease);
      }
      .vp-slot:hover {
        color: var(--text-0);
        border-color: var(--border-2);
      }
      .vp-slot.saved {
        color: var(--accent);
        border-color: var(--accent-dim);
        background: var(--accent-glow);
      }
      .vp-hint {
        font-size: 10px;
        color: var(--text-3);
        letter-spacing: 0.08em;
        margin-bottom: 10px;
      }

      .overlay {
        position: fixed;
        inset: 0;
        background: var(--bg-overlay);
        backdrop-filter: blur(14px) saturate(1.1);
        -webkit-backdrop-filter: blur(14px) saturate(1.1);
        z-index: 50;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 220ms var(--ease);
        overflow-y: auto;
      }
      .overlay:not(.hidden) {
        opacity: 1;
        pointer-events: auto;
      }
      .overlay-close {
        position: absolute;
        top: 20px;
        right: 24px;
        background: transparent;
        border: none;
        color: var(--text-2);
        font-size: 22px;
        cursor: pointer;
        line-height: 1;
        padding: 6px 10px;
        border-radius: var(--r-1);
        transition: all 120ms var(--ease);
      }
      .overlay-close:hover {
        color: var(--text-0);
        background: rgba(255, 255, 255, 0.04);
      }

      .scene-browser-inner {
        max-width: 1100px;
        width: 100%;
        padding: 72px 40px 60px;
      }
      .scene-browser-header {
        text-align: center;
        margin-bottom: 36px;
      }
      .scene-browser-title {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.24em;
        color: var(--text-0);
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .scene-browser-sub {
        font-size: 10px;
        color: var(--text-2);
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      .scene-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
        gap: 14px;
      }
      .scene-card {
        background: rgba(12, 14, 20, 0.5);
        border: 1px solid var(--border-1);
        border-radius: var(--r-2);
        overflow: hidden;
        cursor: pointer;
        transition: all 200ms var(--ease);
        position: relative;
        aspect-ratio: 1;
      }
      .scene-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent-dim);
        box-shadow: 0 14px 36px var(--accent-glow);
      }
      .scene-card.active {
        border-color: var(--accent);
      }
      .scene-card .thumb {
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at center, #1a1d2a 0%, #06070c 70%);
        display: block;
      }
      .scene-card img.thumb {
        object-fit: cover;
        object-position: center;
      }
      .scene-card .meta {
        position: absolute;
        inset: auto 0 0 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.92) 0%,
          rgba(0, 0, 0, 0) 100%
        );
        padding: 28px 14px 12px;
      }
      .scene-card .name {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.1em;
        color: var(--text-0);
        margin-bottom: 2px;
      }
      .scene-card .caption {
        font-size: 10px;
        color: var(--text-2);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .scene-card.active .name {
        color: var(--accent);
      }

      .hotkeys-inner {
        max-width: 820px;
        width: 100%;
        padding: 80px 40px 60px;
      }
      .hotkeys-title {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.28em;
        color: var(--text-0);
        text-transform: uppercase;
        margin-bottom: 36px;
        text-align: center;
      }
      .hotkey-cols {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 36px;
      }
      .hotkey-group {
        margin-bottom: 24px;
      }
      .hotkey-group h3 {
        font-size: 9px;
        color: var(--accent);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin: 0 0 12px;
        font-weight: 500;
      }
      .hotkey-row {
        display: flex;
        align-items: baseline;
        padding: 7px 0;
        border-bottom: 1px solid var(--border-1);
        font-size: 12px;
        color: var(--text-1);
      }
      .hotkey-row .keys {
        flex: 0 0 126px;
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .hotkey-row kbd {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-1);
        padding: 2px 7px;
        border-radius: 4px;
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-0);
        letter-spacing: 0;
      }
      .hotkey-row .sep {
        color: var(--text-3);
        font-size: 10px;
      }

      body.performance #rail,
      body.performance #panel,
      body.performance .hud-scene,
      body.performance .hud-state,
      body.performance .hud-hint {
        opacity: 0;
        pointer-events: none;
      }
      body.performance #rail {
        transform: translateX(-6px);
      }
      body.performance.mouse-active #rail,
      body.performance.mouse-active .hud-scene,
      body.performance.mouse-active .hud-state,
      body.performance.mouse-active .hud-hint {

    <script type="importmap">
      {

    <script type="module" id="app-script">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { AfterimagePass } from "three/addons/postprocessing/AfterimagePass.js";
      import { GPUComputationRenderer } from "three/addons/misc/GPUComputationRenderer.js";

      // ===============================================================
      // 1. CONFIG & DOM HELPERS
      // ===============================================================
      // ---- Token mode (INTERACTIVE_NFT.md) — early parse -----------------
      // Read before the density tier is chosen. `token` is the platform
      // hash (any string; folded to 32 bits by the recipe), `preview=1`
      // asks for the deterministic still. Platform SDKs win over the query
      // string: fx(hash) exposes window.$fx, Highlight exposes window.hl.
      // Section 13c holds the recipe and the boot path.
      // Self-hosted contract path (INTERACTIVE_NFT.md decision 2026-09-05):
      // the token id, not a platform hash, is the identity. ?id=N (1..
      // TOKEN_EDITION) derives everything from TOKEN_ID_SALT:id, and the
      // family comes from a planned table (TOKEN_PLAN, §13c) so the
      // collection's family counts are exact rather than a dice roll.
      const TOKEN_ID_SALT = "giverny-phos/2026";
      const TOKEN_EDITION = 100;
      const TOKEN = (() => {
        const t = {
          active: false,
          hash: null,
          id: null,
          preview: false,
          platform: "none",
          ready: false,
        };
        try {
          const q = new URL(location.href).searchParams;
          const fx = window.$fx;
          const hl = window.hl;
          if (fx && typeof fx.hash === "string") {
            t.hash = fx.hash;
            t.platform = "fxhash";
            t.preview = fx.context === "capture";
          } else if (hl && hl.tx && typeof hl.tx.hash === "string") {
            t.hash = hl.tx.hash;
            t.platform = "highlight";
          } else if (q.get("token")) {
            t.hash = q.get("token");
            t.platform = "url";
          } else if (q.get("id")) {
            const id = parseInt(q.get("id"), 10);
            if (id >= 1 && id <= TOKEN_EDITION) {
              t.id = id;
              t.hash = TOKEN_ID_SALT + ":" + id;
              t.platform = "id";
            }
          }
          if (q.get("preview") === "1") t.preview = true;
          t.active = !!t.hash;
        } catch (_) {}
        return t;
      })();
      // Density is a device concern in token mode (never a trait): phones
      // get lite, a discrete desktop GPU gets lush (the app's sweet spot),
      // everything else standard. The GPU sniff is a throwaway WebGL
      // context + WEBGL_debug_renderer_info; any failure → standard.
      // Discrete-GPU sniff: a throwaway WebGL context + the unmasked
      // renderer string. Any failure → false. Used by token mode (tier)
      // and by the compute-backend default (WebGPU + Barnes-Hut).
      let _discreteGpu = null;
      function sniffDiscreteGpu() {
        if (_discreteGpu !== null) return _discreteGpu;
        _discreteGpu = false;
        try {
          const cv = document.createElement("canvas");
          const gl = cv.getContext("webgl2") || cv.getContext("webgl");
          const ext = gl && gl.getExtension("WEBGL_debug_renderer_info");
          const name = ext
            ? String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL))
            : "";
          _discreteGpu = /NVIDIA|GeForce|RTX|Radeon|AMD|Arc\b/i.test(name);
        } catch (_) {}
        return _discreteGpu;
      }
      function tokenDeviceTier() {
        const ua = navigator.userAgent || "";
        const coarse =
          !!window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
        const mobile =
          /Mobi|Android|iPhone|iPad|iPod/i.test(ua) ||
          (coarse && (navigator.maxTouchPoints || 0) > 1);
        if (mobile) return "lite";
        return sniffDiscreteGpu() ? "lush" : "standard";
      }

      // Density level → TEX_SIZE. Mutable so the user can resize live.
      // See BODY_COUNT.md. MAX_BODIES is always TEX_SIZE².
      const DENSITY_LEVELS = {
        lite: { texSize: 64, label: "lite", shortCount: "4k" },
        standard: { texSize: 128, label: "standard", shortCount: "16k" },
        dense: { texSize: 181, label: "dense", shortCount: "33k" },
        lush: { texSize: 256, label: "lush", shortCount: "65k" },
        titanic: {
          texSize: 315,
          label: "titanic",
          shortCount: "99k",
          experimental: true,
        },
        colossal: {
          texSize: 512,
          label: "colossal",
          shortCount: "262k",
          experimental: true,
        },
        abyssal: {
          texSize: 720,
          label: "abyssal",
          shortCount: "518k",
          experimental: true,
        },
      };
      const DENSITY_ORDER = [
        "lite",
        "standard",
        "dense",
        "lush",
        "titanic",
        "colossal",
        "abyssal",
      ];
      function loadInitialDensity() {
        // Token mode (INTERACTIVE_NFT.md §5.5): ?objects= still overrides
        // for testing; otherwise the device decides, and previews always
        // render at `standard` so every capture machine takes one path.
        if (TOKEN.active) {
          try {
            const raw = (new URL(location.href).searchParams.get("objects") || "")
              .toLowerCase()
              .trim();
            if (raw && DENSITY_LEVELS[raw]) return raw;
            for (const key of DENSITY_ORDER) {
              if (DENSITY_LEVELS[key].shortCount === raw) return key;
            }
          } catch (_) {}
          return TOKEN.preview ? "standard" : tokenDeviceTier();
        }
        // URL param takes top priority — lets an embed / share link
        // land a visitor at a specific density without them touching UI.
        // Accepts either the key name (?objects=lush) or the short count
        // (?objects=65k).  Case-insensitive.
        try {
          const url = new URL(location.href);
          const raw = (url.searchParams.get("objects") || "")
            .toLowerCase()
            .trim();
          if (raw) {
            if (DENSITY_LEVELS[raw]) return raw;
            for (const key of DENSITY_ORDER) {
              if (DENSITY_LEVELS[key].shortCount === raw) return key;
            }
          }
        } catch (_) {}
        try {
          const stored = localStorage.getItem("universeSim.density");
          if (stored && DENSITY_LEVELS[stored]) return stored;
        } catch (_) {}
        return "standard";
      }
      let currentDensityKey = loadInitialDensity();
      let TEX_SIZE = DENSITY_LEVELS[currentDensityKey].texSize;
      let MAX_BODIES = TEX_SIZE * TEX_SIZE;
      const MAX_AGE = 300.0;
      const NUM_KINDS = 8; // star, planet, BH, dust, halo, galaxyA, galaxyB, astrophage

      // Astrophage (kind 7) shader constants — PETROVA_LINE.md §3. Single
      // source of truth for the GLSL kernels, the WGSL kernels and the
      // CPU pre-roll in scenePetrovaLine; interpolated into the shader
      // strings as `${ASTRO_STEER.toFixed(3)}` so both languages see a
      // float literal.
      //
      // ASTRO_LAUNCH — respawn speed as a multiple of the circular speed
      //   at the spawn radius (1.6× circular ≈ 1.13× escape): bodies leave
      //   the star, but only just, so star gravity bends the first third
      //   of the path. ±25% spread + a cone jitter is applied on top.
      // ASTRO_STEER — lateral-velocity damping (1/sim-second) folded into
      //   the thrust. Pure thrust toward the planet conserves a body's
      //   angular momentum about the planet, so anything launched with
      //   lateral velocity misses the arrival radius and orbits the planet
      //   forever (offline sweep: 0/120 arrivals at launch speed 8). With
      //   steering every body converges; the launch arc survives because
      //   its time constant (1/0.5 = 2 s) is ~40% of the transit.
      const ASTRO_LAUNCH = 1.6;
      const ASTRO_STEER = 0.5;

      // ===============================================================
      // 1b. WEBGPU CAPABILITY DETECTION  (PHASE1_WEBGPU.md, step 1)
      // ===============================================================
      // Probe for WebGPU availability so a follow-up step can install a
      // tiled-shared-memory gravity compute behind the experimental-tier
      // flag. Step 1 does only detection — the WebGL2 GPGPU path stays
      // load-bearing for every density tier, including experimental. The
      // probe is async and runs in the background; consumers read
      // `wgpuSim.available` and `wgpuSim.reason` once it resolves.
      //   ?nogpu URL flag forces the path off (debug aid for diffing the
      //   two backends once both are wired up).
      const wgpuSim = {
        available: false,
        device: null,
        queue: null,
        adapter: null,
        reason: "probing",
        // Filled in by step 2 (wgpuInitPipelines / wgpuAllocateBuffers).
        bindLayout: null,
        pipelines: null, // { vel, pos }
        buffers: null, // { posA, posB, velA, velB, params, staging: [a, b] }
        capacity: 0, // body count the buffers are sized for
        // GPU-side timing (timestamp-query feature). velMs/posMs are the
        // last sampled per-substep compute-pass times; readMs is the wall
        // time of the last readback (submit → mapAsync resolved). NaN
        // until first sample or when the feature is unavailable.
        hasTimestamps: false,
        tsQuery: null, // { set, resolve, read, busy, tick }
        timing: { velMs: NaN, posMs: NaN, readMs: NaN, buildMs: NaN },
        // Step 6 ping-pong: 0 means posA/velA hold current state and we
        // write into posB/velB; 1 swaps them. Flipped after each wgpuStep.
        which: 0,
        // Phase 7b: live-activation flag. When true, the render loop runs
        // wgpuStep + async readback instead of WebGL2 gpu.compute(), and
        // pointMat reads from posTex / velTex DataTextures.
        active: false,
        readbackBusy: false,
        // Bumped on every wgpuAllocateBuffers. A wgpuFrameStep snapshot
        // of this counter is checked inside its mapAsync .then so an
        // in-flight readback whose buffers were destroyed mid-flight by
        // a density rebuild discards itself instead of writing stale
        // data (or smaller data) into the freshly-resized DataTextures.
        epoch: 0,
      };
      // Module scope is sealed by <script type="module">; expose wgpuSim
      // on window so devtools can poke at it (e.g. wgpuSim.posTex.image.data).
      if (typeof window !== "undefined") window.__wgpuSim = wgpuSim;

      // ===============================================================
      // 1c. HAND TRACKING — phase 1 (HAND_TRACKING_PLAN.md)
      // ===============================================================
      // Opt-in via ?hands=1. Boots a hidden webcam + MediaPipe
      // HandLandmarker, smooths wrist position + pinch with one-euro
      // filters, console-logs ~once per second. Phase 1 does NOT feed
      // the simulation — that's phase 2. Failures (no camera, denied,
      // model load fail) are silent: handTracker.disabled flips on and
      // the rest of the app is unaffected.
      const MEDIAPIPE_VERSION = "0.10.21";
      const handTracker = {
        enabled: false,
        ready: false,
        disabled: false,
        reason: "off",
        video: null,
        landmarker: null,
        cursorEl: null,
        tipEls: null, // [thumb, index, middle] DOM dots
        tipsXY: null, // last screen-space positions for the 3 tips
        lastVideoTime: -1,
        // Smoothed image-space (mirrored, ±0.5; phase 1)
        worldX: 0,
        worldY: 0,
        pinch: 0,
        presence: 0,
        // World-space projection (phase 2; filled by updateHandWorld)
        worldPos: new THREE.Vector3(),
        worldVel: new THREE.Vector3(),
        worldPosInited: false,
        strength: 0, // 0..1, presence-gated brush amplitude
        pull: 0, // pinch-gated attractor amplitude
        radius: 150, // world-space Gaussian sigma; tuned per scale of scenes
        // Diagnostics
        frames: 0,
        hits: 0,
      };
      try {
        const _hUrl = new URL(location.href);
        const _hVal = (_hUrl.searchParams.get("hands") || "")
          .toLowerCase()
          .trim();
        handTracker.enabled =
          _hVal === "1" || _hVal === "true" || _hVal === "on";
      } catch (_) {}
      if (typeof window !== "undefined") window.__handTracker = handTracker;

      function makeOneEuro(mincutoff = 1.0, beta = 0.01, dcutoff = 1.0) {
        let xPrev = null,
          dxPrev = 0,
          tPrev = null;
        const alpha = (cutoff, dt) => {
          const r = 2 * Math.PI * cutoff * dt;
          return r / (r + 1);
        };
        return (x, t) => {
          if (tPrev === null) {
            tPrev = t;
            xPrev = x;
            return x;
          }
          const dt = Math.max(1e-3, (t - tPrev) / 1000);
          const dx = (x - xPrev) / dt;
          const aD = alpha(dcutoff, dt);
          const dxHat = aD * dx + (1 - aD) * dxPrev;
          const cutoff = mincutoff + beta * Math.abs(dxHat);
          const a = alpha(cutoff, dt);
          const xHat = a * x + (1 - a) * xPrev;
          tPrev = t;
          xPrev = xHat;
          dxPrev = dxHat;
          return xHat;
        };
      }
      const _oeHandX = makeOneEuro(1.0, 0.01);
      const _oeHandY = makeOneEuro(1.0, 0.01);
      const _oePinch = makeOneEuro(1.5, 0.02);

      async function initHandTracker() {
        if (!handTracker.enabled || handTracker.disabled) return;
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("getUserMedia unavailable");
          }
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480, facingMode: "user" },
            audio: false,
          });
          const video = document.createElement("video");
          video.style.cssText =
            "position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;";
          video.playsInline = true;
          video.muted = true;
          video.autoplay = true;
          video.srcObject = stream;
          document.body.appendChild(video);
          await new Promise((res, rej) => {
            video.addEventListener("loadeddata", res, { once: true });
            video.addEventListener("error", rej, { once: true });
          });
          await video.play();
          handTracker.video = video;

          const cursor = document.createElement("div");
          cursor.id = "hand-cursor";
          cursor.style.cssText =
            "position:fixed;left:0;top:0;width:64px;height:64px;border-radius:50%;" +
            "transform:translate(-50%,-50%);" +
            "background:radial-gradient(circle, rgba(180,220,255,0.55) 0%, rgba(180,220,255,0.18) 38%, rgba(180,220,255,0) 70%);" +
            "pointer-events:none;opacity:0;will-change:transform,opacity;" +
            "mix-blend-mode:screen;z-index:9999;";
          document.body.appendChild(cursor);
          handTracker.cursorEl = cursor;

          const tipCss =
            "position:fixed;left:0;top:0;width:18px;height:18px;border-radius:50%;" +
            "transform:translate(-50%,-50%);" +
            "background:radial-gradient(circle, rgba(220,235,255,0.85) 0%, rgba(180,220,255,0.4) 50%, rgba(180,220,255,0) 78%);" +
            "pointer-events:none;opacity:0;will-change:transform,opacity;" +
            "mix-blend-mode:screen;z-index:9999;";
          handTracker.tipEls = [0, 1, 2].map(() => {
            const el = document.createElement("div");
            el.className = "hand-tip";
            el.style.cssText = tipCss;
            document.body.appendChild(el);
            return el;
          });
          handTracker.tipsXY = [
            { x: 0, y: 0 },
            { x: 0, y: 0 },
            { x: 0, y: 0 },
          ];

          const vision = await import(
            `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}/vision_bundle.mjs`
          );
          const fileset = await vision.FilesetResolver.forVisionTasks(
            `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MEDIAPIPE_VERSION}/wasm`,
          );
          const landmarker = await vision.HandLandmarker.createFromOptions(
            fileset,
            {
              baseOptions: {
                modelAssetPath:
                  "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                delegate: "GPU",
              },
              runningMode: "VIDEO",
              numHands: 1,
              minHandDetectionConfidence: 0.5,
              minHandPresenceConfidence: 0.5,
              minTrackingConfidence: 0.5,
            },
          );
          handTracker.landmarker = landmarker;
          handTracker.ready = true;
          handTracker.reason = "ready";
          console.log("[hands] tracker ready");
        } catch (e) {
          handTracker.disabled = true;
          handTracker.reason =
            "init failed: " + (e && e.message ? e.message : e);
          console.warn("[hands] init failed; continuing without:", e);
        }
      }

      function _renderHandCursor() {
        const c = handTracker.cursorEl;
        if (!c) return;
        const cx = (handTracker.worldX + 0.5) * window.innerWidth;
        const cy = (0.5 - handTracker.worldY) * window.innerHeight;
        const scale = 0.7 + 0.6 * handTracker.pinch;
        c.style.transform = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px) translate(-50%, -50%) scale(${scale.toFixed(3)})`;
        c.style.opacity = (handTracker.presence * 0.7).toFixed(3);
        const tipEls = handTracker.tipEls;
        const tips = handTracker.tipsXY;
        if (tipEls && tips) {
          const tipOpacity = handTracker.presence.toFixed(3);
          for (let i = 0; i < 3; i++) {
            const t = tips[i];
            tipEls[i].style.transform =
              `translate(${t.x.toFixed(1)}px, ${t.y.toFixed(1)}px) translate(-50%, -50%)`;
            tipEls[i].style.opacity = tipOpacity;
          }
        }
      }

      function handTrackerTick(now) {
        if (!handTracker.ready || handTracker.disabled) return;
        const v = handTracker.video;
        if (!v || v.readyState < 2) return;
        if (v.currentTime === handTracker.lastVideoTime) {
          _renderHandCursor();
          return;
        }
        handTracker.lastVideoTime = v.currentTime;
        handTracker.frames++;

        let result;
        try {
          result = handTracker.landmarker.detectForVideo(v, now);
        } catch (_) {
          return;
        }
        const lm = result && result.landmarks && result.landmarks[0];
        if (!lm) {
          handTracker.presence = Math.max(0, handTracker.presence - 0.04);
          _renderHandCursor();
          return;
        }
        handTracker.hits++;

        // Three-fingertip centroid: thumb (4), index (8), middle (12).
        // Centroid drives the cursor position; spread drives "pinch".
        const t0 = lm[4],
          t1 = lm[8],
          t2 = lm[12];
        const cxImg = (t0.x + t1.x + t2.x) / 3;
        const cyImg = (t0.y + t1.y + t2.y) / 3;
        const nx = 1 - cxImg - 0.5;
        const ny = -(cyImg - 0.5);

        // Hand size = wrist (0) → middle MCP (9), used to scale spread
        // so the metric is invariant to hand-to-camera distance.
        const wrist = lm[0],
          mcp = lm[9];
        const sx = wrist.x - mcp.x,
          sy = wrist.y - mcp.y,
          sz = wrist.z - mcp.z;
        const handSize = Math.max(0.05, Math.sqrt(sx * sx + sy * sy + sz * sz));

        // Mean tip-to-centroid distance (3D, image-normalized).
        const d0x = t0.x - cxImg,
          d0y = t0.y - cyImg,
          d0z = t0.z;
        const d1x = t1.x - cxImg,
          d1y = t1.y - cyImg,
          d1z = t1.z;
        const d2x = t2.x - cxImg,
          d2y = t2.y - cyImg,
          d2z = t2.z;
        const spreadRaw =
          (Math.sqrt(d0x * d0x + d0y * d0y + d0z * d0z) +
            Math.sqrt(d1x * d1x + d1y * d1y + d1z * d1z) +
            Math.sqrt(d2x * d2x + d2y * d2y + d2z * d2z)) /
          3;
        const spreadNorm = spreadRaw / handSize;
        // Open hand spread ≈ 0.5–0.7, fist ≈ 0.05–0.15. Map to pinch
        // 0..1 with a soft remap so closing the fingers fully reads as 1.
        const pinchClosed = Math.max(
          0,
          Math.min(1, 1 - (spreadNorm - 0.1) / 0.5),
        );

        handTracker.worldX = _oeHandX(nx, now);
        handTracker.worldY = _oeHandY(ny, now);
        handTracker.pinch = _oePinch(pinchClosed, now);
        handTracker.presence = Math.min(1, handTracker.presence + 0.06);

        // Per-tip raw screen coords for the dot overlay.
        const tips = handTracker.tipsXY;
        if (tips) {
          const W = window.innerWidth,
            H = window.innerHeight;
          tips[0].x = (1 - t0.x) * W;
          tips[0].y = t0.y * H;
          tips[1].x = (1 - t1.x) * W;
          tips[1].y = t1.y * H;
          tips[2].x = (1 - t2.x) * W;
          tips[2].y = t2.y * H;
        }

        _renderHandCursor();

        if (handTracker.hits % 30 === 0) {
          const wp = handTracker.worldPos;
          const wv = handTracker.worldVel;
          console.log(
            `[hands] ndc=(${handTracker.worldX.toFixed(2)},${handTracker.worldY.toFixed(2)}) ` +
              `world=(${wp.x.toFixed(0)},${wp.y.toFixed(0)},${wp.z.toFixed(0)}) ` +
              `vel=(${wv.x.toFixed(0)},${wv.y.toFixed(0)},${wv.z.toFixed(0)}) ` +
              `str=${handTracker.strength.toFixed(4)} pinch=${handTracker.pinch.toFixed(2)}`,
          );
        }
      }

      // Project image-space hand position into world space at the focal
      // plane through the origin (perpendicular to the camera). Derive
      // a world-space velocity by differencing across frames.
      // Per-frame gain applied here so the shader term is just w * vel.
      const HAND_GAIN = 0.02;
      const HAND_PULL_GAIN = 0.003; // pinch-driven Gaussian-weighted attractor
      const HAND_PULL_THRESHOLD = 0.3; // pinch must exceed this to engage
      const _hRaycaster = new THREE.Raycaster();
      const _hNdc = new THREE.Vector2();
      const _hPlane = new THREE.Plane();
      const _hPlaneNormal = new THREE.Vector3();
      const _hPlanePoint = new THREE.Vector3();
      const _hWorldNext = new THREE.Vector3();
      const _hVelTmp = new THREE.Vector3();
      function updateHandWorld(camera, dt) {
        if (!handTracker.ready || handTracker.disabled) {
          handTracker.strength = 0;
          handTracker.pull = 0;
          handTracker.worldVel.set(0, 0, 0);
          return;
        }
        const presence = handTracker.presence;
        if (presence < 0.001) {
          handTracker.strength = 0;
          handTracker.pull = 0;
          handTracker.worldVel.set(0, 0, 0);
          handTracker.worldPosInited = false;
          return;
        }
        _hNdc.set(handTracker.worldX * 2, handTracker.worldY * 2);
        _hRaycaster.setFromCamera(_hNdc, camera);
        camera.getWorldDirection(_hPlaneNormal);
        _hPlanePoint.set(0, 0, 0);
        _hPlane.setFromNormalAndCoplanarPoint(
          _hPlaneNormal.negate(),
          _hPlanePoint,
        );
        const hit = _hRaycaster.ray.intersectPlane(_hPlane, _hWorldNext);
        if (!hit) {
          handTracker.strength = 0;
          handTracker.pull = 0;
          return;
        }
        if (handTracker.worldPosInited) {
          _hVelTmp
            .subVectors(_hWorldNext, handTracker.worldPos)
            .divideScalar(Math.max(dt, 1e-3));
          handTracker.worldVel.lerp(_hVelTmp, 0.5);
        } else {
          handTracker.worldVel.set(0, 0, 0);
          handTracker.worldPosInited = true;
        }
        handTracker.worldPos.copy(_hWorldNext);
        handTracker.strength = presence * HAND_GAIN;
        const pinchActive = Math.max(
          0,
          (handTracker.pinch - HAND_PULL_THRESHOLD) / (1 - HAND_PULL_THRESHOLD),
        );
        handTracker.pull = presence * pinchActive * HAND_PULL_GAIN;
      }

      // ----- step 2: WGSL shaders ----------------------------------
      // SimParams lives in a storage buffer (not uniform) so the K[64]
      // matrix doesn't force per-element padding; storage stride for
      // f32 is 4 bytes vs 16 in a uniform array. K is sized for
      // NUM_KINDS = 8 (PETROVA_LINE.md added kind 7 = astrophage).
      const WGSL_SIM_PARAMS = /* wgsl */ `
        struct SimParams {
          dt: f32,
          G: f32,
          eps2: f32,
          sign: f32,
          frame: f32,
          flock: f32,
          radiation: f32,
          maxAge: f32,
          N: u32,
          numKinds: u32,
          texSize: u32,
          spin: f32,
          comX: f32,
          comY: f32,
          comZ: f32,
          _pad1: f32,
          handX: f32,
          handY: f32,
          handZ: f32,
          handStrength: f32,
          handVx: f32,
          handVy: f32,
          handVz: f32,
          handRadius: f32,
          handPull: f32,
          theta2: f32,
          _pad3: f32,
          _pad4: f32,
          K: array<f32, 64>,
          // Astrophage (PETROVA_LINE.md), float slots 92..105 — mirrors
          // the GLSL uStarPos / uPlanetPos / uStarMass / uPlanetMass /
          // uAstroThrust / uPlanetRadius / uSpawnOffset / uSpawnRadius.
          // Written by writeWgpuParams; WGPU_PARAMS_BYTES covers them.
          starX: f32,
          starY: f32,
          starZ: f32,
          starMass: f32,
          planetX: f32,
          planetY: f32,
          planetZ: f32,
          planetMass: f32,
          astroThrust: f32,
          planetRadius: f32,
          spawnX: f32,
          spawnY: f32,
          spawnZ: f32,
          spawnRadius: f32,
        };
      `;
      // SimParams byte size: 28 fixed floats (112 B) + K[64] (256 B) +
      // 14 astrophage floats (56 B) = 424 B, rounded up to 432 (×16).
      // Storage-buffer layout is plain — f32 = 4 B, no padding between
      // scalars — so slot n lives at byte 4n. Used for the GPUBuffer,
      // the CPU scratch and the writeBuffer size (CHANGELOG ledger:
      // "Adding a new KIND_* requires updating WGSL + WebGPU buffer
      // sizes" — same trap for any SimParams growth).
      const WGPU_PARAMS_BYTES = 432;

      // Shared by the brute vel kernel, the pos kernel and the BH force
      // kernel. Mirror of the GLSL hash22 so the same (uv, sample,
      // frame) seed gives the same pick on both backends.
      const WGSL_HASH22 = /* wgsl */ `
        fn hash22(q: vec2<f32>, seed: f32) -> vec2<f32> {
          var p3 = fract(vec3<f32>(q.x, q.y, q.x) * vec3<f32>(0.1031, 0.1030, 0.0973) + seed * 0.173);
          p3 = p3 + dot(p3, p3.yzx + 19.19);
          return fract((p3.xx + p3.yz) * p3.zy);
        }
      `;
      // Astrophage helpers (PETROVA_LINE.md §3.3 / §3.4) — mirrors of
      // ASTRO_SPAWN_GLSL + astroLaunchVel in the GLSL kernels, same hash
      // seeds. Must be spliced in after the `p: SimParams` binding and
      // after hash22 in each kernel.
      const WGSL_ASTRO_FNS = /* wgsl */ `
        // GLSL's gl_FragCoord.xy / resolution.xy for body index i.
        fn astroUv(i: u32) -> vec2<f32> {
          let x = i % p.texSize;
          let y = i / p.texSize;
          return (vec2<f32>(f32(x), f32(y)) + 0.5) / f32(p.texSize);
        }
        fn astroSpawnPoint(uv: vec2<f32>, frame: f32) -> vec3<f32> {
          let hA = hash22(uv, frame * 0.0007);
          let hB = hash22(uv * 1.7, frame * 0.0011 + 0.31);
          let az  = 6.2832 * hA.x;
          let rho = p.spawnRadius * sqrt(hB.x);
          let off = vec3<f32>(p.spawnX, p.spawnY, p.spawnZ);
          let offLen = length(off);
          var n = vec3<f32>(1.0, 0.0, 0.0);
          if (offLen > 1e-6) { n = off / offLen; }
          var helper = vec3<f32>(1.0, 0.0, 0.0);
          if (abs(n.y) < 0.9) { helper = vec3<f32>(0.0, 1.0, 0.0); }
          let t1 = normalize(cross(n, helper));
          let t2 = cross(n, t1);
          return vec3<f32>(p.starX, p.starY, p.starZ) + off
               + rho * (cos(az) * t1 + sin(az) * t2);
        }
        fn astroLaunchVel(sp: vec3<f32>, uv: vec2<f32>, frame: f32) -> vec3<f32> {
          let rad = sp - vec3<f32>(p.starX, p.starY, p.starZ);
          let r = max(length(rad), 0.5);
          var dir = rad / r;
          let hC = hash22(uv * 2.9 + 0.17, frame * 0.0013 + 0.53);
          let hD = hash22(uv * 4.3 + 0.61, frame * 0.0017 + 0.89);
          let jit = vec3<f32>(hC.x, hC.y, hD.x) - 0.5;
          dir = normalize(dir + 0.3 * jit);
          let vCirc = sqrt(max(p.G * p.starMass, 0.0) / r);
          let speed = ${ASTRO_LAUNCH.toFixed(3)} * vCirc * (0.75 + 0.5 * hD.y);
          return dir * speed;
        }
      `;
      // theta2 (was _pad2) is the Barnes-Hut opening angle squared —
      // written every frame by writeWgpuParams (float slot 25). The
      // brute-force kernels never read it, so the layout trap from the
      // CHANGELOG NUM_KINDS ledger entry doesn't apply: same bytes,
      // same PARAMS_BYTES.
      // Velocity step — gravity only for now. Stochastic flocking +
      // radiation pressure is a step-5 addition; current scenes that
      // don't use flock/radiation behave identically with this shader.
      const WGSL_VEL_SHADER =
        WGSL_SIM_PARAMS +
        /* wgsl */ `
        const NUM_KINDS: u32 = 8u;
        const TILE: u32 = 256u;

        @group(0) @binding(0) var<storage, read>       positions:  array<vec4<f32>>;
        @group(0) @binding(1) var<storage, read>       velocities: array<vec4<f32>>;
        @group(0) @binding(2) var<storage, read_write> outVel:     array<vec4<f32>>;
        @group(0) @binding(3) var<storage, read>       p:          SimParams;

        var<workgroup> tilePos: array<vec4<f32>, TILE>;
        var<workgroup> tileVel: array<vec4<f32>, TILE>;
        ` +
        WGSL_HASH22 +
        WGSL_ASTRO_FNS +
        /* wgsl */ `
        @compute @workgroup_size(TILE)
        fn velStep(
          @builtin(global_invocation_id) gid: vec3<u32>,
          @builtin(local_invocation_id)  lid: vec3<u32>,
        ) {
          let i = gid.x;
          let alive = i < p.N && positions[i].w > 0.0;

          let posA = positions[i];
          let velA = velocities[i];
          let pA   = posA.xyz;

          let kindFloat = floor(velA.w + 0.001);
          let ageNorm   = velA.w - kindFloat;
          let kindA     = clamp(i32(kindFloat), 0, i32(NUM_KINDS) - 1);

          // Hoist kindA's interaction row and the scalar params out of
          // the O(N) pair loop — an indexed storage-buffer read per pair
          // costs far more than a function-scope array lookup.
          var kRow: array<f32, NUM_KINDS>;
          for (var k: u32 = 0u; k < NUM_KINDS; k = k + 1u) {
            kRow[k] = p.K[u32(kindA) * NUM_KINDS + k];
          }
          let G    = p.G;
          let eps2 = p.eps2;

          // Astrophage (kind 7) — PETROVA_LINE.md §3.1, mirror of the GLSL
          // kind-7 branch: star gravity + planet gravity + thrust with
          // steering (ASTRO_STEER); no pair loop, flocking, spin or hand.
          // Computed here and written at the end instead of returning
          // early, because the tile loop's workgroupBarrier() must stay
          // in uniform control flow. Flock/spin/hand blocks below may
          // still run for kind 7 (their acc is discarded); flock is
          // gated on p.flock and the others are trivial.
          let isAstro = alive && kindA == 7;
          var astroOut = velA;
          if (isAstro) {
            let starPos   = vec3<f32>(p.starX, p.starY, p.starZ);
            let planetPos = vec3<f32>(p.planetX, p.planetY, p.planetZ);
            let uvA = astroUv(i);
            if (p.planetRadius > 0.0 && length(pA - planetPos) < p.planetRadius) {
              // Arrival: the position kernel snaps this body to the same
              // spawn point this step; hand it the launch velocity and
              // reset age to 0 so pointVert ramps it in.
              let sp = astroSpawnPoint(uvA, p.frame);
              astroOut = vec4<f32>(astroLaunchVel(sp, uvA, p.frame), kindFloat);
            } else {
              let toStar   = starPos - pA;
              let toPlanet = planetPos - pA;
              let r2s = dot(toStar, toStar) + eps2;
              let r2p = dot(toPlanet, toPlanet) + eps2;
              let fStar   = G * p.starMass   * toStar   * inverseSqrt(r2s * r2s * r2s);
              let fPlanet = G * p.planetMass * toPlanet * inverseSqrt(r2p * r2p * r2p);
              let distP = max(length(toPlanet), 0.001);
              let dirP  = toPlanet / distP;
              let vA    = velA.xyz;
              let vPerp = vA - dot(vA, dirP) * dirP;
              let fThrust = dirP * p.astroThrust
                          - vPerp * (${ASTRO_STEER.toFixed(3)} * p.sign);
              let nv = vA + (fStar + fPlanet + fThrust) * p.dt * p.sign;
              let dAgeA = p.dt * abs(p.sign) / p.maxAge;
              astroOut = vec4<f32>(nv, kindFloat + clamp(ageNorm + dAgeA, 0.0, 0.9999));
            }
          }

          var acc = vec3<f32>(0.0);
          let numTiles = (p.N + TILE - 1u) / TILE;

          for (var t: u32 = 0u; t < numTiles; t = t + 1u) {
            let srcIdx = t * TILE + lid.x;
            if (srcIdx < p.N) {
              tilePos[lid.x] = positions[srcIdx];
              tileVel[lid.x] = velocities[srcIdx];
            } else {
              tilePos[lid.x] = vec4<f32>(0.0, 0.0, 0.0, 0.0);
              tileVel[lid.x] = vec4<f32>(0.0, 0.0, 0.0, 0.0);
            }
            workgroupBarrier();

            if (alive && !isAstro) {
              for (var j: u32 = 0u; j < TILE; j = j + 1u) {
                let posB = tilePos[j];
                let velB = tileVel[j];
                let kindB = clamp(i32(floor(velB.w + 0.001)), 0, i32(NUM_KINDS) - 1);
                // Dead bodies carry mass <= 0; max() zeroes their term.
                // Branchless beats a per-pair continue on SIMD lanes,
                // and matches the GLSL path's skip exactly (any body
                // with posB.w <= 0 contributes no force there either).
                let mB    = max(posB.w, 0.0);
                let d     = posB.xyz - pA;
                let r2    = dot(d, d) + eps2;
                let invR3 = inverseSqrt(r2 * r2 * r2);
                acc = acc + G * mB * kRow[u32(kindB)] * d * invR3;
              }
            }
            workgroupBarrier();
          }

          // ── stochastic neighborhood (flocking + radiation pressure) ──
          // 8 random texel reads, weighted by inverse distance. Faithful
          // port of the GLSL block at index.html:1700-1738.
          if (alive && (p.flock > 0.001 || p.radiation > 0.001)) {
            let xSelf = i % p.texSize;
            let ySelf = i / p.texSize;
            let uvSelf = (vec2<f32>(f32(xSelf), f32(ySelf)) + 0.5) / f32(p.texSize);
            var alignV = vec3<f32>(0.0);
            var cohC   = vec3<f32>(0.0);
            var sepF   = vec3<f32>(0.0);
            var brightDir = vec3<f32>(0.0);
            var wSum: f32 = 0.0;
            for (var s: u32 = 0u; s < 8u; s = s + 1u) {
              let rnd = hash22(uvSelf * 47.0 + f32(s) * 11.3, p.frame * 0.001 + 0.7);
              let rx = u32(floor(rnd.x * f32(p.texSize)));
              let ry = u32(floor(rnd.y * f32(p.texSize)));
              let cx = min(rx, p.texSize - 1u);
              let cy = min(ry, p.texSize - 1u);
              let randIdx = cy * p.texSize + cx;
              let posS = positions[randIdx];
              if (posS.w <= 0.0) { continue; }
              let velS = velocities[randIdx];
              let dS = posS.xyz - pA;
              let rS = length(dS) + 0.001;
              let w  = 1.0 / (1.0 + rS * 0.02);
              alignV = alignV + velS.xyz * w;
              cohC   = cohC + posS.xyz * w;
              sepF   = sepF - dS / (rS * rS * rS + 0.001);
              let b  = length(velS.xyz) * posS.w * w;
              brightDir = brightDir + (dS / rS) * b;
              wSum = wSum + w;
            }
            if (wSum > 0.001) {
              alignV = alignV / wSum;
              cohC   = cohC / wSum;
              var flockK: f32 = 0.0;
              if (kindA == 3) {
                flockK = 1.0;
              } else if (kindA == 0 || kindA == 5 || kindA == 6) {
                flockK = 0.12;
              }
              let fA = (alignV - velA.xyz) * 0.22;
              let fC = (cohC - pA) * 0.004;
              let fS = sepF * 0.04;
              acc = acc + (fA + fC + fS) * p.flock * flockK;
              if (p.radiation > 0.001) {
                brightDir = brightDir / wSum;
                acc = acc - brightDir * p.radiation * 0.00004;
              }
            }
          }

          // Vorticity around the system barycenter (Y axis).
          // Bipolar slider: negative = retrograde. Zero = no work.
          if (alive && p.spin != 0.0) {
            let r = pA - vec3<f32>(p.comX, p.comY, p.comZ);
            acc = acc + cross(vec3<f32>(0.0, p.spin, 0.0), r);
          }

          // Hand brush — push particles in the direction of cursor
          // motion with a Gaussian falloff around the cursor position.
          // handStrength includes the JS-side gain; zero = no work.
          if (alive && (p.handStrength > 0.0 || p.handPull > 0.0)) {
            let handPos = vec3<f32>(p.handX, p.handY, p.handZ);
            let toHand  = pA - handPos;
            let r2h     = dot(toHand, toHand);
            let sigma2  = max(p.handRadius * p.handRadius, 1e-3);
            let w       = exp(-r2h / sigma2);
            // Brush: push along motion vector.
            acc = acc + p.handStrength * w * vec3<f32>(p.handVx, p.handVy, p.handVz);
            // Pull: spring-style toward cursor. Gaussian-weighted so it
            // dies off outside the brush radius.
            acc = acc - p.handPull * w * toHand;
          }

          let newVel = velA.xyz + acc * p.dt * p.sign;
          let dAge   = p.dt * abs(p.sign) / p.maxAge;
          let newAge = clamp(ageNorm + dAge, 0.0, 0.9999);
          // Dead bodies preserve velA unchanged — matches the GLSL
          // early-return at index.html:1666 so age doesn't tick on
          // empty texels and we don't drift away from the WebGL2 path.
          if (isAstro) {
            outVel[i] = astroOut;
          } else if (alive) {
            outVel[i] = vec4<f32>(newVel, kindFloat + newAge);
          } else if (i < p.N) {
            outVel[i] = velA;
          }
        }
      `;
      const WGSL_POS_SHADER =
        WGSL_SIM_PARAMS +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read>       positions:  array<vec4<f32>>;
        @group(0) @binding(1) var<storage, read>       velocities: array<vec4<f32>>;
        @group(0) @binding(2) var<storage, read_write> outPos:     array<vec4<f32>>;
        @group(0) @binding(3) var<storage, read>       p:          SimParams;
        ` +
        WGSL_HASH22 +
        WGSL_ASTRO_FNS +
        /* wgsl */ `
        @compute @workgroup_size(256)
        fn posStep(@builtin(global_invocation_id) gid: vec3<u32>) {
          let i = gid.x;
          if (i >= p.N) { return; }
          let pos = positions[i];
          let vel = velocities[i];
          // Astrophage respawn (PETROVA_LINE.md §3.4) — mirror of the
          // GLSL positionShader block: an arrived kind-7 body snaps to a
          // fresh launch-cap point. The velocity kernel tests the same
          // OLD position and writes the matching launch velocity.
          let kindF = floor(vel.w + 0.001);
          let planetPos = vec3<f32>(p.planetX, p.planetY, p.planetZ);
          if (kindF > 6.5 && p.planetRadius > 0.0
              && length(pos.xyz - planetPos) < p.planetRadius) {
            outPos[i] = vec4<f32>(astroSpawnPoint(astroUv(i), p.frame), pos.w);
          } else {
            outPos[i] = vec4<f32>(pos.xyz + vel.xyz * p.dt * p.sign, pos.w);
          }
        }
      `;

      // ===============================================================
      // 1c. BARNES-HUT LBVH PIPELINE  (BARNES_HUT_PLAN.md, M1–M5)
      // ===============================================================
      // O(N log N) gravity replacing the O(N²) tile loop, behind ?bh=1
      // (or __bhToggle(true)). Per substep:
      //   prep → AABB reduce → Morton keys → radix sort → Karras LBVH
      //   per kind segment → leaf init → ropes → bottom-up aggregate →
      //   convergence check → force walk (θ-MAC, stackless via ropes).
      //
      // The K interaction matrix stays EXACT via per-kind segmented
      // trees (plan §1d): the sort key is [kind:3 | morton:27], so each
      // kind's bodies are a contiguous run of the sorted array with its
      // own LBVH; a body walks ≤8 trees, each scaled by K[kindA][b].
      // Dead bodies get key 0xFFFFFFFF and sort past every segment.
      //
      // Aggregation runs as BH_AGG_ITERS ping-pong dispatches (a node
      // computes once both children finished a PRIOR dispatch) instead
      // of the classic single-pass atomic-counter trick — WGSL atomics
      // are relaxed, so cross-workgroup data visibility inside one
      // dispatch is not guaranteed; dispatch boundaries are. 56 covers
      // the worst radix-tree depth (30 key bits + index tie-break).
      // Verify gates: __bhTree() (M1–M4), __bhCompare() (M5/M6),
      // __bhBench() (perf). See docs/active/BH_TESTING.md.
      const BH_AGG_ITERS = 56;
      const bhSim = {
        wanted: false,
        // Auto mode: with no ?bh= flag, the tree switches itself on at
        // BH_AUTO_MIN_BODIES and above (where it beats the brute kernel
        // ~3–10× on a discrete GPU) and off below (where brute wins).
        auto: true,
        theta: 0.5, // MAC opening angle; force reads theta² from SimParams
        // Aggregate wavefront dispatches per substep. Must exceed the
        // deepest tree (≈ 27 Morton-chain levels + log2(largest kind
        // segment) for the index-tiebreak subtrees). __bhTree() reports
        // the measured depth; lower this from the console to shave
        // build time once you know your scenes' worst case.
        aggIters: BH_AGG_ITERS,
        failed: null, // string reason once init fails; latches off
        pipelines: null,
        initPromise: null,
        buffers: null,
        groups: null,
        capacity: 0,
        epoch: -1, // wgpuSim.epoch the bind groups were built against
      };
      try {
        const _u = new URL(location.href);
        const _bh = (_u.searchParams.get("bh") || "").toLowerCase();
        if (_bh !== "") bhSim.auto = false; // explicit flag pins it either way
        if (_bh === "1" || _bh === "true" || _bh === "on") bhSim.wanted = true;
        const _th = parseFloat(_u.searchParams.get("theta"));
        if (isFinite(_th) && _th >= 0.1 && _th <= 2.0) bhSim.theta = _th;
      } catch (_) {}
      const BH_AUTO_MIN_BODIES = 200000; // colossal (262k) and up
      function bhAutoApply() {
        if (!bhSim.auto || !wgpuSim.available || bhSim.failed) return;
        const want = MAX_BODIES >= BH_AUTO_MIN_BODIES;
        if (want !== bhSim.wanted && typeof window.__bhToggle === "function") {
          window.__bhToggle(want);
        }
      }

      const BH_WGSL_COMMON = /* wgsl */ `
        const BH_INVALID: u32 = 0xffffffffu;
      `;

      // -- prep: zero flags, reset topology + control words ----------
      const BH_WGSL_PREP =
        WGSL_SIM_PARAMS +
        BH_WGSL_COMMON +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read_write> flagsA: array<u32>;
        @group(0) @binding(1) var<storage, read_write> flagsB: array<u32>;
        @group(0) @binding(2) var<storage, read_write> topo: array<vec4<u32>>;
        @group(0) @binding(3) var<storage, read_write> ctl: array<u32>;
        @group(0) @binding(4) var<storage, read> p: SimParams;
        @compute @workgroup_size(256)
        fn bhPrep(@builtin(global_invocation_id) gid: vec3<u32>) {
          let n = gid.x;
          if (n < 32u) { ctl[n] = 0u; }
          if (n >= 2u * p.N) { return; }
          flagsA[n] = 0u;
          flagsB[n] = 0u;
          topo[n] = vec4<u32>(BH_INVALID);
        }
      `;

      // -- AABB reduce, two levels (no float atomics in WGSL) --------
      const BH_WGSL_AABB_A =
        WGSL_SIM_PARAMS +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read> positions: array<vec4<f32>>;
        @group(0) @binding(1) var<storage, read_write> partials: array<vec4<f32>>;
        @group(0) @binding(2) var<storage, read> p: SimParams;
        var<workgroup> smn: array<vec3<f32>, 256>;
        var<workgroup> smx: array<vec3<f32>, 256>;
        @compute @workgroup_size(256)
        fn bhAabbA(
          @builtin(global_invocation_id) gid: vec3<u32>,
          @builtin(local_invocation_id) lid: vec3<u32>,
          @builtin(workgroup_id) wid: vec3<u32>,
        ) {
          var mn = vec3<f32>(1e30);
          var mx = vec3<f32>(-1e30);
          let i = gid.x;
          if (i < p.N) {
            let pw = positions[i];
            if (pw.w > 0.0) { mn = pw.xyz; mx = pw.xyz; }
          }
          smn[lid.x] = mn;
          smx[lid.x] = mx;
          workgroupBarrier();
          for (var ofs: u32 = 128u; ofs > 0u; ofs = ofs >> 1u) {
            if (lid.x < ofs) {
              smn[lid.x] = min(smn[lid.x], smn[lid.x + ofs]);
              smx[lid.x] = max(smx[lid.x], smx[lid.x + ofs]);
            }
            workgroupBarrier();
          }
          if (lid.x == 0u) {
            partials[2u * wid.x] = vec4<f32>(smn[0], 0.0);
            partials[2u * wid.x + 1u] = vec4<f32>(smx[0], 0.0);
          }
        }
      `;
      const BH_WGSL_AABB_B = /* wgsl */ `
        struct RadixPass { shift: u32, numBlocks: u32, spanLen: u32, total: u32 }
        @group(0) @binding(0) var<storage, read> partials: array<vec4<f32>>;
        @group(0) @binding(1) var<storage, read_write> aabbBox: array<vec4<f32>>;
        @group(0) @binding(2) var<storage, read> pp: RadixPass;
        var<workgroup> smn: array<vec3<f32>, 256>;
        var<workgroup> smx: array<vec3<f32>, 256>;
        @compute @workgroup_size(256)
        fn bhAabbB(@builtin(local_invocation_id) lid: vec3<u32>) {
          var mn = vec3<f32>(1e30);
          var mx = vec3<f32>(-1e30);
          var j = lid.x;
          loop {
            if (j >= pp.numBlocks) { break; }
            mn = min(mn, partials[2u * j].xyz);
            mx = max(mx, partials[2u * j + 1u].xyz);
            j = j + 256u;
          }
          smn[lid.x] = mn;
          smx[lid.x] = mx;
          workgroupBarrier();
          for (var ofs: u32 = 128u; ofs > 0u; ofs = ofs >> 1u) {
            if (lid.x < ofs) {
              smn[lid.x] = min(smn[lid.x], smn[lid.x + ofs]);
              smx[lid.x] = max(smx[lid.x], smx[lid.x + ofs]);
            }
            workgroupBarrier();
          }
          if (lid.x == 0u) {
            // Tiny pad so max-corner bodies don't quantize to 512.
            let pad = (smx[0] - smn[0]) * 0.001 + vec3<f32>(1e-4);
            aabbBox[0] = vec4<f32>(smn[0] - pad, 0.0);
            aabbBox[1] = vec4<f32>(smx[0] + pad, 0.0);
          }
        }
      `;

      // -- Morton keys: [kind:3 | morton9x9x9:27], dead = all-ones ---
      const BH_WGSL_MORTON =
        WGSL_SIM_PARAMS +
        BH_WGSL_COMMON +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read> positions: array<vec4<f32>>;
        @group(0) @binding(1) var<storage, read> velocities: array<vec4<f32>>;
        @group(0) @binding(2) var<storage, read_write> keysOut: array<u32>;
        @group(0) @binding(3) var<storage, read_write> idxOut: array<u32>;
        @group(0) @binding(4) var<storage, read> aabbBox: array<vec4<f32>>;
        @group(0) @binding(5) var<storage, read_write> ctlA: array<atomic<u32>>;
        @group(0) @binding(6) var<storage, read> p: SimParams;
        fn bhExpand(v0: u32) -> u32 {
          var v = v0 & 0x3ffu;
          v = (v | (v << 16u)) & 0x030000FFu;
          v = (v | (v << 8u)) & 0x0300F00Fu;
          v = (v | (v << 4u)) & 0x030C30C3u;
          v = (v | (v << 2u)) & 0x09249249u;
          return v;
        }
        @compute @workgroup_size(256)
        fn bhMorton(@builtin(global_invocation_id) gid: vec3<u32>) {
          let i = gid.x;
          if (i >= p.N) { return; }
          let pos = positions[i];
          var key = BH_INVALID;
          if (pos.w > 0.0) {
            let kind = u32(clamp(i32(floor(velocities[i].w + 0.001)), 0, 7));
            atomicAdd(&ctlA[kind], 1u);
            let mn = aabbBox[0].xyz;
            let span = max(aabbBox[1].xyz - mn, vec3<f32>(1e-5));
            let q = clamp(
              (pos.xyz - mn) / span * 511.0,
              vec3<f32>(0.0),
              vec3<f32>(511.0),
            );
            let qi = vec3<u32>(q);
            key = (kind << 27u) |
              (bhExpand(qi.x) << 2u) | (bhExpand(qi.y) << 1u) | bhExpand(qi.z);
          }
          keysOut[i] = key;
          idxOut[i] = i;
        }
      `;

      // -- segment setup: prefix alive counts → starts + roots -------
      const BH_WGSL_SEGSETUP =
        WGSL_SIM_PARAMS +
        BH_WGSL_COMMON +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read_write> ctl: array<u32>;
        @group(0) @binding(1) var<storage, read> p: SimParams;
        @compute @workgroup_size(1)
        fn bhSegSetup() {
          var off: u32 = 0u;
          for (var k: u32 = 0u; k < 8u; k = k + 1u) {
            let c = ctl[k];
            ctl[8u + k] = off;
            if (c == 0u) {
              ctl[16u + k] = BH_INVALID;
            } else if (c == 1u) {
              ctl[16u + k] = off; // singleton segment: root IS the leaf
            } else {
              ctl[16u + k] = p.N + off; // internal node 0 of the segment
            }
            off = off + c;
          }
          ctl[24] = off; // totalAlive
        }
      `;

      // -- radix sort: histogram / 3-stage scan / stable scatter -----
      // LSD, 4-bit digits × 8 passes over the full 32-bit key. Stable,
      // so kind-major order falls straight out of the key layout.
      const BH_WGSL_HIST =
        WGSL_SIM_PARAMS +
        /* wgsl */ `
        struct RadixPass { shift: u32, numBlocks: u32, spanLen: u32, total: u32 }
        @group(0) @binding(0) var<storage, read> keysIn: array<u32>;
        @group(0) @binding(1) var<storage, read_write> hist: array<u32>;
        @group(0) @binding(2) var<storage, read> pp: RadixPass;
        @group(0) @binding(3) var<storage, read> p: SimParams;
        var<workgroup> wh: array<atomic<u32>, 16>;
        @compute @workgroup_size(256)
        fn bhHist(
          @builtin(global_invocation_id) gid: vec3<u32>,
          @builtin(local_invocation_id) lid: vec3<u32>,
          @builtin(workgroup_id) wid: vec3<u32>,
        ) {
          if (lid.x < 16u) { atomicStore(&wh[lid.x], 0u); }
          workgroupBarrier();
          if (gid.x < p.N) {
            let d = (keysIn[gid.x] >> pp.shift) & 15u;
            atomicAdd(&wh[d], 1u);
          }
          workgroupBarrier();
          if (lid.x < 16u) {
            hist[lid.x * pp.numBlocks + wid.x] = atomicLoad(&wh[lid.x]);
          }
        }
      `;
      // Scan of hist (digit-major) in three barrier-free-loop stages:
      // per-thread span sums → 256-wide exclusive scan → span replay.
      // Single-dispatch exclusive scan of hist (digit-major). One
      // workgroup: serial span sums (no barriers in the data-dependent
      // loops) → fixed-256 Hillis-Steele (constant bounds, barriers
      // legal) → serial replay. Was three dispatches; fusing them cut
      // 16 dispatches per substep off the sort (bench 2026-07-01
      // showed dispatch overhead dominating at 65k).
      const BH_WGSL_SCAN = /* wgsl */ `
        struct RadixPass { shift: u32, numBlocks: u32, spanLen: u32, total: u32 }
        @group(0) @binding(0) var<storage, read_write> hist: array<u32>;
        @group(0) @binding(1) var<storage, read> pp: RadixPass;
        var<workgroup> tmp: array<u32, 256>;
        @compute @workgroup_size(256)
        fn bhScan(@builtin(local_invocation_id) lid: vec3<u32>) {
          let j0 = lid.x * pp.spanLen;
          var sum: u32 = 0u;
          var j: u32 = 0u;
          loop {
            if (j >= pp.spanLen) { break; }
            let g = j0 + j;
            if (g < pp.total) { sum = sum + hist[g]; }
            j = j + 1u;
          }
          let orig = sum;
          tmp[lid.x] = sum;
          workgroupBarrier();
          for (var ofs: u32 = 1u; ofs < 256u; ofs = ofs << 1u) {
            var v = tmp[lid.x];
            if (lid.x >= ofs) { v = v + tmp[lid.x - ofs]; }
            workgroupBarrier();
            tmp[lid.x] = v;
            workgroupBarrier();
          }
          var run = tmp[lid.x] - orig; // exclusive base for my span
          j = 0u;
          loop {
            if (j >= pp.spanLen) { break; }
            let g = j0 + j;
            if (g < pp.total) {
              let h = hist[g];
              hist[g] = run;
              run = run + h;
            }
            j = j + 1u;
          }
        }
      `;
      const BH_WGSL_SCATTER =
        WGSL_SIM_PARAMS +
        /* wgsl */ `
        struct RadixPass { shift: u32, numBlocks: u32, spanLen: u32, total: u32 }
        @group(0) @binding(0) var<storage, read> keysIn: array<u32>;
        @group(0) @binding(1) var<storage, read> idxIn: array<u32>;
        @group(0) @binding(2) var<storage, read_write> keysOut: array<u32>;
        @group(0) @binding(3) var<storage, read_write> idxOut: array<u32>;
        @group(0) @binding(4) var<storage, read> hist: array<u32>;
        @group(0) @binding(5) var<storage, read> pp: RadixPass;
        @group(0) @binding(6) var<storage, read> p: SimParams;
        var<workgroup> sdig: array<u32, 256>;
        @compute @workgroup_size(256)
        fn bhScatter(
          @builtin(global_invocation_id) gid: vec3<u32>,
          @builtin(local_invocation_id) lid: vec3<u32>,
          @builtin(workgroup_id) wid: vec3<u32>,
        ) {
          let g = gid.x;
          var dig: u32 = 0xffu;
          var key: u32 = 0u;
          var pay: u32 = 0u;
          if (g < p.N) {
            key = keysIn[g];
            pay = idxIn[g];
            dig = (key >> pp.shift) & 15u;
          }
          sdig[lid.x] = dig;
          workgroupBarrier();
          if (g < p.N) {
            // Stable rank of this element among same-digit lanes before
            // it in the block. O(256) per thread; correctness-first.
            var rank: u32 = 0u;
            for (var j: u32 = 0u; j < 256u; j = j + 1u) {
              if (j >= lid.x) { break; }
              if (sdig[j] == dig) { rank = rank + 1u; }
            }
            let dst = hist[dig * pp.numBlocks + wid.x] + rank;
            keysOut[dst] = key;
            idxOut[dst] = pay;
          }
        }
      `;

      // -- Karras 2012 binary radix tree, per kind segment -----------
      const BH_WGSL_BUILD =
        WGSL_SIM_PARAMS +
        BH_WGSL_COMMON +
        /* wgsl */ `
        @group(0) @binding(0) var<storage, read> keys: array<u32>;
        @group(0) @binding(1) var<storage, read_write> topo: array<vec4<u32>>;
        @group(0) @binding(2) var<storage, read> ctlR: array<u32>;
        @group(0) @binding(3) var<storage, read> p: SimParams;
        // Common-prefix length between sorted slots i and j of segment
        // [s, s+M). Equal keys tie-break on global slot index, which
        // makes conceptual keys unique (Karras §4).
        fn bhDelta(s: u32, M: u32, i: i32, j: i32) -> i32 {
          if (j < 0 || j >= i32(M)) { return -1; }
          let gi = s + u32(i);
          let gj = s + u32(j);
          let ka = keys[gi];
          let kb = keys[gj];
          if (ka == kb) { return 32 + i32(countLeadingZeros(gi ^ gj)); }
          return i32(countLeadingZeros(ka ^ kb));
        }
        @compute @workgroup_size(256)
        fn bhBuild(@builtin(global_invocation_id) gid: vec3<u32>) {
          let jGlobal = gid.x;
          if (jGlobal >= ctlR[24]) { return; }
          // Locate this slot's kind segment.
          var seg: u32 = 0u;
          var s: u32 = 0u;
          var M: u32 = 0u;
          for (var k: u32 = 0u; k < 8u; k = k + 1u) {
            let st = ctlR[8u + k];
            let c = ctlR[k];
