      // Scene-local state (PETROVA_LINE.md §5.1). `clock` is time-in-
      // scene — it only advances while petrova-line is the current scene
      // (the tick hook is per-scene) and resets on every scene init.
      const petrova = {
        variant: null,
        clock: 0,
        nextSighting: Infinity,
        rehearseShips: false,
        arrivalGain: 1.0,
      };

      function pickPetrovaVariant() {
        let forced = null;
        try {
          forced = new URL(location.href).searchParams.get("petrova");
        } catch (_) {}
        if (forced) {
          const hit = PETROVA_VARIANTS.find((v) => v.key === forced);
          if (hit) return hit;
        }
        let total = 0;
        for (const v of PETROVA_VARIANTS) total += v.weight;
        let r = rng() * total;
        for (const v of PETROVA_VARIANTS) {
          r -= v.weight;
          if (r <= 0) return v;
        }
        return PETROVA_VARIANTS[PETROVA_VARIANTS.length - 1];
      }

      // CPU twin of the shader's kind-7 force law for the cap-centre
      // body with the mean launch speed. Used once per scene init to
      // pre-distribute astrophage along the steady-state path (so the
      // beam is there on the first frame instead of filling over ~10 s)
      // and by the ship scheduler to pick beam-crossing points. Returns
      // a flat [x,y,z,vx,vy,vz,...] array, one entry per dt.
      function astroReferencePath(astro, G, eps2, dt) {
        const [sx, sy, sz] = astro.starPos;
        const [px, py, pz] = astro.planetPos;
        const off = astro.spawnOffset;
        const r0 = Math.max(Math.hypot(off[0], off[1], off[2]), 0.5);
        const v0 = ASTRO_LAUNCH * Math.sqrt((G * astro.starMass) / r0);
        let x = sx + off[0],
          y = sy + off[1],
          z = sz + off[2];
        let vx = (off[0] / r0) * v0,
          vy = (off[1] / r0) * v0,
          vz = (off[2] / r0) * v0;
        const M = astro.starMass,
          m = astro.planetMass,
          T = astro.thrust;
        const pts = [];
        for (let step = 0; step < 6000; step++) {
          const tsx = sx - x,
            tsy = sy - y,
            tsz = sz - z;
          const tpx = px - x,
            tpy = py - y,
            tpz = pz - z;
          const d2p = tpx * tpx + tpy * tpy + tpz * tpz;
          const distP = Math.max(Math.sqrt(d2p), 0.001);
          if (distP < astro.planetRadius) break;
          pts.push(x, y, z, vx, vy, vz);
          const r2s = tsx * tsx + tsy * tsy + tsz * tsz + eps2;
          const r2p = d2p + eps2;
          const is = 1 / Math.sqrt(r2s * r2s * r2s);
          const ip = 1 / Math.sqrt(r2p * r2p * r2p);
          const dpx = tpx / distP,
            dpy = tpy / distP,
            dpz = tpz / distP;
          const vAlong = vx * dpx + vy * dpy + vz * dpz;
          const ax =
            G * M * tsx * is +
            G * m * tpx * ip +
            dpx * T -
            (vx - vAlong * dpx) * ASTRO_STEER;
          const ay =
            G * M * tsy * is +
            G * m * tpy * ip +
            dpy * T -
            (vy - vAlong * dpy) * ASTRO_STEER;
          const az =
            G * M * tsz * is +
            G * m * tpz * ip +
            dpz * T -
            (vz - vAlong * dpz) * ASTRO_STEER;
          // Same-step Euler (position from the old velocity), matching
          // the default GPGPU ordering.
          x += vx * dt;
          y += vy * dt;
          z += vz * dt;
          vx += ax * dt;
          vy += ay * dt;
          vz += az * dt;
        }
        return pts;
      }

      function scenePetrovaLine() {
        zero();
        const sc = SCENES["petrova-line"];
        const v = pickPetrovaVariant();
        petrova.variant = v;
        petrova.clock = 0;
        petrova.arrivalGain = v.planet.arrivalGain;
        if (typeof petrovaScheduleReset === "function") petrovaScheduleReset();

        // Push the variant into the scene entry (see header comment).
        const astro = {
          starPos: [0, 0, 0],
          planetPos: v.planetPos.slice(),
          starMass: v.starMass,
          planetMass: v.planetMass,
          thrust: v.thrust,
          planetRadius: v.planetRadius,
          spawnOffset: v.spawnOffset.slice(),
          spawnRadius: v.spawnRadius,
        };
        sc.astrophage = astro;
        sc.palette = v.palette;
        sc.tint = makePetrovaTint(v.tint7);
        sc.caption = v.caption;
        const D = v.planetPos[0],
          H = v.planetPos[1];
        // 3/4 view: mostly along -Z so the arc (which lives in the XY
        // plane, rising from the pole) shows its full curve, with enough
        // X/Y offset that the dust neighbourhood gives parallax under
        // the director's orbit moves. Scaled with the planet distance.
        sc.camera = {
          pos: [0.12 * D, 0.46 * D, 1.8 * D],
          tgt: [0.5 * D, 0.5 * H + 4, 0],
          fov: 46,
        };
        sc.petrovaDeco = {
          star: {
            pos: [0, 0, 0],
            size: 12.0,
            disc: v.star.disc,
            limb: 3.6,
            color: v.star.color,
            limbColor: v.star.limb,
            limbGain: v.star.limbGain,
          },
          planet: {
            pos: v.planetPos.slice(),
            size: 8.0,
            disc: v.planet.disc,
            limb: 3.2,
            color: v.planet.color,
            limbColor: v.planet.limb,
            limbGain: v.planet.limbGain,
            arrivalColor: v.planet.arrival,
            arrivalGain: v.planet.arrivalGain,
            glowToward: [0, 0, 0],
          },
        };

        let i = 0;
        // Star anchor (kind 0). Its body mass only matters to the dust
        // orbits (K row 3 feels kind 0) and to the mass channel; the
        // astrophage feel `astro.starMass` through the uniform. The disc
        // you see is the decoration sprite — at rest the body itself
        // samples palette stop 0 (black) on the speed channel.
        const STAR_BODY_MASS = 1250.0;
        setBody(i++, 0, 0, 0, STAR_BODY_MASS, 0, 0, 0, 0.0);
        // Planet anchor (kind 1). Static: its K row is zero.
        setBody(i++, D, H, v.planetPos[2], 5.0, 0, 0, 0, 1.0);

        // Sparse neighbourhood (PETROVA_LINE.md §6.1): a few hundred
        // kind-3 dust bodies in a wide shell on slow circular orbits
        // about the star body, so the shell persists over a long dwell
        // and the speed channel gives them a dim ember colour instead of
        // black. They are in the pair loop, so the count stays small.
        const N_DUST = Math.min(400, Math.floor(MAX_BODIES * 0.06));
        const G0 = sc.physics.G;
        for (let k = 0; k < N_DUST && i < MAX_BODIES - 8; k++) {
          const r = 140 + 280 * Math.cbrt(rng());
          const cth = 2 * rng() - 1;
          const sth = Math.sqrt(1 - cth * cth);
          const ph = 2 * Math.PI * rng();
          const nx = sth * Math.cos(ph),
            ny = cth,
            nz = sth * Math.sin(ph);
          // Tangent = n × random, for an isotropic orbital plane.
          const hx = randn(),
            hy = randn(),
            hz = randn();
          let tx = ny * hz - nz * hy,
            ty = nz * hx - nx * hz,
            tz = nx * hy - ny * hx;
          const tl = Math.hypot(tx, ty, tz) || 1;
          tx /= tl;
          ty /= tl;
          tz /= tl;
          const vc = Math.sqrt((G0 * STAR_BODY_MASS) / r) * (0.9 + 0.2 * rng());
          setBody(
            i++,
            r * nx,
            r * ny,
            r * nz,
            0.001,
            vc * tx,
            vc * ty,
            vc * tz,
            3.0,
          );
        }

        // Astrophage (kind 7) fill the rest of the tier, pre-distributed
        // uniformly in time along the reference path (uniform-in-time is
        // the steady state of a constant-flux stream: dense where slow,
        // sparse where fast). Lateral scatter widens downstream to match
        // what the shader's launch jitter produces, and age = time since
        // launch so the pointVert ramp is consistent with a live respawn.
        const eps2 = sc.physics.softening * sc.physics.softening;
        const dtRef = sc.physics.dt;
        const pts = astroReferencePath(astro, G0, eps2, dtRef);
        petrova.path = pts;
        const nPts = Math.max(1, pts.length / 6);
        const ASTROPHAGE_RESERVE = 4;
        const N_ASTROPHAGE = Math.max(0, MAX_BODIES - ASTROPHAGE_RESERVE - i);
        for (let k = 0; k < N_ASTROPHAGE && i < MAX_BODIES; k++) {
          const idx = Math.min(nPts - 1, Math.floor(rng() * nPts));
          const frac = idx / nPts;
          const o = idx * 6;
          const vx = pts[o + 3],
            vy = pts[o + 4],
            vz = pts[o + 5];
          const sp = Math.hypot(vx, vy, vz) || 1;
          const ux = vx / sp,
            uy = vy / sp,
            uz = vz / sp;
          // Two axes perpendicular to the path tangent.
          const hy0 = Math.abs(uy) < 0.9 ? 1 : 0,
            hx0 = 1 - hy0;
          let b1x = uy * 0 - uz * hy0,
            b1y = uz * hx0 - ux * 0,
            b1z = ux * hy0 - uy * hx0;
          const bl = Math.hypot(b1x, b1y, b1z) || 1;
          b1x /= bl;
          b1y /= bl;
          b1z /= bl;
          const b2x = uy * b1z - uz * b1y,
            b2y = uz * b1x - ux * b1z,
            b2z = ux * b1y - uy * b1x;
          const sig = v.spawnRadius * (0.5 + 1.0 * frac);
          const l1 = randn() * sig,
            l2 = randn() * sig;
          const x = pts[o] + l1 * b1x + l2 * b2x;
          const y = pts[o + 1] + l1 * b1y + l2 * b2y;
          const z = pts[o + 2] + l1 * b1z + l2 * b2z;
          const vs = 1 + 0.1 * randn();
          const lv = 0.35 * (1 - frac);
          const w1 = randn() * lv,
            w2 = randn() * lv;
          const age = Math.min(0.9999, (idx * dtRef) / MAX_AGE);
          setBody(
            i++,
            x,
            y,
            z,
            0.001,
            vx * vs + w1 * b1x + w2 * b2x,
            vy * vs + w1 * b1y + w2 * b2y,
            vz * vs + w1 * b1z + w2 * b2z,
            7.0 + age,
          );
        }

        state.count = i;
      }

      // Per-scene tick (main loop, after updateSolarSystem; only while
      // petrova-line is the current scene and the intro is not active).
      // Cheap and GPU-free: the arrival glow pulses on the scene clock —
      // a proxy for the arrival rate, which is in fact steady in a
      // respawn loop — and the ship scheduler advances.
      function petrovaTick(realDt) {
        const dt = Math.min(realDt, 0.1);
        petrova.clock += dt;
        const t = petrova.clock;
        petrovaDecoArrival(
          petrova.arrivalGain *
            (0.78 + 0.17 * Math.sin(t * 0.85) + 0.05 * Math.sin(t * 6.7 + 1.3)),
        );
        if (typeof petrovaShipsTick === "function") petrovaShipsTick(dt);
      }
      // Cartwheel — ring galaxy. A compact intruder punches vertically
      // through a cold rotating disc; the radial crossing pulls disc
      // stars inward, then flings them back out in phase — an expanding
      // ring density wave with radial spokes. Nothing here authors a
      // ring; it emerges ~15–20 s in (impact ≈ 235/19 ≈ 12 sim-units).
      //
      // Fills the density tier like petrova-line does: more bodies =
      // the ring resolves from noise into a crisp wave, which is the
      // "structure needs N" argument from BARNES_HUT_PLAN.md made
      // visible. Velocities are analytic (enclosed-mass circular +
      // dispersion) — the milky-way style O(N²) JS force-sum pass
      // would take minutes at 65k+, so it is deliberately absent.
      function sceneCartwheel() {
        zero();
        const DISC_R = 150;
        // Nucleus is kind 5, not kind 2 — the shader gives kind 2 a
        // ×5 size bonus that reads as a crater (see sceneMilkyWay).
        const NUC_M = 9000;
        const DISC_M = 22000;
        const BULGE_M = 4000;
        const HALO_M = 1600;
        // ~0.28× the target's total mass — the sweet spot where the
        // ring reads clearly without shredding the whole disc.
        const INTR_CORE_M = 6500;
        const INTR_CLOUD_M = 3500;
        const SOFT = 3.0; // must match SCENES.cartwheel.physics.softening
        const EPS2 = SOFT * SOFT;
        // Enclosed mass matching the disc sampling law below
        // (r = R·u^0.7 → M(<r) ∝ (r/R)^(1/0.7)); softened point form
        // keeps v finite through the core.
        const vCirc = (r) => {
          const frac = Math.pow(Math.min(r / DISC_R, 1), 1 / 0.7);
          const mEnc = NUC_M + (DISC_M + BULGE_M) * frac;
          const v2 = (mEnc * r * r) / Math.pow(r * r + EPS2, 1.5);
          return Math.sqrt(Math.max(v2, 0));
        };
        let i = 0;
        setBody(i++, 0, 0, 0, NUC_M, 0, 0, 0, 5.0);

        const budget = MAX_BODIES - 1;
        const nDisc = Math.floor(budget * 0.62);
        const nBulge = Math.floor(budget * 0.12);
        const nHalo = Math.floor(budget * 0.1);
        const nIntr = Math.max(2, Math.floor(budget * 0.14));

        // ----- target disc (kind 5 — cool side of TINT_GALAXY) -----
        const mDisc = DISC_M / nDisc;
        for (let k = 0; k < nDisc && i < MAX_BODIES; k++) {
          const r = Math.max(6, DISC_R * Math.pow(rng(), 0.7));
          const phi = rng() * 2 * Math.PI;
          const x = r * Math.cos(phi);
          const z = r * Math.sin(phi);
          const y = randn() * 1.4;
          const v = vCirc(r);
          const disp = v * 0.08; // cold disc — the ring wants coherence
          setBody(
            i++,
            x,
            y,
            z,
            mDisc,
            -Math.sin(phi) * v + randn() * disp,
            randn() * disp * 0.25,
            Math.cos(phi) * v + randn() * disp,
            5.0,
          );
        }

        // ----- bulge (kind 5) — pressure-supported inner sphere -----
        const mBulge = BULGE_M / Math.max(nBulge, 1);
        const sigmaB = vCirc(18) * 0.35;
        for (let k = 0; k < nBulge && i < MAX_BODIES; k++) {
          const theta = Math.acos(2 * rng() - 1);
          const phi = rng() * 2 * Math.PI;
          const r = 4 + Math.pow(rng(), 0.8) * 16;
          setBody(
            i++,
            r * Math.sin(theta) * Math.cos(phi),
            r * Math.cos(theta) * 0.6,
            r * Math.sin(theta) * Math.sin(phi),
            mBulge,
            randn() * sigmaB,
            randn() * sigmaB * 0.6,
            randn() * sigmaB,
            5.0,
          );
        }

        // ----- stellar halo (kind 4) — faint context shell -----
        const mHalo = HALO_M / Math.max(nHalo, 1);
        for (let k = 0; k < nHalo && i < MAX_BODIES; k++) {
          const theta = Math.acos(2 * rng() - 1);
          const phi = rng() * 2 * Math.PI;
          const r = 170 + Math.pow(rng(), 0.6) * 250;
          const x = r * Math.sin(theta) * Math.cos(phi);
          const y = r * Math.cos(theta);
          const z = r * Math.sin(theta) * Math.sin(phi);
          const v = vCirc(Math.min(r, DISC_R)) * 0.5;
          // Tangential-ish: cross position with a random vector.
          const rx = randn();
          const ry = randn();
          const rz = randn();
          let tx = y * rz - z * ry;
          let ty = z * rx - x * rz;
          let tz = x * ry - y * rx;
          const tl = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1;
          tx = (tx / tl) * v;
          ty = (ty / tl) * v;
          tz = (tz / tl) * v;
          setBody(
            i++,
            x,
            y,
            z,
            mHalo,
            tx + randn() * v * 0.2,
            ty + randn() * v * 0.2,
            tz + randn() * v * 0.2,
            4.0,
          );
        }

        // ----- intruder (kind 6 — warm side) — inbound from above -----
        // Slight +X offset makes the hit off-centre → asymmetric ring
        // + spokes. Speed ≈ 1.15× escape from the combined mass at
        // start height, so it punches through and keeps going.
        const IX = 24;
        const IY = 235;
        const IVY = -19;
        setBody(i++, IX, IY, 0, INTR_CORE_M, 0, IVY, 0, 6.0);
        const nCloud = Math.max(1, nIntr - 1);
        const mCloud = INTR_CLOUD_M / nCloud;
        const sigmaI = Math.sqrt(INTR_CORE_M / 9) * 0.25;
        for (let k = 0; k < nCloud && i < MAX_BODIES; k++) {
          const theta = Math.acos(2 * rng() - 1);
          const phi = rng() * 2 * Math.PI;
          const r = 10 * Math.pow(rng(), 0.7);
          setBody(
            i++,
            IX + r * Math.sin(theta) * Math.cos(phi),
            IY + r * Math.cos(theta),
            r * Math.sin(theta) * Math.sin(phi),
            mCloud,
            randn() * sigmaI,
            IVY + randn() * sigmaI,
            randn() * sigmaI,
            6.0,
          );
        }

        state.count = i;
      }

      // Whirlpool — M51-class grand-design spiral, grown live. The
      // disc is seeded COLD and FEATURELESS (no authored arms, unlike
      // sceneMilkyWay's logarithmic placement); a companion galaxy on
      // a close prograde parabolic pass raises the two-armed tidal
      // response, plus the bridge and tail. The spiral is the physics
      // answering the flyby, not an initial condition.
      //
      // Timeline (dt 0.012, speed 1): approach 0–18 s, pericenter
      // ≈ 18 s at r ≈ 145, arms wind up 30–70 s (disc rotation period
      // at mid-radius ≈ 45 s), bridge + counter-tail after. Prograde
      // passages resonate with the disc rotation — that's what makes
      // two clean arms instead of a splash.
      //
      // Beauty knobs live in the registry entry: density channel (arm
      // crests ARE density crests, so the palette traces the spiral),
      // aurora palette, moderate trails, and a touch of doppler so
      // the approaching side glows.
      function sceneWhirlpool() {
        zero();
        const DISC_R = 130;
        const NUC_M = 15000; // kind 5 anchor (kind 2 gets the ×5 size bonus)
        const DISC_M = 9000; // nucleus-dominated → disc stays smooth until
        const BULGE_M = 2500; // the companion perturbs it (clean grand design)
        const HALO_M = 1200;
        const COMP_CORE_M = 4000; // ~0.23× the main galaxy — M51-ish ratio;
        const COMP_CLOUD_M = 2200; // strong tide without shredding the disc
        const SOFT = 2.5; // must match SCENES.whirlpool.physics.softening
        const EPS2 = SOFT * SOFT;
        // Enclosed mass matching the disc sampling law below
        // (r = R·u^0.75 → M(<r) ∝ (r/R)^(1/0.75)), softened point form.
        const vCirc = (r) => {
          const frac = Math.pow(Math.min(r / DISC_R, 1), 1 / 0.75);
          const mEnc = NUC_M + (DISC_M + BULGE_M) * frac;
          const v2 = (mEnc * r * r) / Math.pow(r * r + EPS2, 1.5);
          return Math.sqrt(Math.max(v2, 0));
        };
        let i = 0;
        setBody(i++, 0, 0, 0, NUC_M, 0, 0, 0, 5.0);

        const budget = MAX_BODIES - 2;
        const nDisc = Math.floor(budget * 0.64);
        const nDust = Math.floor(budget * 0.06);
        const nBulge = Math.floor(budget * 0.08);
        const nHalo = Math.floor(budget * 0.08);
        const nCloud = Math.max(1, Math.floor(budget * 0.14));

        // ----- main disc (kind 5 — cool side of TINT_GALAXY) -----
        // 5% dispersion: cold enough that the tidal wave stays coherent,
        // warm enough not to fragment before the companion arrives.
        const mDisc = DISC_M / nDisc;
        for (let k = 0; k < nDisc && i < MAX_BODIES; k++) {
          const r = Math.max(5, DISC_R * Math.pow(rng(), 0.75));
          const phi = rng() * 2 * Math.PI;
          const x = r * Math.cos(phi);
          const z = r * Math.sin(phi);
          const y = randn() * (1.2 + r * 0.006); // gentle outward flare
          const v = vCirc(r);
          const disp = v * 0.05;
          setBody(
            i++,
            x,
            y,
            z,
            mDisc,
            -Math.sin(phi) * v + randn() * disp,
            randn() * disp * 0.25,
            Math.cos(phi) * v + randn() * disp,
            5.0,
          );
        }

        // ----- dust lane sprinkle (kind 3) — texture along the disc -----
        const mDust = 0.15;
        for (let k = 0; k < nDust && i < MAX_BODIES; k++) {
          const r = Math.max(12, DISC_R * (0.25 + 0.75 * Math.pow(rng(), 0.6)));
          const phi = rng() * 2 * Math.PI;
          const v = vCirc(r);
          setBody(
            i++,
            r * Math.cos(phi),
            randn() * 0.8,
            r * Math.sin(phi),
            mDust,
            -Math.sin(phi) * v + randn() * v * 0.03,
            randn() * v * 0.01,
            Math.cos(phi) * v + randn() * v * 0.03,
            3.0,
          );
        }

        // ----- bulge (kind 5) — warm-bright core glow -----
        const mBulge = BULGE_M / Math.max(nBulge, 1);
        const sigmaB = vCirc(16) * 0.35;
        for (let k = 0; k < nBulge && i < MAX_BODIES; k++) {
          const theta = Math.acos(2 * rng() - 1);
          const phi = rng() * 2 * Math.PI;
          const r = 3 + Math.pow(rng(), 0.8) * 14;
          setBody(
            i++,
            r * Math.sin(theta) * Math.cos(phi),
            r * Math.cos(theta) * 0.55,
            r * Math.sin(theta) * Math.sin(phi),
            mBulge,
            randn() * sigmaB,
            randn() * sigmaB * 0.6,
            randn() * sigmaB,
            5.0,
          );
        }

        // ----- halo (kind 4) — sparse depth cue -----
        const mHalo = HALO_M / Math.max(nHalo, 1);
        for (let k = 0; k < nHalo && i < MAX_BODIES; k++) {
          const theta = Math.acos(2 * rng() - 1);
          const phi = rng() * 2 * Math.PI;
          const r = 160 + Math.pow(rng(), 0.6) * 240;
          const x = r * Math.sin(theta) * Math.cos(phi);
          const y = r * Math.cos(theta);
          const z = r * Math.sin(theta) * Math.sin(phi);
          const v = vCirc(Math.min(r, DISC_R)) * 0.5;
          const rx = randn();
          const ry = randn();
          const rz = randn();
          let tx = y * rz - z * ry;
          let ty = z * rx - x * rz;
          let tz = x * ry - y * rx;
          const tl = Math.sqrt(tx * tx + ty * ty + tz * tz) || 1;
          setBody(
            i++,
            x,
            y,
            z,
            mHalo,
            (tx / tl) * v + randn() * v * 0.2,
            (ty / tl) * v + randn() * v * 0.2,
            (tz / tl) * v + randn() * v * 0.2,
            4.0,
          );
        }

        // ----- companion (kind 6 — warm) on a prograde parabolic pass --
        // Parabolic speed at r=240 for M_main+M_comp ≈ 32 700; velocity
        // split so |r×v| targets pericenter ≈ 145 (just outside the
        // disc edge). Same angular-momentum sign as the disc = prograde.
        // Starts 40 above the plane, drifting down — it threads the
        // plane near pericenter, which gives the bridge its 3D sweep.
        const CX = 240;
        const CY = 40;
        const CVX = -10.3;
        const CVY = -0.8;
        const CVZ = 12.8;
        setBody(i++, CX, CY, 0, COMP_CORE_M, CVX, CVY, CVZ, 6.0);
        const mCloud = COMP_CLOUD_M / nCloud;
        const sigmaC = Math.sqrt(COMP_CORE_M / 13) * 0.3;
        for (let k = 0; k < nCloud && i < MAX_BODIES; k++) {
          const theta = Math.acos(2 * rng() - 1);
          const phi = rng() * 2 * Math.PI;
          const r = 13 * Math.pow(rng(), 0.7);
          setBody(
            i++,
            CX + r * Math.sin(theta) * Math.cos(phi),
            CY + r * Math.cos(theta),
            r * Math.sin(theta) * Math.sin(phi),
            mCloud,
            CVX + randn() * sigmaC,
            CVY + randn() * sigmaC,
            CVZ + randn() * sigmaC,
            6.0,
          );
        }

        state.count = i;
      }

      // ---- Passing ships (PASSING_SHIPS.md, interpretation B) ----------
      // The Hail Mary as an 18-node constellation rendered as its OWN
      // THREE.Points — not sim bodies: no kind, no GPGPU texture writes,
      // no density-tier slot. It is added to `scene`, so the Afterimage
      // pass trails it like everything else and the point look is the
      // same sprite as pointFrag. Node positions are computed on the CPU
      // each tick from a cubic Bézier cruise (§4) with the three-node
      // centrifuge rotating at 1 rev / 4 s (§5.1). Scheduling is owned
      // by the Petrova Line scene (PETROVA_LINE.md §5); ship-test parks
      // one at the origin so the silhouette can be judged in isolation.
      //
      // Local coords: +Z forward. [x, y, z, brightness, role]; role 0 =
      // hull (off-white), 1 = spin drive (IR-red), 2 = prow light
      // (pale-warm), 3 = centrifuge pod (hull colour, rotates about +Z).
      const HAIL_MARY_NODES = [
        [0, 0, 2.0, 2.0, 2], // nose / control deck
        [0.7, 0.0, 1.0, 1.5, 3], // centrifuge ring, 120° apart, r 0.7
        [-0.35, 0.606, 1.0, 1.5, 3],
        [-0.35, -0.606, 1.0, 1.5, 3],
        [0, 0, 0.4, 1.5, 0], // lab
        [0, 0, -0.2, 1.5, 0], // dorm
        [0, 0, -0.8, 1.5, 0], // storage
        [0, 0, -1.4, 1.5, 0], // junction
        [0, 0, -2.0, 2.5, 1], // spin drive cluster (engine glow)
        [0.4, 0, -2.4, 2.0, 1],
        [-0.4, 0, -2.4, 2.0, 1],
        [0, 0.4, -2.4, 2.0, 1],
        [0, -0.4, -2.4, 2.0, 1],
        [0, 0, -2.8, 2.5, 1],
        [0.6, 0.8, 1.2, 0.8, 0], // antennae / sensors
        [-0.6, 0.8, 1.2, 0.8, 0],
        [0.6, -0.8, 1.2, 0.8, 0],
        [-0.6, -0.8, 1.2, 0.8, 0],
      ];
      const SHIP_ROLE_COLOR = [
        [1.0, 0.95, 0.86], // hull: off-white / gunmetal
        [1.5, 0.28, 0.14], // spin drive: IR-red
        [1.3, 1.22, 1.0], // prow: single steady pale-warm light
        [1.0, 0.95, 0.86], // centrifuge pods
      ];
      const SHIP_N = HAIL_MARY_NODES.length;
      const SHIP_CENTRIFUGE_PERIOD = 4.0; // seconds per revolution

      const shipGeom = new THREE.BufferGeometry();
      shipGeom.setAttribute(
        "position",
        new THREE.BufferAttribute(new Float32Array(SHIP_N * 3), 3),
      );
      shipGeom.setAttribute(
        "aBright",
        new THREE.BufferAttribute(new Float32Array(SHIP_N), 1),
      );
      shipGeom.setAttribute(
        "aColor",
        new THREE.BufferAttribute(new Float32Array(SHIP_N * 3), 3),
      );
      {
        const b = shipGeom.getAttribute("aBright").array;
        const c = shipGeom.getAttribute("aColor").array;
        for (let n = 0; n < SHIP_N; n++) {
          const node = HAIL_MARY_NODES[n];
          b[n] = node[3];
          const col = SHIP_ROLE_COLOR[node[4]] || SHIP_ROLE_COLOR[0];
          c[n * 3 + 0] = col[0];
          c[n * 3 + 1] = col[1];
          c[n * 3 + 2] = col[2];
        }
      }
      const shipMat = new THREE.ShaderMaterial({
        uniforms: {
          uOpacity: { value: 0.0 },
          uPointScale: { value: 2.0 },
          uPointMax: { value: 96.0 * renderer.getPixelRatio() },
        },
        vertexShader: /* glsl */ `
          uniform float uOpacity;
          uniform float uPointScale;
          uniform float uPointMax;
          attribute float aBright;
          attribute vec3 aColor;
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mv;
            float sz = uPointScale * (0.55 + aBright * 0.7) * (320.0 / max(-mv.z, 1.0));
            gl_PointSize = min(sz, uPointMax);
            vColor = aColor * (0.6 + 0.4 * aBright);
            vAlpha = uOpacity;
          }
        `,
        fragmentShader: pointFrag, // same sprite as the bodies
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        depthTest: false,
      });
      const shipPoints = new THREE.Points(shipGeom, shipMat);
      shipPoints.frustumCulled = false;
      shipPoints.visible = false;
      scene.add(shipPoints);

      const ship = {
        active: false,
        parked: false,
        t: 0,
        dur: 14,
        spin: 0, // centrifuge clock (s)
        phase: 0, // centrifuge phase at spawn (rad)
        scale: 1.3, // local units → world; ~7 world units long
        fade: 1.5, // s of fade at each end of a cruise
        P: [
          new THREE.Vector3(),
          new THREE.Vector3(),
          new THREE.Vector3(),
          new THREE.Vector3(),
        ],
        lut: new Float32Array(65), // cumulative arc length at t = k/64
        upRef: new THREE.Vector3(0, 1, 0),
        seed: 0,
      };
      const _shipPos = new THREE.Vector3();
      const _shipTan = new THREE.Vector3();
      const _shipRight = new THREE.Vector3();
      const _shipUp = new THREE.Vector3();
      const _shipTmp = new THREE.Vector3();
      const _shipTmp2 = new THREE.Vector3();

      function shipBezier(out, t) {
        const [p0, p1, p2, p3] = ship.P;
        const mt = 1 - t;
        const a = mt * mt * mt,
          b = 3 * mt * mt * t,
          c = 3 * mt * t * t,
          d = t * t * t;
        return out.set(
          a * p0.x + b * p1.x + c * p2.x + d * p3.x,
          a * p0.y + b * p1.y + c * p2.y + d * p3.y,
          a * p0.z + b * p1.z + c * p2.z + d * p3.z,
        );
      }
      function shipBezierTangent(out, t) {
        const [p0, p1, p2, p3] = ship.P;
        const mt = 1 - t;
        const a = 3 * mt * mt,
          b = 6 * mt * t,
          c = 3 * t * t;
        return out.set(
          a * (p1.x - p0.x) + b * (p2.x - p1.x) + c * (p3.x - p2.x),
          a * (p1.y - p0.y) + b * (p2.y - p1.y) + c * (p3.y - p2.y),
          a * (p1.z - p0.z) + b * (p2.z - p1.z) + c * (p3.z - p2.z),
        );
      }
      // Constant arc-length parameterisation (§4.2): cumulative length
      // table, then invert for a fraction of the total.
      function shipBuildLut() {
        const lut = ship.lut;
        lut[0] = 0;
        shipBezier(_shipTmp, 0);
        for (let k = 1; k <= 64; k++) {
          shipBezier(_shipTmp2, k / 64);
          lut[k] = lut[k - 1] + _shipTmp2.distanceTo(_shipTmp);
          _shipTmp.copy(_shipTmp2);
        }
      }
      function shipLutT(u) {
        const lut = ship.lut;
        const target = clamp(u, 0, 1) * lut[64];
        let lo = 0,
          hi = 64;
        while (hi - lo > 1) {
          const mid = (lo + hi) >> 1;
          if (lut[mid] < target) lo = mid;
          else hi = mid;
        }
        const span = lut[hi] - lut[lo];
        const f = span > 1e-6 ? (target - lut[lo]) / span : 0;
        return (lo + f) / 64;
      }

      // Pose the constellation at world position `pos` heading along
      // unit `fwd`; write all 18 vertices. Up = camera up projected
      // perpendicular to forward (§4.4) so the centrifuge reads as a
      // ring from wherever the camera is. Banking is not implemented.
      function shipWritePose(pos, fwd) {
        _shipUp.copy(ship.upRef);
        _shipRight.crossVectors(fwd, _shipUp);
        if (_shipRight.lengthSq() < 1e-6) {
          _shipRight.crossVectors(fwd, new THREE.Vector3(1, 0, 0));
        }
        _shipRight.normalize();
        _shipUp.crossVectors(_shipRight, fwd).normalize();
        const arr = shipGeom.getAttribute("position").array;
        const ang =
          ship.phase + (2 * Math.PI * ship.spin) / SHIP_CENTRIFUGE_PERIOD;
        const ca = Math.cos(ang),
          sa = Math.sin(ang);
        const s = ship.scale;
        for (let n = 0; n < SHIP_N; n++) {
          const node = HAIL_MARY_NODES[n];
          let lx = node[0],
            ly = node[1];
          const lz = node[2];
          if (node[4] === 3) {
            // Centrifuge pods rotate about the local +Z spine.
            const rx = lx * ca - ly * sa;
            const ry = lx * sa + ly * ca;
            lx = rx;
            ly = ry;
          }
          arr[n * 3 + 0] =
            pos.x + s * (_shipRight.x * lx + _shipUp.x * ly + fwd.x * lz);
          arr[n * 3 + 1] =
            pos.y + s * (_shipRight.y * lx + _shipUp.y * ly + fwd.y * lz);
          arr[n * 3 + 2] =
            pos.z + s * (_shipRight.z * lx + _shipUp.z * ly + fwd.z * lz);
        }
        shipGeom.getAttribute("position").needsUpdate = true;
      }

      function shipEnd() {
        if (!ship.active) return;
        ship.active = false;
        ship.parked = false;
        shipPoints.visible = false;
        shipMat.uniforms.uOpacity.value = 0.0;
      }

      // Park a rotating ship at `pos` (ship-test legibility check).
      function shipPark(pos, fwd) {
        ship.active = true;
        ship.parked = true;
        ship.t = 0;
        ship.spin = 0;
        ship.phase = 0;
        ship.P[0].fromArray(pos);
        ship.P[3].fromArray(fwd);
        ship.upRef.set(0, 1, 0);
        shipPoints.visible = true;
        shipMat.uniforms.uOpacity.value = 1.0;
      }

      // Spawn a cruise (§4): a Bézier through `through` (world), crossing
      // the screen plane at an angle to `avoidDir` (the beam axis) so the
      // ship cuts across the migration instead of riding it. Endpoints
      // sit outside the frustum; two control points jittered ~10 %.
      function shipSpawn(through, avoidDir) {
        camera.updateMatrixWorld();
        const right = new THREE.Vector3().setFromMatrixColumn(
          camera.matrixWorld,
          0,
        );
        const up = new THREE.Vector3().setFromMatrixColumn(
          camera.matrixWorld,
          1,
        );
        const fwdCam = new THREE.Vector3()
          .setFromMatrixColumn(camera.matrixWorld, 2)
          .negate();
        // Frame extent at the crossing point's depth.
        const depth = Math.max(
          10,
          _shipTmp.copy(through).sub(camera.position).dot(fwdCam),
        );
        const frameH = 2 * depth * Math.tan((camera.fov * Math.PI) / 360);
        const frameW = frameH * camera.aspect;
        // Cruise direction in the screen plane, 40°–140° off screen-right
        // (either sign), rejecting anything within 35° of the beam axis.
        let dir = new THREE.Vector3();
        for (let tries = 0; tries < 8; tries++) {
          const th =
            ((40 + 100 * Math.random()) * Math.PI) / 180 +
            (Math.random() < 0.5 ? Math.PI : 0);
          dir
            .copy(right)
            .multiplyScalar(Math.cos(th))
            .addScaledVector(up, Math.sin(th))
            .normalize();
          if (!avoidDir || Math.abs(dir.dot(avoidDir)) < Math.cos(Math.PI / 5))
            break;
        }
        const L = 0.8 * Math.max(frameW, frameH);
        ship.P[0].copy(through).addScaledVector(dir, -L);
        ship.P[3].copy(through).addScaledVector(dir, L);
        // Slight depth change along the cruise so it isn't perfectly flat.
        const dz = (Math.random() - 0.5) * 0.3 * L;
        ship.P[0].addScaledVector(fwdCam, -dz);
        ship.P[3].addScaledVector(fwdCam, dz);
        // Control points: thirds of the chord, jittered ±10 % of L
        // perpendicular to the cruise direction.
        const perp = new THREE.Vector3().crossVectors(dir, fwdCam).normalize();
        const j1 = (Math.random() - 0.5) * 0.2 * L;
        const j2 = (Math.random() - 0.5) * 0.2 * L;
        ship.P[1]
          .copy(ship.P[0])
          .lerp(ship.P[3], 1 / 3)
          .addScaledVector(perp, j1);
        ship.P[2]
          .copy(ship.P[0])
          .lerp(ship.P[3], 2 / 3)
          .addScaledVector(perp, j2);
        shipBuildLut();
        // Speed: about half a frame width per 5 s (§4.3), 10–20 s total.
        const len = ship.lut[64];
        ship.dur = clamp(len / (frameW / 10), 10, 20);
        ship.t = 0;
        ship.spin = 0;
        ship.phase = Math.random() * Math.PI * 2;
        ship.upRef.copy(up);
        ship.seed = (Math.random() * 0xffffffff) >>> 0;
        ship.active = true;
        ship.parked = false;
        shipPoints.visible = true;
        shipMat.uniforms.uOpacity.value = 0.0;
        shipMat.uniforms.uPointScale.value =
          pointMat.uniforms.uPointScale.value;
        shipTick(0);
      }

      function shipTick(realDt) {
        if (!ship.active) return;
        const dt = Math.min(realDt, 0.1);
        ship.t += dt;
        ship.spin += dt;
        if (ship.parked) {
          _shipTan.copy(ship.P[3]).normalize();
          shipWritePose(ship.P[0], _shipTan);
          return;
        }
        if (ship.t >= ship.dur) {
          shipEnd();
          return;
        }
        const bt = shipLutT(ship.t / ship.dur);
        shipBezier(_shipPos, bt);
        shipBezierTangent(_shipTan, bt).normalize();
        shipWritePose(_shipPos, _shipTan);
        const fin = clamp(ship.t / ship.fade, 0, 1);
        const fout = clamp((ship.dur - ship.t) / ship.fade, 0, 1);
        shipMat.uniforms.uOpacity.value = Math.min(fin, fout);
      }

      // ---- Petrova Line ship scheduler (PETROVA_LINE.md §5.1) ----------
      // Scene-local, clocked on time-in-scene: hard floor of 4 min plus
      // an exponential tail with mean 10 min. `?ship=hail-mary` forces a
      // sighting shortly after scene init; `?rehearse=ships` fires one
      // every 8 s (note: ?rehearse also puts the director in 10× rehearsal
      // mode, so pair it with cinematic off for long tuning sessions).
      function sampleSightingDelay() {
        return 4 * 60 + -Math.log(1 - Math.random()) * 10 * 60;
      }
      function petrovaScheduleReset() {
        shipEnd();
        let qs = null;
        try {
          qs = new URLSearchParams(location.search);
        } catch (_) {}
        petrova.rehearseShips = !!qs && qs.get("rehearse") === "ships";
        const forced = qs ? qs.get("ship") : null;
        if (forced) petrova.nextSighting = 2.5;
        else if (petrova.rehearseShips) petrova.nextSighting = 3.0;
        else petrova.nextSighting = sampleSightingDelay();
      }
      function petrovaShipsTick(dt) {
        shipTick(dt);
        if (ship.active) return;
        if (petrova.clock < petrova.nextSighting) return;
        // Only while the director dwells (or is off) and no transition
        // is in flight — otherwise re-check next frame.
        if (director.enabled && director.state !== "DWELL") return;
        if (transitionRaf) return;
        // Cross the beam (§4.1): a point on the reference path between
        // 30 % and 75 % of the transit.
        const pts = petrova.path;
        const through = new THREE.Vector3();
        let beamDir = null;
        if (pts && pts.length >= 12) {
          const n = pts.length / 6;
          const k = Math.floor(n * (0.3 + 0.45 * Math.random()));
          through.set(pts[k * 6], pts[k * 6 + 1], pts[k * 6 + 2]);
          beamDir = new THREE.Vector3(
            pts[k * 6 + 3],
            pts[k * 6 + 4],
            pts[k * 6 + 5],
          );
          if (beamDir.lengthSq() > 1e-6) beamDir.normalize();
          else beamDir = null;
        }
        shipSpawn(through, beamDir);
        petrova.nextSighting =
          petrova.clock + (petrova.rehearseShips ? 8 : sampleSightingDelay());
        if (typeof dlog === "function") {
          dlog("ship", {
            archetype: "hail-mary",
            seed: ship.seed,
            variant: petrova.variant ? petrova.variant.key : null,
            dur: +ship.dur.toFixed(1),
          });
        }
      }

      // Ship-test scene (PASSING_SHIPS.md §10 step 2): the static Hail
      // Mary constellation as sim bodies on the left (mass channel, no
      // gravity: physics.G = 0) and the live animated Points ship parked
      // on the right with its centrifuge turning. Registered in SCENES
      // for ?scene=ship-test but deliberately absent from SCENE_ORDER.
      function sceneShipTest() {
        zero();
        let i = 0;
        const SHIP_SCALE = 1.3;
        for (const [lx, ly, lz, m] of HAIL_MARY_NODES) {
          if (i >= MAX_BODIES) break;
          setBody(
            i++,
            -9 + lx * SHIP_SCALE,
            ly * SHIP_SCALE,
            lz * SHIP_SCALE,
            m,
            0,
            0,
            0,
            0.0, // kind 0 — renders like a star
          );
        }
        state.count = i;
        shipPark([9, 0, 0], [0, 0, 1]);
      }
      function shipTestTick(realDt) {
        shipTick(realDt);
      }
      function sceneDustStorm() {
        zero();
        // ~8 heavy attractors scattered, ~95% dust
        const heavyCount = 8;
        const R = 340;
        let i = 0;
        for (let h = 0; h < heavyCount; h++) {
          const phi = (h / heavyCount) * 2 * Math.PI + rng() * 0.6;
          const r = R * 0.55 * (0.6 + rng() * 0.4);
          setBody(
            i++,
            r * Math.cos(phi),
            randn() * R * 0.15,
            r * Math.sin(phi),
            600 + rng() * 1200,
            randn() * 0.4,
            randn() * 0.2,
            randn() * 0.4,
            2.0,
          );
        }
        const curl = makeCurlNoise(rng() * 5 + 1);
        for (; i < MAX_BODIES; i++) {
          const dir = new THREE.Vector3(
            randn(),
            randn() * 0.3,
            randn(),
          ).normalize();
          const r = R * Math.pow(rng(), 0.5);
          const p = dir.multiplyScalar(r);
          const [cvx, cvy, cvz] = curl(p.x, p.y, p.z);
          setBody(
            i,
            p.x,
            p.y,
            p.z,
            0.3 + rng() * 0.8,
            cvx * 4.5 + randn() * 0.6,
            cvy * 2.5 + randn() * 0.3,
            cvz * 4.5 + randn() * 0.6,
            3.0,
          );
        }
        state.count = MAX_BODIES;
      }

      function sceneOrrery() {
        zero();
        setBody(0, 0, 0, 0, 8000.0, 0, 0, 0, 2.0);
        const planets = [
          { r: 30, m: 0.4 },
          { r: 45, m: 0.9 },
          { r: 60, m: 1.0 },
          { r: 80, m: 0.6 },
          { r: 120, m: 50.0 },
          { r: 160, m: 40.0 },
          { r: 210, m: 18.0 },
          { r: 260, m: 17.0 },
        ];
        let i = 1;
        for (const p of planets) {
          const phi = rng() * 2 * Math.PI;
          const v = Math.sqrt(8000.0 / p.r);
          setBody(
            i++,
            p.r * Math.cos(phi),
            0,
            p.r * Math.sin(phi),
            p.m,
            -Math.sin(phi) * v,
            0,
            Math.cos(phi) * v,
            1.0,
          );
        }
        for (; i < 560; i++) {
          const r = 85 + rng() * 25;
          const phi = rng() * 2 * Math.PI;
          const v = Math.sqrt(8000.0 / r);
          const z = randn() * 1.5;
          setBody(
            i,
            r * Math.cos(phi),
            z,
            r * Math.sin(phi),
            0.05 + rng() * 0.2,
            -Math.sin(phi) * v,
            0,
            Math.cos(phi) * v,
            3.0,
          );
        }
        state.count = i;
      }

      function sceneLattice() {
        zero();
        // 3D grid of bodies with tiny random perturbations
        const side = 14; // 14^3 = 2744
        const spacing = 40;
        const total = side * side * side;
        const origin = -(side - 1) * spacing * 0.5;
        let i = 0;
        for (let ix = 0; ix < side; ix++) {
          for (let iy = 0; iy < side; iy++) {
            for (let iz = 0; iz < side; iz++) {
              if (i >= MAX_BODIES) break;
              const x = origin + ix * spacing + randn() * 1.5;
              const y = origin + iy * spacing + randn() * 1.5;
              const z = origin + iz * spacing + randn() * 1.5;
              setBody(
                i++,
                x,
                y,
                z,
                1.5 + rng() * 0.8,
                randn() * 0.2,
                randn() * 0.2,
                randn() * 0.2,
                0.0,
              );
            }
          }
        }
        state.count = Math.min(i, MAX_BODIES);
      }

      // ---- Pack A: no new primitives ----

      // Stephan's Quintet — 4 galaxies in a loose mutual orbit + 1 intruder
      // flying through at higher velocity.
      function sceneStephansQuintet() {
        zero();
        const perGalaxy = Math.floor((MAX_BODIES - 16) / 5);
        // Y-shape: three centres near a plane, one offset, one incoming
        const galaxies = [
          {
            cx: 0,
            cy: 0,
            cz: 0,
            vx: randn() * 0.8,
            vy: randn() * 0.3,
            vz: randn() * 0.8,
            r: 72,
            m: 4200,
          },
          {
            cx: 140,
            cy: 20,
            cz: 30,
            vx: -randn() * 0.8,
            vy: randn() * 0.3,
            vz: -randn() * 0.6,
            r: 66,
            m: 3800,
          },
          {
            cx: 60,
            cy: -40,
            cz: -110,
            vx: randn() * 0.6,
            vy: randn() * 0.2,
            vz: randn() * 0.8,
            r: 74,
            m: 4400,
          },
          {
            cx: -95,
            cy: 55,
            cz: 60,
            vx: randn() * 0.6,
            vy: randn() * 0.2,
            vz: -randn() * 0.4,
            r: 68,
            m: 3900,
          },
          // intruder — flying in from the right at 3× dispersion velocity
          {
            cx: 420,
            cy: 0,
            cz: -20,
            vx: -9.0,
            vy: randn() * 0.3,
            vz: 2.0,
            r: 60,
            m: 4800,
          },
        ];
        let i = 0;
        for (let g = 0; g < galaxies.length; g++) {
          const gl = galaxies[g];
          i = makeSpiralGalaxyCore(
            gl.cx,
            gl.cy,
            gl.cz,
            gl.vx,
            gl.vy,
            gl.vz,
            perGalaxy,
            gl.r,
            gl.m,
            i,
            g % 2 === 0 ? +1 : -1,
          );
        }
        state.count = i;
      }

      // Coma Cluster — ~40 tight elliptical blobs in a big gaussian cloud.
      function sceneComa() {
        zero();
        const nGalaxies = 40;
        const spread = 520;
        const perGalaxy = Math.floor((MAX_BODIES - 32) / nGalaxies);
        let i = 0;
        for (let g = 0; g < nGalaxies; g++) {
          // Anisotropic gaussian: slightly squashed along y (cluster looks flatter)
          const cx = randn() * spread;
          const cy = randn() * spread * 0.6;
          const cz = randn() * spread;
          // Small mutual velocity dispersion
          const vx = randn() * 1.2;
          const vy = randn() * 0.6;
          const vz = randn() * 1.2;
          // Mass drawn from a rough Schechter-ish spread — few big, many small
          const mag = 0.4 + Math.pow(rng(), 2.2) * 0.9;
          const radius = 14 + mag * 18;
          const bhMass = 600 * Math.pow(mag, 1.5);
          i = makeElliptical(
            i,
            perGalaxy,
            cx,
            cy,
            cz,
            vx,
            vy,
            vz,
            radius,
            bhMass,
            0.0,
          );
        }
        state.count = i;
      }

      // Virgo M87 — one massive BH with a collimated jet + ~12 satellite galaxies.
      function sceneVirgoM87() {
        zero();
        const BH_MASS = 60000;
        // Central BH
        setBody(0, 0, 0, 0, BH_MASS, 0, 0, 0, 2.0);
        let i = 1;
        // Jet (~350 bodies total)
        i = addBipolarJet(i, 0, 0, 0, 0, 0, 0, BH_MASS, {
          perSide: 180,
          rMin: 4,
          rMax: 260,
          e0: 100,
          halfAngle: 0.06,
        });
        // Satellite galaxies in a loose cloud around M87
        const remaining = MAX_BODIES - i;
        const nSats = 12;
        const perSat = Math.floor(remaining / nSats);
        for (let s = 0; s < nSats; s++) {
          // Orbit radius 250–600 from the giant BH
          const r = 250 + rng() * 350;
          const theta = Math.acos(2 * rng() - 1);
          const phi = rng() * 2 * Math.PI;
          const cx = r * Math.sin(theta) * Math.cos(phi);
          const cy = r * Math.cos(theta) * 0.6;
          const cz = r * Math.sin(theta) * Math.sin(phi);
          // Circular-ish velocity around BH
          const vCirc = Math.sqrt(BH_MASS / r) * (0.6 + rng() * 0.4);
          const tx = -Math.sin(phi);
          const tz = Math.cos(phi);
          const vx = tx * vCirc;
          const vy = randn() * vCirc * 0.1;
          const vz = tz * vCirc;
          // Small spiral galaxy: ~200 bodies per satellite
          i = makeSpiralGalaxyCore(
            cx,
            cy,
            cz,
            vx,
            vy,
            vz,
            Math.min(perSat, 220),
            22 + rng() * 10,
            400 + rng() * 500,
            i,
            rng() < 0.5 ? +1 : -1,
          );
        }
        state.count = i;
      }

      // ---- Pack B: one primitive each ----

      // Sombrero — one edge-on spiral with an unusually thick dust lane.
      function sceneSombrero() {
        zero();
        const BH_MASS = 14000;
        const diskR = 160;
        const dustBudget = 2000;
        const stellarBudget = MAX_BODIES - dustBudget - 1;

        // Use the existing spiral-core factory for the stellar disk
        let i = makeSpiralGalaxyCore(
          0,
          0,
          0,
          0,
          0,
          0,
          stellarBudget,
          diskR,
          BH_MASS,
          0,
          +1,
        );

        // Layer a thick equatorial dust lane over the disk plane.
        // Curl-noise velocity field makes it swirl rather than just sit still.
        const curl = makeCurlNoise(rng() * 5 + 1);
        const laneThickness = 6.0; // keep |y| < ±6 for Sombrero's iconic band
        for (let k = 0; k < dustBudget && i < MAX_BODIES; k++) {
          const r = diskR * (0.18 + Math.pow(rng(), 0.6) * 0.85);
          const phi = rng() * 2 * Math.PI;
          const y = randn() * laneThickness * 0.3;
          const px = r * Math.cos(phi);
          const pz = r * Math.sin(phi);
          const vCirc = Math.sqrt(BH_MASS / Math.max(r, 1)) * 0.97;
          const [cvx, cvy, cvz] = curl(px, y, pz);
          setBody(
            i++,
            px,
            y,
            pz,
            0.08 + rng() * 0.12,
            -Math.sin(phi) * vCirc + cvx * 0.15 + randn() * 0.3,
            cvy * 0.15 + randn() * 0.08,
            Math.cos(phi) * vCirc + cvz * 0.15 + randn() * 0.3,
            3.0,
          );
        }
        state.count = i;
      }

      // Antennae — the "prograde" collision scenario, but run forward on GPU
      // for ~300 frames before the first render so tidal tails are already
      // extended at t=0.
      function sceneAntennae() {
        zero();
        // Set up the collision geometry using the Antennae scenario's params
        const s = COLLISION_SCENARIOS["Antennae (prograde)"];
        const prev = { ...collision };
        Object.assign(collision, s);
        collision.scenario = "Antennae (prograde)";
        collision.galaxyMassB = collision.galaxyMassA * collision.massRatio;

        // Build the two galaxies via the existing factory
        const mA = collision.galaxyMassA;
        const mB = collision.galaxyMassB;
        const M = mA + mB;
        const d = collision.initialSep;
        const b = collision.impactParam;
        const xA = -d * (mB / M);
        const xB = +d * (mA / M);
        const zA = +b * (mB / M);
        const zB = -b * (mA / M);
        const v = collision.approachVel;
        const vxA = +v * (mB / M);
        const vxB = -v * (mA / M);
        const budgetA = Math.floor(MAX_BODIES / 2);
        const budgetB = MAX_BODIES - budgetA;
        buildGalaxy(
          0,
          budgetA,
          xA,
          0,
          zA,
          vxA,
          0,
          0,
          collision.diskRadiusA,
          collision.inclinationA,
          collision.azimuthA,
          collision.spinA,
          mA,
          0,
        );
        const end = buildGalaxy(
          budgetA,
          budgetB,
          xB,
          0,
          zB,
          vxB,
          0,
          0,
          collision.diskRadiusB,
          collision.inclinationB,
          collision.azimuthB,
          collision.spinB,
          mB,
          1,
        );
        state.count = end;

        Object.assign(collision, prev);

        // Signal to the apply path that a kickstart should happen after upload
        state._kickstartFrames = 320;
      }

      // Bullet Cluster — two clusters that already passed through each other.
      // Dark-matter halos are offset from their stellar components along the
      // velocity axis: the gas stopped, the halos kept going.
      function sceneBulletCluster() {
        zero();
        const totalMass = 28000;
        const stellarMassA = totalMass * 0.3;
        const stellarMassB = totalMass * 0.3;
        const haloMassA = totalMass * 0.7;
        const haloMassB = totalMass * 0.7;

        const stellarBudget = Math.floor(MAX_BODIES * 0.45);
        const haloBudget = MAX_BODIES - stellarBudget;
        const perStellarSide = Math.floor(stellarBudget / 2);
        const perHaloSide = Math.floor(haloBudget / 2);

        // Geometry: two centres left+right; halos offset further outward
        const sep = 280;
        const haloOffset = 110;
        // Residual velocity — halos still moving outward
        const vHaloA = [-1.4, 0, 0];
        const vHaloB = [+1.4, 0, 0];
        const vStellarA = [-0.3, 0, 0]; // slowed by ram pressure
        const vStellarB = [+0.3, 0, 0];

        let i = 0;
        // Stellar A (uses buildGalaxy; we ignore its halo by giving it zero mass)
        // Simplest path: place a shallow elliptical + BH with kind 5 (galaxy A).
        i = makeElliptical(
          i,
          perStellarSide,
          -sep * 0.5,
          0,
          0,
          vStellarA[0],
          vStellarA[1],
          vStellarA[2],
          90,
          stellarMassA * 0.15,
          5.0,
        );
        i = makeElliptical(
          i,
          perStellarSide,
          +sep * 0.5,
          0,
          0,
          vStellarB[0],
          vStellarB[1],
          vStellarB[2],
          90,
          stellarMassB * 0.15,
          6.0,
        );
        // Halos offset further outward along each cluster's motion
        i = addHaloCloud(
          i,
          perHaloSide,
          -sep * 0.5 - haloOffset,
          0,
          0,
          vHaloA[0],
          vHaloA[1],
          vHaloA[2],
          140,
          haloMassA,
        );
        i = addHaloCloud(
          i,
          perHaloSide,
          +sep * 0.5 + haloOffset,
          0,
          0,
          vHaloB[0],
          vHaloB[1],
          vHaloB[2],
          140,
          haloMassB,
        );
        state.count = i;
      }

      // Horsehead Nebula (Barnard 33) — dark dust cloud silhouetted against
      // the bright emission nebula IC 434.  Evocation, not reproduction:
      // foreground dust (kind 3, very low mass) reads black on ember+mass,
      // a dense background starfield emits the orange glow, and a subtle
      // head-bulge at the top of the dust cloud evokes the silhouette.
      // Gentle physics + custom K matrix hold the shape over long dwells.
      function sceneHorsehead() {
        zero();
        let i = 0;

        // --- IC 434 equivalent: bright background emission field ---
        // Positioned mostly behind the dust (z < 0).  Mass range lands these
        // bodies in the red/orange stops of the ember palette on the mass channel.
        const bgCount = 4200;
        for (let k = 0; k < bgCount && i < MAX_BODIES; k++) {
          const x = randn() * 150 + (rng() - 0.5) * 80;
          const y = randn() * 120 + 15;
          const z = -30 - rng() * 200;
          // Heavy tail so a few bodies pop as "hotspots"
          const m = 2.8 + Math.pow(rng(), 2.3) * 16.0;
          setBody(
            i++,
            x,
            y,
            z,
            m,
            randn() * 0.06,
            randn() * 0.06,
            randn() * 0.06,
            0.0,
          );
        }

        // --- Barnard 33 foreground dust ---
        const dustBudget = Math.min(3800, MAX_BODIES - i);
        const curl = makeCurlNoise(rng() * 5 + 1);

        // Main body (neck + jaw): tall oblong, slight forward tilt
        const bodyN = Math.floor(dustBudget * 0.7);
        const bodyCenter = { x: 0, y: -5, z: 10 };
        const bodyRadii = { x: 22, y: 56, z: 18 };
        for (let k = 0; k < bodyN && i < MAX_BODIES; k++) {
          const theta = Math.acos(2 * rng() - 1);
          const phi = rng() * 2 * Math.PI;
          const rr = Math.pow(rng(), 1.35);
          const px =
            bodyCenter.x + rr * Math.sin(theta) * Math.cos(phi) * bodyRadii.x;
          const py = bodyCenter.y + rr * Math.cos(theta) * bodyRadii.y;
          const pz =
            bodyCenter.z + rr * Math.sin(theta) * Math.sin(phi) * bodyRadii.z;
          const [cvx, cvy, cvz] = curl(px * 0.8, py * 0.8, pz * 0.8);
          setBody(
            i++,
            px,
            py,
            pz,
            0.04 + rng() * 0.09,
            cvx * 0.18,
            cvy * 0.18,
            cvz * 0.18,
            3.0,
          );
        }

        // Head bulge: smaller cluster offset upward and outward (toward -x,
        // the silhouette's "nose" side in the canonical astrophoto orientation)
        const headN = dustBudget - bodyN;
        const headCenter = { x: -14, y: 68, z: 4 };
        const headRadii = { x: 18, y: 22, z: 15 };
        for (let k = 0; k < headN && i < MAX_BODIES; k++) {
          const dir = new THREE.Vector3(randn(), randn(), randn()).normalize();
          const rr = Math.abs(randn()) * 0.88;
          const px = headCenter.x + dir.x * rr * headRadii.x;
          const py = headCenter.y + dir.y * rr * headRadii.y;
          const pz = headCenter.z + dir.z * rr * headRadii.z;
          const [cvx, cvy, cvz] = curl(px * 0.8, py * 0.8, pz * 0.8);
          setBody(
            i++,
            px,
            py,
            pz,
            0.04 + rng() * 0.09,
            cvx * 0.18,
            cvy * 0.18,
            cvz * 0.18,
            3.0,
          );
        }

        state.count = i;
        // Brief kickstart: let curl-noise + gravity deposit a little structure
        // (soft pulls on the head, slight wisps off the edges) before first render.
        state._kickstartFrames = 80;
      }

      // Milky Way — a dedicated barred-spiral portrait.  Logarithmic spiral
      // arms (pitch ≈ 12°), elongated central bar aligned with +X, thin dust
      // lanes on the trailing edge of the major arms, sparse spheroidal halo.
      //
      // Rendering uses the "mass" channel, so brighter stars come from
      // higher body masses.  Mass is carefully tiered so arms stand out
      // against inter-arm gaps: bulge >> arm-major > arm-minor > inter-arm.
      // Sgr A* is intentionally tiny (mass 80, bhHighlight 0) so the core
      // doesn't swallow the frame — real galaxies' central BH is visually
      // negligible next to the surrounding stellar mass.
      function sceneMilkyWay() {
        zero();
        const R_DISK = 240;
        const R_BAR = 48;
        const PITCH = (13 * Math.PI) / 180; // arm pitch angle (MW is ~12–13°)
        const COT_PITCH = 1 / Math.tan(PITCH); // ≈ 4.3
        // Central anchor mass.  Heavy enough to dominate the 91 nucleus
        // bulge stars around it (combined ~2400) so close encounters kick
        // the *stars*, not the BH.  Rendered as kind 5 (bulge) instead of
        // kind 2 so the shader's size×5 BH bonus doesn't turn it into a
        // crater — it still reads as the galactic core via the warm
        // TINT_MILKYWAY gold tint.
        const BH_MASS = 3200;
        const SPIN = +1;
        const SOFTENING = 2.5;
        const EPS2 = SOFTENING * SOFTENING;

        // Temporary crude v_circ estimate for use during placement; real
        // velocities are overwritten by the force-sum pass at the end.
        const mEncGuess = (r) =>
          BH_MASS + (25000 * (r * r)) / (r * r + 50 * 50);

        // Sgr A* — placed as kind 5 (bulge) so it picks up the warm gold
        // tint and avoids the shader's kind-2 size×5 multiplier.  Heavy
        // enough that neighbour stars bounce off it, not the other way.
        setBody(0, 0, 0, 0, BH_MASS, 0, 0, 0, 5.0);
        let i = 1;

        // ----- Bulge + bar (kind 5 → warm gold via TINT_MILKYWAY) -----
        // Elongated gaussian along X, thin vertically.  High masses = bright
        // gold bulge.  Inner dense core uses a tighter gaussian subset.
        const BAR_N = 260;
        for (let k = 0; k < BAR_N && i < MAX_BODIES; k++) {
          // 35% of bulge stars form a tight inner nucleus
          const nucleus = k < BAR_N * 0.35;
          const x = randn() * (nucleus ? 16 : 44);
          const y = randn() * 3.0;
          const z = randn() * (nucleus ? 9 : 18);
          const r = Math.sqrt(x * x + z * z);
          const safeR = Math.max(r, 6);
          const v = Math.sqrt(mEncGuess(safeR) / safeR) * 0.9;
          const tx = -z / Math.max(r, 0.5);
          const tz = x / Math.max(r, 0.5);
          const disp = v * 0.14;
          setBody(
            i++,
            x,
            y,
            z,
            // Heavy mass so bulge stars map to the bright end of the palette
            nucleus ? 18 + rng() * 18 : 10 + rng() * 14,
            tx * v * SPIN + randn() * disp,
            randn() * disp * 0.3,
            tz * v * SPIN + randn() * disp,
            5.0,
          );
        }

        // ----- Disk + spiral arms (kind 0) -----
        // Two major arms + two minor + sparse inter-arm field.  Arm stars
        // get heavier mass so they *read* as arms on the mass channel.
        const DISK_N = 3300;
        for (let k = 0; k < DISK_N && i < MAX_BODIES; k++) {
          let r = R_BAR + Math.pow(rng(), 0.55) * (R_DISK - R_BAR);
          r = Math.min(Math.max(r, R_BAR + 2), R_DISK);

          // Arm selection — 70% major, 15% minor, 15% inter-arm
          const armRoll = rng();
          let armK, armSpread, starMass;
          if (armRoll < 0.35) {
            armK = 0;
            armSpread = 0.11 + 0.0005 * r;
            starMass = 4.5 + rng() * 6.5;
          } else if (armRoll < 0.7) {
            armK = 1;
            armSpread = 0.11 + 0.0005 * r;
            starMass = 4.5 + rng() * 6.5;
          } else if (armRoll < 0.82) {
            armK = 2;
            armSpread = 0.18 + 0.0006 * r;
            starMass = 2.0 + rng() * 3.5;
          } else if (armRoll < 0.93) {
            armK = 3;
            armSpread = 0.18 + 0.0006 * r;
            starMass = 2.0 + rng() * 3.5;
          } else {
            // Inter-arm field star — scatters broadly, dim
            armK = Math.floor(rng() * 4);
            armSpread = 1.2;
            starMass = 0.8 + rng() * 1.3;
          }

          const thetaArm =
            SPIN * COT_PITCH * Math.log(r / R_BAR) + (armK * Math.PI) / 2;
          const theta = thetaArm + randn() * armSpread;

          const x = r * Math.cos(theta);
          const z = r * Math.sin(theta);
          // Thin disk, flares gently outward (real disks do this)
          const y = randn() * (2.6 + r * 0.008);

          const v = Math.sqrt(mEncGuess(r) / r);
          const tx = -Math.sin(theta) * SPIN;
          const tz = Math.cos(theta) * SPIN;
          // Toomre Q ~ 1.5: dispersion ~12% of circular velocity keeps
          // the disk marginally stable (hot enough not to fragment,
          // cold enough that arms still read).
          const disp = v * 0.12;

          setBody(
            i++,
            x,
            y,
            z,
            starMass,
            tx * v + randn() * disp,
            randn() * disp * 0.25,
            tz * v + randn() * disp,
            0.0,
          );
        }

        // ----- Dust lanes (kind 3) -----
        // Ride the trailing edge of each major arm — the tell-tale dark
        // stripe in edge-on spiral photos.
        const DUST_N = 180;
        for (let k = 0; k < DUST_N && i < MAX_BODIES; k++) {
          let r = R_BAR * 1.2 + Math.pow(rng(), 0.5) * (R_DISK * 0.8 - R_BAR);
          const armK = rng() < 0.5 ? 0 : 1;
          const thetaArm =
            SPIN * COT_PITCH * Math.log(r / R_BAR) + (armK * Math.PI) / 2;
          const theta = thetaArm + randn() * 0.07 - 0.1 * SPIN;
          const x = r * Math.cos(theta);
          const z = r * Math.sin(theta);
          const y = randn() * 1.3;
          const v = Math.sqrt(mEncGuess(r) / r);
          const tx = -Math.sin(theta) * SPIN;
          const tz = Math.cos(theta) * SPIN;
          setBody(
            i++,
            x,
            y,
            z,
            0.2 + rng() * 0.3,
            tx * v + randn() * v * 0.02,
            randn() * v * 0.01,
            tz * v + randn() * v * 0.02,
            3.0,
          );
        }

        // ----- Stellar halo (kind 4) -----
        // Spheroidal, dispersion-supported.  Very sparse + dim — provides
        // a faint spherical glow only visible in wide shots with showHalo.
        const HALO_BUDGET = MAX_BODIES - i;
        const HALO_N = Math.min(355, HALO_BUDGET);
        for (let k = 0; k < HALO_N && i < MAX_BODIES; k++) {
          const theta = Math.acos(2 * rng() - 1);
          const phi = rng() * 2 * Math.PI;
          const r = 80 + Math.pow(rng(), 0.55) * 280;
          const x = r * Math.sin(theta) * Math.cos(phi);
          const y = r * Math.cos(theta);
          const z = r * Math.sin(theta) * Math.sin(phi);
          const v = Math.sqrt(mEncGuess(r) / r) * 0.55;
          const pos = new THREE.Vector3(x, y, z);
          const rand = new THREE.Vector3(randn(), randn(), randn());
          const tang = new THREE.Vector3()
            .crossVectors(pos, rand)
            .normalize()
            .multiplyScalar(v);
          setBody(
            i++,
            x,
            y,
            z,
            0.6 + rng() * 0.8,
            tang.x + randn() * v * 0.22,
            tang.y + randn() * v * 0.22,
            tang.z + randn() * v * 0.22,
            4.0,
          );
        }

        state.count = i;

        // ----- Force-sum pass: set stable circular velocities -----
        // Compute the actual radial gravitational force at each disk/bulge/
        // dust body's position from every other placed body (same softened
        // Newtonian formula the GPU shader uses), then derive v_circ =
        // sqrt(F_inward · r).  This replaces the crude mEncGuess estimate
        // with velocities matched to whatever mass distribution we actually
        // ended up with — the disk can't collapse because v_circ is by
        // construction the circular speed for the real potential here.
        const N = state.count;
        const P = state.positions;
        const V = state.velocities;
        for (let k = 1; k < N; k++) {
          // 1 = skip BH itself (stays at 0,0,0 with zero velocity)
          const kindK = Math.floor(V[k * 4 + 3]);
          if (kindK === 4) continue; // halo keeps its dispersion-only velocity
          const px = P[k * 4 + 0];
          const py = P[k * 4 + 1];
          const pz = P[k * 4 + 2];
          let Fx = 0;
          let Fz = 0;
          for (let j = 0; j < N; j++) {
            if (j === k) continue;
            const dx = P[j * 4 + 0] - px;
            const dy = P[j * 4 + 1] - py;
            const dz = P[j * 4 + 2] - pz;
            const mj = P[j * 4 + 3];
            if (mj <= 0) continue;
            const r2 = dx * dx + dy * dy + dz * dz + EPS2;
            const inv = mj / (r2 * Math.sqrt(r2));
            Fx += dx * inv;
            Fz += dz * inv;
          }
          const r_xz = Math.sqrt(px * px + pz * pz);
          if (r_xz < 0.5) continue;
          // F · r_hat = (Fx·px + Fz·pz) / r_xz (negative = inward).
          // v² = F_inward · r = -(Fx·px + Fz·pz).
          const v2 = Math.max(0, -(Fx * px + Fz * pz));
          const vcirc = Math.sqrt(v2);
          const tx = (-pz / r_xz) * SPIN;
          const tz = (px / r_xz) * SPIN;
          // Keep kind-appropriate dispersion from the placement loop.
          const dispFrac =
            kindK === 3
              ? 0.02 // dust — cold
              : kindK === 5
                ? 0.14 // bulge — pressure-supported
                : 0.12; // disk — Toomre Q ~ 1.5
          const disp = vcirc * dispFrac;
          V[k * 4 + 0] = tx * vcirc + randn() * disp;
          V[k * 4 + 1] = randn() * disp * 0.25;
          V[k * 4 + 2] = tz * vcirc + randn() * disp;
          // .w (kind) left as-is
        }
      }

      // ===============================================================
      // 13b. CINEMATIC ARCS  (BREATHING_ARCS_PLAN.md, phase 1)
      // ===============================================================
      // An "arc" groups a handful of scenes into a 30–75 minute

      // using the existing pickTransitionFlavour grammar. ARC_GRAPH
      // governs which arc can follow which — keeps macro flow
      // coherent across the night.
      const ARCS = {
        "evening-drift": {
          name: "Evening Drift",
          durationMin: [45, 75],
          scenes: [
            "quiet-drift",
            "milky-way",
            "dust-storm",
            "lattice",
            "horsehead",

          energyCurve: "bell", // slow build → peak → slow fall

        "collision-suite": [

      const ARC_ORDER = Object.keys(ARCS);
      const ARC_HISTORY_DEPTH = 2;
      const WITHIN_ARC_TRANSITION_MS = 60000; // soft dissolves inside an arc

      // ===============================================================
      // 13c. TOKEN MODE  (INTERACTIVE_NFT.md — one living scene per token)
      // ===============================================================
      // Decisions 2026-09-05: Ethereum, 100 tokens, Petrova out, music
      // out, density is a device concern (never a trait). The hash →
      // recipe draw order below is versioned: changing a weight table or
      // adding a draw after the first mint means bumping TOKEN_RECIPE_V
      // and keeping the old path alive for older tokens.
      const TOKEN_RECIPE_V = 1;
      // [scene, weight]. Tiers: common 8 · uncommon 4 (collision 6 — it
      // carries five scenarios) · rare 2. petrova-line / ship-test are
      // excluded (IP, INTERACTIVE_NFT.md §8.1).
      const TOKEN_FAMILIES = [
        ["quiet-drift", 8],
        ["dust-storm", 8],
        ["coma", 8],
        ["lattice", 8],
        ["orrery", 8],
        ["milky-way", 8],
        ["sombrero", 8],
        ["horsehead", 8],
        ["collision", 6],
        ["whirlpool", 4],
        ["cartwheel", 4],
        ["antennae", 4],
        ["stephans-quintet", 4],
        ["bullet-cluster", 4],
        ["virgo-m87", 4],
        ["sagittarius", 2],
        ["event-horizon", 2],

      ];
      // Planned distribution for the self-hosted edition: exact per-family
      // counts from the weights (largest-remainder rounding), then a
      // seeded shuffle so ids aren't grouped by family. Data, not code —
      // __tokenPlan() prints it; hand-edit TOKEN_PLAN_OVERRIDES to pin
      // specific ids to families before the mint.
      const TOKEN_PLAN_OVERRIDES = {}; // { id: sceneKey }
      function buildTokenPlan(n) {
        const total = TOKEN_FAMILIES.reduce((s, p) => s + p[1], 0);
        const quota = TOKEN_FAMILIES.map(([k, w]) => ({ k, exact: (w / total) * n }));
        let counts = quota.map((q) => ({ k: q.k, c: Math.floor(q.exact), rem: q.exact - Math.floor(q.exact) }));
        let used = counts.reduce((s, c) => s + c.c, 0);
        counts
          .slice()
          .sort((a, b) => b.rem - a.rem)
          .forEach((c) => {
            if (used < n) {
              c.c++;
              used++;

          });

        for (const c of counts) for (let i = 0; i < c.c; i++) list.push(c.k);
        const r = mulberry32(fold32(TOKEN_ID_SALT + ":plan"));
        for (let i = list.length - 1; i > 0; i--) {
          const j = Math.floor(r() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
        for (const id of Object.keys(TOKEN_PLAN_OVERRIDES)) {
          const i = parseInt(id, 10) - 1;
          if (i >= 0 && i < list.length && SCENES[TOKEN_PLAN_OVERRIDES[id]]) {
            list[i] = TOKEN_PLAN_OVERRIDES[id];

      }
      const TOKEN_PLAN = buildTokenPlan(TOKEN_EDITION);
      if (typeof window !== "undefined") {
        window.__tokenPlan = () => {

        ["long-shadow", 3],

      const TOKEN_CHANNEL_WEIGHTS = {

        density: 0,
        mass: 1,
        kind: 1,

      const TOKEN_CAM_DIST = { orrery: 0.5 };
      const TOKEN_EXPOSURE_MUL = { lattice: 1.35, coma: 1.2, orrery: 1.2 };
      const TOKEN_PREROLL = {
        default: 400,
        lattice: 900,
        whirlpool: 2400, // companion pericenter ≈ 2200 steps; arms after
        cartwheel: 1200, // ring wave emerges ~1000–1300 steps in
        collision: 500, // longer and the remnant drifts off the target
        antennae: 500,
        "stephans-quintet": 600,
        "bullet-cluster": 600,
        birth: 120, // an expanding shell — its beauty is early
        "event-horizon": 300,
        sagittarius: 300,
        "virgo-m87": 300,
      };

      // FNV-1a over the hash string → 32-bit PRNG seed.
      function fold32(str) {
        let h = 0x811c9dc5;

      }
      // Authored pose nudged about its target. Conservative on purpose —

      // Returns the share-state cam[7] array.
      function tokenPerturbCamera(c, r, scene) {
        const gentle = TOKEN_TOUR_TEMPLATE[scene] === "well";
        const yawDeg = gentle ? 10 : 25;
        const pitchDeg = gentle ? 4 : 8;
        const yaw = (r() * 2 - 1) * ((yawDeg * Math.PI) / 180);
        const pitch = (r() * 2 - 1) * ((pitchDeg * Math.PI) / 180);
        const dist =
          (1.0 + r() * (gentle ? 0.1 : 0.2)) * (TOKEN_CAM_DIST[scene] ?? 1);
        const tgt = new THREE.Vector3().fromArray(c.tgt);
        const rel = new THREE.Vector3().fromArray(c.pos).sub(tgt);
        const sph = new THREE.Spherical().setFromVector3(rel);
        sph.theta += yaw;
        sph.phi = Math.max(0.15, Math.min(Math.PI - 0.15, sph.phi + pitch));
        sph.radius *= dist;
        const p = new THREE.Vector3().setFromSpherical(sph).add(tgt);
        return [
          +p.x.toFixed(3),
          +p.y.toFixed(3),
          +p.z.toFixed(3),
          +tgt.x.toFixed(3),
          +tgt.y.toFixed(3),
          +tgt.z.toFixed(3),

      }
      // hash → recipe. Fixed draw order; every r() below is load-bearing.
      // The `share` field is a share-state object, so applyShareState()
      // is the whole apply path.
      function deriveTokenRecipe(hash, opts) {
        const o = opts || {};
        const r = mulberry32(fold32(String(hash)));
        const drawn = weightedPick(TOKEN_FAMILIES, r()); // always consumed
        const scene = o.scene && SCENES[o.scene] ? o.scene : drawn;
        const sc = SCENES[scene];
        const seed = (r() * 0xffffffff) >>> 0;
        const scenarioRoll = r();
        let collisionScenario;
        if (scene === "collision") {
          collisionScenario = weightedPick(
            Object.keys(COLLISION_SCENARIOS).map((k) => [k, 1]),
            scenarioRoll,
          );
        }
        const palettePool = TOKEN_PALETTE_POOL.includes(sc.palette)
          ? TOKEN_PALETTE_POOL
          : [sc.palette, ...TOKEN_PALETTE_POOL];
        const palette = weightedPick(
          palettePool.map((k) => [k, k === sc.palette ? TOKEN_OWN_WEIGHT : 1]),
          r(),
        );
        // Channel stays authored: the contact sheet showed that a drawn
        // channel can paint a family black (density on a diffuse scene,
        // kind on single-kind stars with a dark-start palette). An authored
        // `age` (birth) is the darkest stop at the token's first moments,
        // so it becomes `speed`. TOKEN_CHANNEL_WEIGHTS is kept for a later
        // per-family opt-in.
        const channel = sc.channel === "age" ? "speed" : sc.channel;
        const pert = (v, f) => +((v ?? 0) * (1 - f + 2 * f * r())).toFixed(3);
        const bloom = pert(sc.post.bloom, 0.15);
        const exposure = +(
          pert(sc.post.exposure, 0.08) * (TOKEN_EXPOSURE_MUL[scene] ?? 1)
        ).toFixed(3);
        const grain = pert(sc.post.grain, 0.25);
        const longExposure = (sc.post.trail ?? 0) < 0.5 && r() < 0.12;
        const trail = longExposure
          ? TOKEN_LONG_EXPOSURE_TRAIL
          : (sc.post.trail ?? 0);
        const dopplerRoll = r();
        const doppler =
          (sc.doppler ?? 0) > 0 ? sc.doppler : dopplerRoll < 0.15 ? 0.3 : 0;
        const spinRoll = r();
        const spin =
          spinRoll < 0.08 ? TOKEN_SPIN : spinRoll < 0.16 ? -TOKEN_SPIN : 0;
        const temperament = weightedPick(TOKEN_TEMPERAMENTS, r());
        const signature =
          TOKEN_SIGNATURE_LABEL[TOKEN_TOUR_TEMPLATE[scene] || "calm"];
        const cam = tokenPerturbCamera(sc.camera, r, scene);
        return {
          v: TOKEN_RECIPE_V,
          hash: String(hash),
          id: o.id ?? null,
          temperament,
          signature,
          scene,
          seed,
          collisionScenario,
          palette,
          channel,
          longExposure,
          doppler,
          spin,
          share: {
            v: 1,
            scene,
            seed,
            cam,
            palette,
            channel,
            collisionScenario,
            post: {
              bloom,
              bloomRadius: sc.post.bloomRadius,
              exposure,
              ca: sc.post.ca,
              vignette: sc.post.vignette,
              grain,
              trail,
              doppler,
            },
          },
        };
      }
      function tokenTraits(rec) {
        const sc = SCENES[rec.scene];
        return {
          ...(rec.id ? { Token: `#${rec.id} of ${TOKEN_EDITION}` } : {}),
          Family: sc ? sc.name : rec.scene,
          Temperament: TOKEN_TEMPERAMENT_LABEL[rec.temperament] || rec.temperament,
          Signature: rec.signature,
          Variant: rec.collisionScenario || "—",
          Palette: rec.palette,
          Channel: rec.channel,
          Exposure: rec.longExposure ? "long" : "short",
          Spin: rec.spin > 0 ? "prograde" : rec.spin < 0 ? "retrograde" : "none",
          Doppler: rec.doppler > 0 ? "on" : "off",

      }

      let tokenRecipe = null;
      let tokenStar = -1; // the body the tour tracked — "the token's star"
      async function tokenBoot() {
        tokenRecipe = deriveTokenRecipe(
          TOKEN.hash,
          TOKEN.id ? { scene: TOKEN_PLAN[TOKEN.id - 1], id: TOKEN.id } : {},
        );
        // Backdrop from the hash too, so frame one reproduces.
        buildStarfield(mulberry32(fold32(TOKEN.hash + ":sky")));
        installTokenUi();
        await applyTokenRecipe();
        // Temperament: the director flavour this token lives in. No
        // rotation — the flavour is part of the identity.
        if (FLAVOURS[tokenRecipe.temperament]) {
          director.flavour = tokenRecipe.temperament;
        }
        director.rotateMode = false;
        tokenMomentsInit();
        const traits = tokenTraits(tokenRecipe);
        try {
          if (TOKEN.platform === "fxhash" && typeof $fx.features === "function") {
            $fx.features(traits);

            TOKEN.platform === "highlight" &&
            hl.token &&
            typeof hl.token.setTraits === "function"

        window.__tokenRecipe = () => tokenRecipe;
        window.__tokenFeatures = () => traits;

      }
      // (Re)build the token's universe from its recipe. Also "Return to

      async function applyTokenRecipe() {
